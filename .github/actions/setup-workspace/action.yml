name: Setup Workspace
description: Shared Node, optional tooling cache, and optional npm install scaffolding for GitHub Actions jobs.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24.16.0"
  cache-npm:
    description: Whether to enable setup-node npm cache.
    required: false
    default: "true"
  tooling-cache:
    description: >-
      Whether to restore the shared build, lint, typecheck, and browser cache.
      Enable only for jobs that consume those artifacts.
    required: false
    default: "false"
  tooling-cache-save:
    description: >-
      Whether this job should also upload a fresh tooling cache at job end.
      Only jobs that produce new tooling state (builds, lint/typecheck caches,
      browser installs) should save; restore-only jobs use a deterministic key
      so the post-job save is skipped on the exact hit.
    required: false
    default: "false"
  install-deps:
    description: Whether to run npm ci after setup.
    required: false
    default: "true"
  bootstrap-generated:
    description: Whether to materialize bootstrap-safe generated projections after npm ci.
    required: false
    default: "true"
  install-playwright-chromium:
    description: Whether to install the Playwright Chromium browser after npm dependencies are installed.
    required: false
    default: "false"
  install-playwright-firefox:
    description: Whether to install the Playwright Firefox browser after npm dependencies are installed.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - if: ${{ inputs.cache-npm == 'true' }}
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - if: ${{ inputs.cache-npm != 'true' }}
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.node-version }}

    - if: ${{ inputs.tooling-cache == 'true' }}
      id: tooling-cache-key
      shell: bash
      env:
        RAW_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        raw_node_version="${RAW_NODE_VERSION}"
        node_key="${raw_node_version}"

        if [[ "${raw_node_version}" =~ ^v?([0-9]+)(\..*)?$ ]]; then
          node_key="${BASH_REMATCH[1]}"
        fi

        node_key="${node_key//[^A-Za-z0-9_.-]/-}"
        echo "node-key=${node_key}" >> "${GITHUB_OUTPUT}"

    - if: ${{ inputs.tooling-cache == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .next/cache
          .cache/eslint
          ~/.cache/ms-playwright
          *.tsbuildinfo
          worker/*.tsbuildinfo
        # Saving jobs get a per-run unique key so the post-job save always
        # uploads fresh state; restore-only jobs get a deterministic key whose
        # exact hit suppresses the save, keeping ~6 near-identical multi-hundred
        # MB uploads per run from churning the repo's 10 GB cache (and LRU-
        # evicting the entries the restore-keys below depend on).
        key: tooling-cache-${{ runner.os }}-${{ steps.tooling-cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'tsconfig.typecheck.json', 'worker/tsconfig.json') }}-${{ github.job }}${{ inputs.tooling-cache-save == 'true' && format('-{0}-{1}', github.run_id, github.run_attempt) || '' }}
        restore-keys: |
          tooling-cache-${{ runner.os }}-${{ steps.tooling-cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'tsconfig.typecheck.json', 'worker/tsconfig.json') }}-${{ github.job }}-
          tooling-cache-${{ runner.os }}-${{ steps.tooling-cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'tsconfig.typecheck.json', 'worker/tsconfig.json') }}-
          tooling-cache-${{ runner.os }}-${{ steps.tooling-cache-key.outputs.node-key }}-

    - if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      run: npm ci

    - if: ${{ inputs.install-deps == 'true' && inputs.bootstrap-generated == 'true' }}
      shell: bash
      run: npm run bootstrap:generated

    - if: ${{ inputs.install-playwright-chromium == 'true' }}
      shell: bash
      run: npx --no-install playwright install --with-deps chromium

    - if: ${{ inputs.install-playwright-firefox == 'true' }}
      shell: bash
      run: npx --no-install playwright install --with-deps firefox
