name: Setup Workspace
description: Shared Node, scoped CI caches, and optional npm install scaffolding for GitHub Actions jobs.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24.16.0"
  cache-npm:
    description: Whether to enable setup-node npm cache.
    required: false
    default: "true"
  static-cache:
    description: Whether to restore ESLint and TypeScript incremental state.
    required: false
    default: "false"
  browser-cache:
    description: Whether to restore the Playwright browser download cache.
    required: false
    default: "false"
  workspace-artifact:
    description: Required run-scoped workspace transport (publish, restore, or none).
    required: false
    default: "none"
  workspace-artifact-name:
    description: Exact producer-owned workspace artifact name (required for restore).
    required: false
    default: ""
  install-deps:
    description: Whether to run npm ci after setup.
    required: false
    default: "true"
  bootstrap-generated:
    description: Whether to materialize bootstrap-safe generated projections after npm ci.
    required: false
    default: "true"
  bootstrap-history:
    description: >-
      Whether to materialize the git-history-derived projections (sitemap-dates,
      docs-metadata) after npm ci. Requires actions/checkout with fetch-depth: 0;
      the generators fail fast on a shallow checkout.
    required: false
    default: "false"
  install-playwright-chromium:
    description: Whether to install the Playwright Chromium browser after npm dependencies are installed.
    required: false
    default: "false"
  install-playwright-firefox:
    description: Whether to install the Playwright Firefox browser after npm dependencies are installed.
    required: false
    default: "false"

outputs:
  workspace-artifact-name:
    description: Published workspace artifact name, including the producer attempt.
    value: ${{ steps.workspace-artifact-name.outputs.name }}
  static-cache-key:
    description: Restore key for a designated workflow writer to save after validation.
    value: ${{ steps.static-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - if: ${{ inputs.cache-npm == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - if: ${{ inputs.cache-npm != 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - if: ${{ inputs.static-cache == 'true' || inputs.browser-cache == 'true' }}
      id: cache-key
      shell: bash
      env:
        RAW_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        raw_node_version="${RAW_NODE_VERSION}"
        node_key="${raw_node_version}"

        if [[ "${raw_node_version}" =~ ^v?([0-9]+)(\..*)?$ ]]; then
          node_key="${BASH_REMATCH[1]}"
        fi

        node_key="${node_key//[^A-Za-z0-9_.-]/-}"
        echo "node-key=${node_key}" >> "${GITHUB_OUTPUT}"

    - if: ${{ inputs.static-cache == 'true' }}
      id: static-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          .cache/eslint
          *.tsbuildinfo
          worker/*.tsbuildinfo
        key: static-cache-${{ runner.os }}-${{ steps.cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.typecheck.json', 'worker/tsconfig.json') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          static-cache-${{ runner.os }}-${{ steps.cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.typecheck.json', 'worker/tsconfig.json') }}-${{ github.job }}-
          static-cache-${{ runner.os }}-${{ steps.cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.typecheck.json', 'worker/tsconfig.json') }}-
          static-cache-${{ runner.os }}-${{ steps.cache-key.outputs.node-key }}-

    - if: ${{ inputs.browser-cache == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: browser-cache-${{ runner.os }}-${{ steps.cache-key.outputs.node-key }}-${{ hashFiles('package-lock.json') }}

    - name: Resolve workspace artifact name
      id: workspace-artifact-name
      if: ${{ inputs.workspace-artifact == 'publish' || inputs.workspace-artifact == 'restore' }}
      shell: bash
      env:
        WORKSPACE_ARTIFACT_MODE: ${{ inputs.workspace-artifact }}
        WORKSPACE_ARTIFACT_NAME: ${{ inputs.workspace-artifact-name }}
      run: |
        if [ "${WORKSPACE_ARTIFACT_MODE}" = "publish" ]; then
          WORKSPACE_ARTIFACT_NAME="pr-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
        fi
        if [[ ! "${WORKSPACE_ARTIFACT_NAME}" =~ ^pr-workspace-"${GITHUB_RUN_ID}"-[1-9][0-9]*-"${GITHUB_SHA}"$ ]]; then
          echo "::error::Invalid producer workspace artifact name."
          exit 1
        fi
        echo "name=${WORKSPACE_ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

    - if: ${{ inputs.workspace-artifact == 'restore' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ steps.workspace-artifact-name.outputs.name }}
        path: ${{ runner.temp }}/pharos-workspace

    - if: ${{ inputs.workspace-artifact == 'restore' }}
      shell: bash
      run: tar --zstd -xf "${RUNNER_TEMP}/pharos-workspace/workspace.tar.zst" --same-permissions

    - if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      run: npm ci

    - if: ${{ inputs.install-deps == 'true' && inputs.bootstrap-generated == 'true' }}
      shell: bash
      run: npm run bootstrap:generated

    - if: ${{ inputs.install-deps == 'true' && inputs.bootstrap-history == 'true' }}
      shell: bash
      run: npm run bootstrap:generated:history

    - name: Verify bootstrap preserved committed artifacts
      if: ${{ inputs.workspace-artifact != 'none' || (inputs.install-deps == 'true' && inputs.bootstrap-generated == 'true') }}
      shell: bash
      run: node --input-type=module -e 'import { assertBootstrapTrackedOutputsUnchanged } from "./scripts/lib/bootstrap-tracked-outputs.mts"; assertBootstrapTrackedOutputsUnchanged();'

    - name: Package required workspace
      if: ${{ inputs.workspace-artifact == 'publish' }}
      shell: bash
      env:
        WORKSPACE_PATHS: |
          node_modules
          src/generated
          src/lib/case-study-client-index.ts
          src/data/changelogs/index.ts
          public/llms.txt
          public/openapi.json
          public/postman
          public/maps/world-countries.svg
          shared/data/stablecoins/coins.generated.json
          shared/data/stablecoins/coins.client.detail
          shared/data/stablecoins/coins.client.list.generated.json
          shared/data/stablecoins/coins.compliance.generated.json
          shared/data/stablecoins/coins.telegram-mini-app.generated.json
          shared/data/stablecoins/coins.worker-runtime.generated.json
          shared/data/stablecoins/coins.worker-full.generated.json
          shared/data/stablecoins/report-card-registry-fingerprint.generated.ts
          shared/data/stablecoins/legacy-llama-redirects.generated.json
          shared/data/safety-score-v9/shock-coverage-measurements-v1.json
          shared/data/safety-score-v9/evaluation-build-manifest-v1.ts
      run: |
        mkdir -p "${RUNNER_TEMP}/pharos-workspace"
        mapfile -t paths <<< "${WORKSPACE_PATHS%$'\n'}"
        if [ -d worker/node_modules ]; then paths+=(worker/node_modules); fi
        if [ -f .tmp/pr-test-plan.json ]; then paths+=(.tmp/pr-test-plan.json); fi
        # zstd is preinstalled on ubuntu-latest: https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#tools
        tar -I 'zstd -T0 -3' -cf "${RUNNER_TEMP}/pharos-workspace/workspace.tar.zst" "${paths[@]}"

    - if: ${{ inputs.workspace-artifact == 'publish' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.workspace-artifact-name.outputs.name }}
        path: ${{ runner.temp }}/pharos-workspace/workspace.tar.zst
        if-no-files-found: error
        compression-level: 0
        retention-days: 1


    - if: ${{ inputs.install-playwright-chromium == 'true' }}
      shell: bash
      run: npx --no-install playwright install --with-deps chromium

    - if: ${{ inputs.install-playwright-firefox == 'true' }}
      shell: bash
      run: npx --no-install playwright install --with-deps firefox
