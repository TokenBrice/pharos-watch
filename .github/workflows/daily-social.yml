name: Daily Pharos Data Post

on:
  schedule:
    # UTC preparation candidates for both CET and CEST. The plan accepts only
    # 13:00–14:00 Europe/Belgrade; the Worker owns the 14:00 publication clock.
    - cron: "7,27,47 11,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Sole manifest writer. Completed editions are immutable, including reruns.
concurrency:
  group: daily-pharos-data-post
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOCIAL_OUT_DIR: agents/daily-social/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-workspace
        with:
          browser-cache: "false"
          bootstrap-generated: "false"
          install-playwright-firefox: "false"
      - name: Plan today's Belgrade edition
        id: plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_MAP_KV_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
        run: npx tsx scripts/maintenance/publish-daily-social.ts plan
      - name: Prepare renderer dependencies
        if: steps.plan.outputs.should_prepare == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          install-deps: "false"
          bootstrap-generated: "false"
          browser-cache: "true"
          install-playwright-firefox: "true"
      - name: Capture the scheduled topic
        if: steps.plan.outputs.should_prepare == 'true'
        env:
          PHAROS_API_KEY: ${{ secrets.PHAROS_API_KEY }}
        run: npx tsx scripts/maintenance/publish-daily-social.ts capture --out-dir="${SOCIAL_OUT_DIR}"
      - name: Render data-matched graphic
        if: steps.plan.outputs.should_prepare == 'true'
        run: npx tsx scripts/maintenance/build-daily-social.ts --input="${SOCIAL_OUT_DIR}/snapshot.json" --out="${SOCIAL_OUT_DIR}/poster.png"
      - name: Validate publication without mutation
        if: steps.plan.outputs.should_prepare == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_MAP_KV_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
        run: npx tsx scripts/maintenance/publish-daily-social.ts publish --dry-run --out-dir="${SOCIAL_OUT_DIR}"
      - name: Publish immutable image and manifest
        if: steps.plan.outputs.should_prepare == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_MAP_KV_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
        run: npx tsx scripts/maintenance/publish-daily-social.ts publish --out-dir="${SOCIAL_OUT_DIR}"
      - name: Preserve reviewed inputs and rendered edition
        if: always() && steps.plan.outputs.should_prepare == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-social-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOCIAL_OUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
