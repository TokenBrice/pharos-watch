name: Worker Memory Monitor

on:
  schedule:
    - cron: "43 * * * *"
    - cron: "17 1 * * *" # Daily bounded incident evidence, after the UTC day closes.
  workflow_dispatch:
    inputs:
      from:
        description: "Optional inclusive ISO timestamp (requires to; at most 48 hours)"
        required: false
        type: string
      to:
        description: "Optional exclusive ISO timestamp (requires from)"
        required: false
        type: string

permissions:
  contents: read

  actions: read
concurrency:
  group: worker-memory-monitor
  cancel-in-progress: false

jobs:
  memory:
    name: Collect Worker memory evidence
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-generated: "false"
          bootstrap-history: "false"
          install-playwright-chromium: "false"
          install-playwright-firefox: "false"
      - name: Collect sampled isolate memory and filtered kills
        id: collect
        continue-on-error: true
        env:
          CLOUDFLARE_WORKERS_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        shell: bash
        run: |
          args=(--out-dir "$RUNNER_TEMP/worker-memory")
          if [[ -n "$INPUT_FROM" ]]; then args+=(--from "$INPUT_FROM"); fi
          if [[ -n "$INPUT_TO" ]]; then args+=(--to "$INPUT_TO"); fi
          npm run ops:worker-memory -- "${args[@]}"
      - name: Append evidence summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/worker-memory/report.md" ]]; then
            cat "$RUNNER_TEMP/worker-memory/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve memory evidence before verdicts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/worker-memory/report.json
            ${{ runner.temp }}/worker-memory/report.md
            ${{ runner.temp }}/worker-memory/samples.ndjson
            ${{ runner.temp }}/worker-memory/exceeded-memory.ndjson
            ${{ runner.temp }}/worker-memory/queries.json
          if-no-files-found: error
          retention-days: 30
      - name: Heavy kill observed
        if: ${{ always() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          try {
            const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/worker-memory/report.json`, 'utf8'));
            if (report.schemaVersion === 1 && report.verdict?.heavyKillObserved === true) {
              const safe = value => String(value).replace(/[^\x20-\x7e]/g, ' ').replace(/::/g, ': :').slice(0, 160).replace(/%/g, '%25');
              const lanes = report.exceededMemory.groups
                .filter(row => row.workerRole === 'heavy' && Date.parse(row.adaptive.dimensions.datetime) >= Date.parse(report.verdict.alertFrom) && Date.parse(row.adaptive.dimensions.datetime) < Date.parse(report.verdict.alertTo))
                .slice(0, 5)
                .map(row => `lane=${safe(row.lane?.cron ?? 'unattributed')} schedule=${safe(row.lane?.scheduleKey ?? 'unattributed')} correlation=${safe(row.correlation)} requests=${safe(row.adaptive.sum.requests)}`);
              console.error(`::error::heavy-exceeded-memory-observed; ${lanes.join('; ') || 'lane=unattributed'}; inspect retained candidate-job evidence`);
              process.exitCode = 1;
            }
          } catch { /* Missing evidence belongs to the separate collection incident. */ }
          NODE
      - name: Collection incomplete
        if: ${{ always() }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          try {
            const root = `${process.env.RUNNER_TEMP}/worker-memory`;
            const report = JSON.parse(readFileSync(`${root}/report.json`, 'utf8'));
            const verdict = report.verdict;
            if (report.schemaVersion !== 1 || typeof verdict?.heavyKillObserved !== 'boolean' || typeof verdict?.collectionIncomplete !== 'boolean' || typeof verdict?.freshnessFailed !== 'boolean' || ![0, 1].includes(verdict.exitCode)
                || !['report.json', 'report.md', 'samples.ndjson', 'exceeded-memory.ndjson', 'queries.json'].every(file => existsSync(`${root}/${file}`))) throw new Error();
            if (verdict.collectionIncomplete || process.env.COLLECT_OUTCOME !== (verdict.exitCode === 0 ? 'success' : 'failure')) {
              console.error('::error::collection-incomplete; inspect retained source coverage and machine reasons');
              process.exitCode = 1;
            }
            if (verdict.freshnessFailed) {
              console.error('::error::coverage-stale; default-window evidence exceeds the coverage-lag budget');
              process.exitCode = 1;
            }
          } catch {
            console.error('::error::report-unreadable; required memory evidence unavailable');
            process.exitCode = 1;
          }
          NODE

  incidents:
    name: Capture 21-day Worker incident evidence
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 1 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-generated: "false"
          bootstrap-history: "false"
          install-playwright-chromium: "false"
          install-playwright-firefox: "false"
      - name: Restore latest rolling evidence archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/worker-incidents-previous"
          artifact_id="$(gh api --paginate --slurp "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '[.[].artifacts[] | select(.expired == false and (.name | startswith("worker-incidents-")) and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/worker-incidents-previous.zip"
            unzip -q "$RUNNER_TEMP/worker-incidents-previous.zip" -d "$RUNNER_TEMP/worker-incidents-previous"
          fi
      - name: Capture deployment delivery child and publication evidence
        if: ${{ always() && !cancelled() }}
        id: incidents
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_ANALYTICS_API_TOKEN }}
        run: >-
          node --import tsx scripts/maintenance/watch-worker-cron.mjs
          --incident-bundle --out-dir "${{ runner.temp }}/worker-incidents"
          --archive-dir "${{ runner.temp }}/worker-incidents-previous"
      - name: Preserve incident evidence before collection verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-incidents-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/worker-incidents/bundle.json
            ${{ runner.temp }}/worker-incidents/report.md
          if-no-files-found: error
          retention-days: 21
      - name: Append incident completeness summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/worker-incidents/report.md" ]]; then
            cat "$RUNNER_TEMP/worker-incidents/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Incident collection failed
        if: ${{ always() && steps.incidents.outcome != 'success' }}
        run: |
          echo "::error::Worker incident collection failed; retained completeness labels distinguish unavailable from empty evidence."
          exit 1
