name: Pages Release

on:
  workflow_call:
    inputs:
      api_base_url:
        description: Optional API base used for digest sync and local artifact smoke.
        required: false
        default: ""
        type: string
      artifact_name:
        description: Artifact name for the built static export.
        required: false
        default: pages-static-export
        type: string

permissions:
  contents: read

jobs:
  pages-prepare:
    uses: ./.github/workflows/pages-prepare.yml
    with:
      api_base_url: ${{ inputs.api_base_url }}
      artifact_name: ${{ inputs.artifact_name }}
    secrets: inherit

  pages-publish:
    needs: pages-prepare
    uses: ./.github/workflows/pages-publish.yml
    with:
      artifact_name: ${{ inputs.artifact_name }}
    secrets: inherit
