name: Pages Release

on:
  workflow_call:
    inputs:
      api_base_url:
        description: Optional API base used for digest sync and local artifact smoke.
        required: false
        default: ""
        type: string
      artifact_name:
        description: Artifact name for the built static export.
        required: false
        default: pages-static-export
        type: string
    secrets:
      DIGEST_API_KEY:
        required: true
      DEPEG_EVENTS_API_KEY:
        required: false
      PUBLIC_DATASETS_API_KEY:
        required: false
      SITE_API_SHARED_SECRET:
        required: true
      SMOKE_API_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      OPS_SMOKE_CF_ACCESS_CLIENT_ID:
        required: true
      OPS_SMOKE_CF_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read

jobs:
  pages-prepare:
    uses: ./.github/workflows/pages-prepare.yml
    with:
      api_base_url: ${{ inputs.api_base_url }}
      artifact_name: ${{ inputs.artifact_name }}
    secrets:
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      DEPEG_EVENTS_API_KEY: ${{ secrets.DEPEG_EVENTS_API_KEY }}
      PUBLIC_DATASETS_API_KEY: ${{ secrets.PUBLIC_DATASETS_API_KEY }}
      SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}

  pages-publish:
    needs: pages-prepare
    uses: ./.github/workflows/pages-publish.yml
    with:
      artifact_name: ${{ inputs.artifact_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_SMOKE_CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_ID }}
      OPS_SMOKE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_SECRET }}
