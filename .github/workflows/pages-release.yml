name: Pages Release

on:
  workflow_call:
    inputs:
      workspace_artifact_name:
        description: Exact prepared workspace artifact name supplied by pages-prepare.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SITE_API_SHARED_SECRET:
        required: true
      SITE_SESSION_SIGNING_KEY:
        required: false
      # Production-environment secrets: callers must still pass them by name, or
      # this reusable job resolves them to empty strings.
      R2_SOCIAL_PREVIEWS_ACCESS_KEY_ID:
        required: true
      R2_SOCIAL_PREVIEWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  pages-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pharos.watch
    env:
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_SITE_SESSION_CHECK: ${{ vars.NEXT_PUBLIC_PHAROS_SITE_SESSION_CHECK }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History-derived compile inputs arrive in the prepared workspace;
          # post-refresh, build, gates, and deploy read no Git history.
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
      - name: Validate prepared workspace artifact name
        env:
          WORKSPACE_ARTIFACT_NAME: ${{ inputs.workspace_artifact_name }}
        run: |
          if [[ ! "${WORKSPACE_ARTIFACT_NAME}" =~ ^pages-workspace-production-"${GITHUB_RUN_ID}"-[1-9][0-9]*-"${GITHUB_SHA}"$ ]]; then
            echo "::error::Invalid prepared workspace artifact name."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.workspace_artifact_name }}
          path: ${{ runner.temp }}/pharos-pages-workspace
      - name: Restore prepared production workspace
        run: tar --zstd -xf "${RUNNER_TEMP}/pharos-pages-workspace/workspace.tar.zst" --same-permissions
      - name: Refresh API-backed release data
        env:
          SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
          SITE_SESSION_SIGNING_KEY: ${{ secrets.SITE_SESSION_SIGNING_KEY }}
          DIGEST_API_URL: https://site-api.pharos.watch
          DEPEG_EVENTS_API_URL: https://site-api.pharos.watch
          PUBLIC_DATASETS_API_URL: https://site-api.pharos.watch
          PUBLIC_DATASETS_REQUIRE_API: "1"
        run: node --import tsx scripts/maintenance/refresh-pages-release-data.ts
      - name: Build clean production export
        # Production builds deliberately start without a restored .next/cache.
        # A stale Webpack/PostCSS entry can otherwise pair new Tailwind class
        # names in HTML with an older generated stylesheet.
        env:
          PUBLIC_DATASETS_API_URL: ""
          PUBLIC_DATASETS_API_KEY: ""
          PUBLIC_DATASETS_REQUIRE_API: ""
          SMOKE_API_BASE: ""
          API_BASE_URL: ""
          # Cache-only bulk inputs (six concurrent batches) replace 2x488 per-coin
          # GETs; proven byte-identical against production on 2026-10-06.
          PHAROS_DETAIL_SNAPSHOT_SOURCE: bulk
          # Approved deploy tuning: four critical-CSS workers on the release runner.
          PHAROS_CRITICAL_CSS_WORKERS: "4"
          # Reuse compile-input artifacts already materialized by pages-prepare.
          PHAROS_GENERATED_SKIP_EXISTING_DEPS: "1"
          # R2-first evergreen OG previews: emit only the route map during build
          # so out/ stays lean; the pre-activation publisher renders and uploads
          # only identities absent from R2.
          PHAROS_OG_EVERGREEN_MAP_ONLY: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          PHAROS_DISABLE_WEBPACK_FS_CACHE: "1"
          PHAROS_NEXT_BUILD_CPUS: "4"
          SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
          SITE_SESSION_SIGNING_KEY: ${{ secrets.SITE_SESSION_SIGNING_KEY }}
          PHAROS_RELEASE_PR_TYPECHECKED: "1"
        run: |
          if [ -z "${SITE_API_SHARED_SECRET//[[:space:]]/}" ]; then
            echo "::error::SITE_API_SHARED_SECRET is required for cache-only bulk detail snapshot acquisition."
            exit 1
          fi
          npm run generated:post-refresh
          npx --no-install next build --webpack
          npm run postbuild
      - name: Reject signing key in exported site
        env:
          SITE_SESSION_SIGNING_KEY: ${{ secrets.SITE_SESSION_SIGNING_KEY }}
        run: |
          if [ -n "$SITE_SESSION_SIGNING_KEY" ] && grep -rqF -- "$SITE_SESSION_SIGNING_KEY" out; then
            echo "::error::Site session signing key found in exported site."
            exit 1
          fi
      - name: Validate Pages artifact gates (size, CSS integrity, flags, phishing, SEO/continuity)
        env:
          PAGES_RELEASE_DATA_ARCHIVE_PATH: ${{ runner.temp }}/pages-release-data.tar.zst
          SEO_PREVIOUS_SITEMAP_URL: https://stablecoin-dashboard.pages.dev/sitemap.xml
        # Includes feature-flag, direct-upload size, phishing-signature, and
        # static SEO gates over the exact release artifact, overlapped with
        # archiving the non-secret post-refresh replay inputs (both read-only).
        run: |
          npm run check:pages-release & gates_pid=$!
          node --import tsx --input-type=module -e 'import { createPagesReleaseDataArchive } from "./scripts/lib/pages-release-data.mts"; createPagesReleaseDataArchive(process.cwd(), process.env.PAGES_RELEASE_DATA_ARCHIVE_PATH);' & archive_pid=$!
          gates_status=0
          wait "$gates_pid" || gates_status=$?
          archive_status=0
          wait "$archive_pid" || archive_status=$?
          [ "$gates_status" -eq 0 ] && [ "$archive_status" -eq 0 ]
      - name: Retain post-refresh data for Pages PR and local replay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-release-data-${{ github.sha }}
          overwrite: true
          path: ${{ runner.temp }}/pages-release-data.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Write release marker
        run: |
          cat > out/__pharos_release.json <<EOF
          {"commit":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","runAttempt":"${GITHUB_RUN_ATTEMPT}","createdAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
      - name: Capture release artifact metrics
        run: |
          total_files="$(find out -type f | wc -l | tr -d ' ')"
          output_size="$(du -sh out | awk '{print $1}')"
          TOTAL_FILES="${total_files}" OUTPUT_SIZE="${output_size}" node <<'NODE'
          const { appendFileSync } = require("node:fs");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Pages release",
            "",
            `- Commit: \`${process.env.GITHUB_SHA}\``,
            `- Output: ${process.env.TOTAL_FILES} files, ${process.env.OUTPUT_SIZE}`,
            `- Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            "- Rollback: select the prior successful deployment in Cloudflare Pages deployment history.",
            "",
          ].join("\n"));
          NODE
      - name: Save live sitemap for IndexNow diff
        if: ${{ vars.INDEXNOW_ENABLED == 'true' }}
        continue-on-error: true
        run: curl -fsS --max-time 30 -o "${RUNNER_TEMP}/previous-sitemap.xml" https://pharos.watch/sitemap.xml
      - name: Publish immutable preview objects before Pages activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_SOCIAL_PREVIEWS_ACCESS_KEY_ID: ${{ secrets.R2_SOCIAL_PREVIEWS_ACCESS_KEY_ID }}
          R2_SOCIAL_PREVIEWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SOCIAL_PREVIEWS_SECRET_ACCESS_KEY }}
        run: npm run publish:social-previews -- --out-dir out --execute
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler pages deploy out
          --project-name=stablecoin-dashboard
          --branch=main
          --commit-hash="${GITHUB_SHA}"
          --commit-dirty=true
          --commit-message="GitHub Actions run ${GITHUB_RUN_ID}"
      - id: pages-deployment
        name: Resolve active Pages deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments_file="${RUNNER_TEMP}/pages-deployments.json"
          npx --no-install wrangler pages deployment list \
            --project-name=stablecoin-dashboard \
            --environment=production \
            --json > "${deployments_file}"

          PAGES_DEPLOYMENTS_FILE="${deployments_file}" node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const deployments = JSON.parse(
            readFileSync(process.env.PAGES_DEPLOYMENTS_FILE, "utf8"),
          );
          const deployment = deployments[0];
          const expectedSource = process.env.GITHUB_SHA.slice(0, 7);

          if (
            deployment?.Environment !== "Production"
            || deployment?.Branch !== "main"
            || deployment?.Source !== expectedSource
          ) {
            throw new Error(
              `Latest Pages deployment did not match this release: ${JSON.stringify(deployment ?? null)}`,
            );
          }

          const deploymentUrl = new URL(deployment.Deployment);
          if (
            deploymentUrl.protocol !== "https:"
            || !deploymentUrl.hostname.endsWith(".stablecoin-dashboard.pages.dev")
          ) {
            throw new Error(`Unexpected Pages deployment URL: ${deployment.Deployment}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `deployment_url=${deploymentUrl.origin}\n`);
          console.log(
            `[pages-deployment] OK deployment=${deployment.Id} source=${deployment.Source} url=${deploymentUrl.origin}`,
          );
          NODE
      - name: Verify deployment release marker
        env:
          DEPLOYMENT_URL: ${{ steps.pages-deployment.outputs.deployment_url }}
        run: |
          node --import tsx scripts/maintenance/wait-pages-release-marker.ts \
            --url "${DEPLOYMENT_URL}/__pharos_release.json" \
            --attempts 24 \
            --delay-ms 5000
          {
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Release marker: verified for \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ping IndexNow with changed sitemap URLs
        if: ${{ vars.INDEXNOW_ENABLED == 'true' }}
        continue-on-error: true
        run: node scripts/ci/indexnow-ping.mjs --previous "${RUNNER_TEMP}/previous-sitemap.xml"
