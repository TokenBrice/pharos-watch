name: Pages Release

on:
  workflow_call:
    inputs:
      refresh_data:
        description: Refresh API-backed release data before building.
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  pages-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pharos.watch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER: ${{ vars.NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY: ${{ vars.NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY }}
      NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # sitemap-dates and docs-metadata derive per-route and per-doc
          # timestamps from commit history during prebuild. A shallow checkout
          # makes their guard fail rather than publish wrong lastmod values.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
          tooling-cache-save: "true"
      - name: Refresh API-backed release data
        if: ${{ inputs.refresh_data }}
        env:
          DIGEST_API_URL: https://stablecoin-dashboard.pages.dev/_site-data
          DEPEG_EVENTS_API_URL: https://stablecoin-dashboard.pages.dev/_site-data
          PUBLIC_DATASETS_API_URL: https://stablecoin-dashboard.pages.dev/_site-data
          PUBLIC_DATASETS_REQUIRE_API: "1"
        run: |
          # Refresh each snapshot independently. A failed surface falls back to
          # its committed data without discarding successful archive refreshes.
          committed_digest_count="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("data/digests.json","utf8")).length)')"
          digest_refresh_ok=true
          npx tsx scripts/maintenance/sync-digests.ts --output data/digests.json \
            || digest_refresh_ok=false
          if [ "$digest_refresh_ok" = "true" ]; then
            refreshed_digest_count="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("data/digests.json","utf8")).length)' 2>/dev/null || echo 0)"
            if [ "$refreshed_digest_count" -lt "$committed_digest_count" ]; then
              echo "::warning::digest archive shrank (${refreshed_digest_count} < ${committed_digest_count}); using committed snapshot"
              digest_refresh_ok=false
            fi
          fi
          if [ "$digest_refresh_ok" != "true" ]; then
            echo "::warning::digest refresh failed; using committed digest snapshot"
            git checkout -- data/digests.json
          fi

          depeg_refresh_ok=true
          npx tsx scripts/maintenance/sync-depeg-events.ts --output data/depeg-events.json \
            || depeg_refresh_ok=false
          if [ "$depeg_refresh_ok" != "true" ]; then
            echo "::warning::depeg-event refresh failed; using committed depeg snapshot"
            git checkout -- data/depeg-events.json
          fi

          public_datasets_refresh_ok=true
          npm run generate:public-datasets || public_datasets_refresh_ok=false
          if [ "$public_datasets_refresh_ok" != "true" ]; then
            echo "::warning::public-dataset refresh failed; using committed public datasets"
            git checkout -- public/datasets
            git clean -fd -- public/datasets
          fi

          echo "- Digest refresh: ${digest_refresh_ok} (${refreshed_digest_count:-$committed_digest_count} entries)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Depeg-event refresh: ${depeg_refresh_ok}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public-dataset refresh: ${public_datasets_refresh_ok}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build clean production export
        env:
          GENERATED_ARTIFACTS_SKIP: stablecoin-catalog,world-map,case-study-client-index,cemetery-dataset,public-datasets,homepage-bootstrap,postman,openapi,report-card-registry-fingerprint,legacy-stablecoin-redirects,stablecoin-client-registry,api-reference,og-editorial,og-learn,og-case-studies
          PUBLIC_DATASETS_API_URL: ""
          PUBLIC_DATASETS_API_KEY: ""
          PUBLIC_DATASETS_REQUIRE_API: ""
          SMOKE_API_BASE: ""
          API_BASE_URL: ""
        run: |
          rm -rf .next
          npm run build
      - run: npm run check:feature-flag-inlining
      # Blocking: the Cloudflare 20,000-file direct-upload limit. Byte budgets
      # are reported as non-blocking deltas in the step summary.
      - run: npm run check:build-size
      # Blocking security gate: scans the built HTML for inline-script
      # credential-harvesting shapes that get pharos.watch flagged by Safe Browsing.
      - run: npm run check:phishing-signatures
      - name: Validate static SEO and published archive continuity
        env:
          SEO_PREVIOUS_SITEMAP_URL: https://stablecoin-dashboard.pages.dev/sitemap.xml
        run: npm run seo:check
      - name: Write release marker
        run: |
          cat > out/__pharos_release.json <<EOF
          {"commit":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","runAttempt":"${GITHUB_RUN_ATTEMPT}","createdAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
      - name: Capture release artifact metrics
        run: |
          total_files="$(find out -type f | wc -l | tr -d ' ')"
          output_size="$(du -sh out | awk '{print $1}')"
          {
            echo "## Pages release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Output: ${total_files} files, ${output_size}"
            echo "- Data refreshed: \`${{ inputs.refresh_data }}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Rollback: select the prior successful deployment in Cloudflare Pages deployment history."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Pages
        run: >-
          npx --no-install wrangler pages deploy out
          --project-name=stablecoin-dashboard
          --branch=main
          --commit-hash="${GITHUB_SHA}"
          --commit-dirty=true
          --commit-message="GitHub Actions run ${GITHUB_RUN_ID}"
      - id: pages-deployment
        name: Resolve active Pages deployment
        run: |
          deployments_file="${RUNNER_TEMP}/pages-deployments.json"
          npx --no-install wrangler pages deployment list \
            --project-name=stablecoin-dashboard \
            --environment=production \
            --json > "${deployments_file}"

          PAGES_DEPLOYMENTS_FILE="${deployments_file}" node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const deployments = JSON.parse(
            readFileSync(process.env.PAGES_DEPLOYMENTS_FILE, "utf8"),
          );
          const deployment = deployments[0];
          const expectedSource = process.env.GITHUB_SHA.slice(0, 7);

          if (
            deployment?.Environment !== "Production"
            || deployment?.Branch !== "main"
            || deployment?.Source !== expectedSource
          ) {
            throw new Error(
              `Latest Pages deployment did not match this release: ${JSON.stringify(deployment ?? null)}`,
            );
          }

          const deploymentUrl = new URL(deployment.Deployment);
          if (
            deploymentUrl.protocol !== "https:"
            || !deploymentUrl.hostname.endsWith(".stablecoin-dashboard.pages.dev")
          ) {
            throw new Error(`Unexpected Pages deployment URL: ${deployment.Deployment}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `deployment_url=${deploymentUrl.origin}\n`);
          console.log(
            `[pages-deployment] OK deployment=${deployment.Id} source=${deployment.Source} url=${deploymentUrl.origin}`,
          );
          NODE
      - name: Verify deployment release marker
        env:
          DEPLOYMENT_URL: ${{ steps.pages-deployment.outputs.deployment_url }}
        run: |
          node --import tsx scripts/maintenance/wait-pages-release-marker.ts \
            --url "${DEPLOYMENT_URL}/__pharos_release.json" \
            --attempts 24 \
            --delay-ms 5000
          {
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Release marker: verified for \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
