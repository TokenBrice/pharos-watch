name: Pages Release

on:
  workflow_call:
    inputs:
      api_base_url:
        description: Optional API base used for digest sync and local artifact smoke.
        required: false
        default: ""
        type: string
      pages_ui_changed:
        description: Whether the release should run strict mobile smoke.
        required: false
        default: true
        type: boolean
      wait_for_validate_job:
        description: Whether the release should wait for validate / validate before publishing.
        required: false
        default: false
        type: boolean
      wait_for_worker_promotion:
        description: Whether the release should wait for deploy-worker before publishing.
        required: false
        default: false
        type: boolean
    secrets:
      DIGEST_API_KEY:
        required: true
      DEPEG_EVENTS_API_KEY:
        required: false
      PUBLIC_DATASETS_API_KEY:
        required: false
      SITE_API_SHARED_SECRET:
        required: true
      SMOKE_API_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      OPS_SMOKE_CF_ACCESS_CLIENT_ID:
        required: true
      OPS_SMOKE_CF_ACCESS_CLIENT_SECRET:
        required: true
      ACTIONS_CHECKOUT_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  pages-release:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DIGEST_API_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      DEPEG_EVENTS_API_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
      DEPEG_EVENTS_API_KEY: ${{ secrets.DEPEG_EVENTS_API_KEY || secrets.DIGEST_API_KEY }}
      PUBLIC_DATASETS_API_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
      PUBLIC_DATASETS_API_KEY: ${{ secrets.PUBLIC_DATASETS_API_KEY || secrets.DIGEST_API_KEY }}
      PUBLIC_DATASETS_REQUIRE_API: "1"
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER: ${{ vars.NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY: ${{ vars.NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY }}
      NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
          install-playwright-chromium: "true"
          install-playwright-firefox: "true"
      - name: Fetch digests from the target API environment
        run: npx tsx scripts/maintenance/sync-digests.ts --output data/digests.json
      - name: Fetch depeg events from the target API environment
        run: npx tsx scripts/maintenance/sync-depeg-events.ts --output data/depeg-events.json
      - name: Generate public dataset mirrors from the target API environment
        run: npm run generate:public-datasets
      - run: npm run build
        env:
          PUBLIC_DATASETS_API_URL: ""
          PUBLIC_DATASETS_API_KEY: ""
          PUBLIC_DATASETS_REQUIRE_API: ""
          SMOKE_API_BASE: ""
          API_BASE_URL: ""
      - run: npm run test:a11y
      - run: npm run check:feature-flag-inlining
      - run: npm run check:phishing-signatures
      - run: npm run check:classifier-sensitive-copy
      - run: npm run check:build-size
      - name: Capture Pages release metrics
        id: pages-release-metrics
        run: |
          total_files="$(find out -type f | wc -l | tr -d ' ')"
          output_size="$(du -sh out | awk '{print $1}')"
          depeg_pages="0"
          if [ -d out/depeg ]; then
            depeg_pages="$(find out/depeg -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          fi

          echo "total_files=${total_files}" >> "$GITHUB_OUTPUT"
          echo "output_size=${output_size}" >> "$GITHUB_OUTPUT"
          echo "depeg_pages=${depeg_pages}" >> "$GITHUB_OUTPUT"

          {
            echo "## Pages Release Artifact"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Output files | ${total_files} / 20000 |"
            echo "| Output size | ${output_size} |"
            echo "| Depeg event pages | ${depeg_pages} |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run check:build-attribution
      - id: capture-pages
        name: Capture current production Pages deployment id
        continue-on-error: true
        run: |
          cd worker
          npx --no-install wrangler pages deployment list --project-name=stablecoin-dashboard --environment=production --json > /tmp/wrangler-pages-deployments.json
          cd ..
          node .github/scripts/parse-pages-deployment-id.mjs >> "$GITHUB_OUTPUT"
      - if: ${{ steps.capture-pages.outcome == 'failure' || steps.capture-pages.outputs.deployment_id == '' }}
        name: Fail because automated Pages rollback is not armed
        run: |
          {
            echo "## Automated Pages rollback is not armed"
            echo ""
            echo "The \`capture-pages\` step could not record the previous production Pages deployment id."
            echo "Stopping before publish so a broken deploy cannot be left live without an automated rollback target."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Start local export smoke server
        env:
          STATIC_EXPORT_API_BASE: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
          STATIC_EXPORT_SITE_API_BASE: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
          STATIC_EXPORT_SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
          STATIC_EXPORT_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          STATIC_EXPORT_HOST: 127.0.0.1
          STATIC_EXPORT_PORT: "4173"
        run: |
          npm run serve:static-export > /tmp/pages-smoke-server.log 2>&1 &
          echo $! > /tmp/pages-smoke-server.pid
          for attempt in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:4173/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1));"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pages-smoke-server.log
          exit 1
      - name: Run local pre-publish checks in parallel
        env:
          PAGES_UI_CHANGED: ${{ inputs.pages_ui_changed }}
          SMOKE_UI_EXPECT_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          SMOKE_UI_BROWSER_CHANNEL: chrome
          SMOKE_UI_OVERFLOW_ROUTES: /,/stablecoins/,/screener/,/stablecoin/usdt-tether/,/timeline/,/flows/,/liquidity/,/yield/,/depeg/
          SMOKE_UI_OVERFLOW_WORKERS: "6"
          SMOKE_MOBILE_UI_ROUTES: /,/stablecoins/,/screener/,/stablecoin/usdt-tether/,/timeline/,/flows/,/liquidity/,/yield/,/depeg/
          SMOKE_MOBILE_UI_VIEWPORTS: 360x740,390x844
          SMOKE_MOBILE_UI_SKIP_DESKTOP: "1"
          SMOKE_MOBILE_UI_WORKERS: "3"
          SMOKE_MOBILE_UI_WAIT_MS: "1500"
        run: |
          set +e

          npm run seo:check &
          seo_pid=$!

          npm run test:smoke-ui -- --url http://127.0.0.1:4173 --mode local &
          ui_pid=$!

          mobile_pid=""
          if [ "${PAGES_UI_CHANGED}" = "true" ]; then
            npm run test:smoke-ui:mobile -- --url http://127.0.0.1:4173 &
            mobile_pid=$!
          fi

          wait "$seo_pid"
          seo_status=$?
          wait "$ui_pid"
          ui_status=$?

          mobile_status=0
          if [ -n "$mobile_pid" ]; then
            wait "$mobile_pid"
            mobile_status=$?
          fi

          if [ "$seo_status" -ne 0 ] || [ "$ui_status" -ne 0 ] || [ "$mobile_status" -ne 0 ]; then
            echo "local pre-publish statuses: seo=${seo_status}, ui=${ui_status}, mobile=${mobile_status}"
            exit 1
          fi
      - name: Wait for validation gate
        if: ${{ inputs.wait_for_validate_job }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/wait-for-workflow-job.mjs
          --job "validate / validate"
          --attempts 120
          --sleep-sec 5
          --stop-message "stopping production Pages deployment."
          --timeout-message "Timed out waiting for validate / validate to finish."
      - name: Wait for worker promotion gate
        if: ${{ inputs.wait_for_worker_promotion }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/wait-for-workflow-job.mjs
          --job "deploy-worker"
          --attempts 180
          --sleep-sec 5
          --stop-message "stopping production Pages deployment."
          --timeout-message "Timed out waiting for deploy-worker to finish."
      - name: Run local artifact smoke against promoted worker
        if: ${{ inputs.wait_for_worker_promotion }}
        env:
          SMOKE_UI_EXPECT_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          SMOKE_UI_BROWSER_CHANNEL: chrome
          SMOKE_UI_OVERFLOW_ROUTES: /,/stablecoins/,/screener/,/stablecoin/usdt-tether/,/timeline/,/flows/,/liquidity/,/yield/,/depeg/
          SMOKE_UI_OVERFLOW_WORKERS: "6"
        run: npm run test:smoke-ui -- --url http://127.0.0.1:4173 --mode local
      - name: Dump local export smoke server log
        if: failure()
        run: cat /tmp/pages-smoke-server.log
      - name: Stop local export smoke server
        if: always()
        run: |
          if [ -f /tmp/pages-smoke-server.pid ]; then
            kill "$(cat /tmp/pages-smoke-server.pid)" || true
          fi
      - name: Deploy Pages with retry
        id: deploy-pages
        run: |
          max_attempts=6
          for attempt in $(seq 1 "$max_attempts"); do
            echo "[deploy-pages] Attempt ${attempt}/${max_attempts}"
            if npx --no-install wrangler pages deploy out --project-name=stablecoin-dashboard --commit-dirty=true --commit-message="${{ github.sha }}"; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "[deploy-pages] Exhausted retries"
              exit 1
            fi
            sleep $((attempt * 45))
          done
      - name: Run post-publish smokes in parallel
        id: post-publish-smokes
        if: ${{ steps.deploy-pages.outcome == 'success' }}
        continue-on-error: true
        env:
          SMOKE_UI_EXPECT_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          SMOKE_UI_BROWSER_CHANNEL: chrome
          SMOKE_UI_OVERFLOW_ROUTES: /depeg/
          SMOKE_OPS_UI_URL: ${{ vars.SMOKE_OPS_UI_URL || 'https://ops.pharos.watch/admin/' }}
          SMOKE_OPS_API_BASE: ${{ vars.SMOKE_OPS_API_BASE || 'https://ops-api.pharos.watch' }}
          SMOKE_OPS_SCOPE: "canary"
          OPS_SMOKE_CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_ID }}
          OPS_SMOKE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +e

          npm run test:smoke-ui -- --url https://pharos.watch --mode live &
          ui_pid=$!
          npm run test:smoke-ops &
          ops_pid=$!
          npm run test:smoke-transport &
          transport_pid=$!

          wait "$ui_pid"
          ui_status=$?
          wait "$ops_pid"
          ops_status=$?
          wait "$transport_pid"
          transport_status=$?

          to_result() {
            if [ "$1" -eq 0 ]; then
              echo "success"
            else
              echo "failure"
            fi
          }

          UI_STATUS="$(to_result "$ui_status")"
          OPS_STATUS="$(to_result "$ops_status")"
          TRANSPORT_STATUS="$(to_result "$transport_status")"

          echo "ui_status=${UI_STATUS}" >> "$GITHUB_OUTPUT"
          echo "ops_status=${OPS_STATUS}" >> "$GITHUB_OUTPUT"
          echo "transport_status=${TRANSPORT_STATUS}" >> "$GITHUB_OUTPUT"

          {
            echo "## Post-Publish Smokes"
            echo ""
            echo "| Check | Status | Rollback trigger |"
            echo "| --- | --- | --- |"
            echo "| Live public UI | ${UI_STATUS} | yes |"
            echo "| Ops canary | ${OPS_STATUS} | yes |"
            echo "| Transport redirects | ${TRANSPORT_STATUS} | yes |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ui_status" -ne 0 ] || [ "$ops_status" -ne 0 ] || [ "$transport_status" -ne 0 ]; then
            echo "post-publish smoke statuses: ui=${UI_STATUS}, ops=${OPS_STATUS}, transport=${TRANSPORT_STATUS}"
            exit 1
          fi
      - name: Roll back Pages production to previous successful deployment
        if: >-
          ${{
            steps.post-publish-smokes.outcome == 'failure'
            && steps.deploy-pages.outcome == 'success'
            && steps.capture-pages.outputs.deployment_id != ''
            && (
              steps.post-publish-smokes.outputs.ui_status != 'success'
              || steps.post-publish-smokes.outputs.ops_status != 'success'
              || steps.post-publish-smokes.outputs.transport_status != 'success'
            )
          }}
        env:
          CF_PAGES_PROJECT_NAME: stablecoin-dashboard
          CF_PAGES_DEPLOYMENT_ID: ${{ steps.capture-pages.outputs.deployment_id }}
        run: node scripts/maintenance/rollback-pages-deployment.mjs
      - name: Fail after post-publish smoke failure
        if: ${{ steps.post-publish-smokes.outcome == 'failure' }}
        run: exit 1
