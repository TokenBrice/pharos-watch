name: Pages Release

on:
  workflow_call:
    inputs:
      refresh_data:
        description: Refresh API-backed release data before building.
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SITE_API_SHARED_SECRET:
        required: false

permissions:
  contents: read

jobs:
  pages-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pharos.watch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER: ${{ vars.NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY: ${{ vars.NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY }}
      NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
          tooling-cache-save: "true"
      - name: Refresh API-backed release data
        if: ${{ inputs.refresh_data }}
        env:
          DIGEST_API_URL: https://site-api.pharos.watch
          DEPEG_EVENTS_API_URL: https://site-api.pharos.watch
          PUBLIC_DATASETS_API_URL: https://site-api.pharos.watch
          PUBLIC_DATASETS_REQUIRE_API: "1"
          SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
        run: |
          npx tsx scripts/maintenance/sync-digests.ts --output data/digests.json
          npx tsx scripts/maintenance/sync-depeg-events.ts --output data/depeg-events.json
          npm run generate:public-datasets
      - name: Build clean production export
        env:
          GENERATED_ARTIFACTS_SKIP: stablecoin-catalog,world-map,agent-code-map,sitemap-dates,case-study-client-index,docs-metadata,cemetery-dataset,public-datasets,homepage-bootstrap,postman,openapi,stablecoin-prevalidated-registry,legacy-stablecoin-redirects,stablecoin-client-registry,api-reference,og-editorial,og-learn,og-case-studies
          PUBLIC_DATASETS_API_URL: ""
          PUBLIC_DATASETS_API_KEY: ""
          PUBLIC_DATASETS_REQUIRE_API: ""
          SMOKE_API_BASE: ""
          API_BASE_URL: ""
        run: |
          rm -rf .next
          npm run build
      - run: npm run check:feature-flag-inlining
      - run: npm run check:build-size
      - run: npm run check:build-attribution
      - run: npm run seo:check
      - name: Write release marker
        run: |
          cat > out/__pharos_release.json <<EOF
          {"commit":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","runAttempt":"${GITHUB_RUN_ATTEMPT}","createdAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
      - name: Capture release artifact metrics
        run: |
          total_files="$(find out -type f | wc -l | tr -d ' ')"
          output_size="$(du -sh out | awk '{print $1}')"
          {
            echo "## Pages release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Output: ${total_files} files, ${output_size}"
            echo "- Data refreshed: \`${{ inputs.refresh_data }}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Rollback: select the prior successful deployment in Cloudflare Pages deployment history."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Pages
        run: >-
          npx --no-install wrangler pages deploy out
          --project-name=stablecoin-dashboard
          --commit-dirty=true
          --commit-message="${GITHUB_SHA}"
      - name: Verify published release marker
        run: >-
          node scripts/maintenance/wait-pages-release-marker.mjs
          --url https://pharos.watch/__pharos_release.json
          --attempts 24
          --delay-ms 5000
