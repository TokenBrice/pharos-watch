name: CI Validate

on:
  workflow_call:
    inputs:
      coverage-compare-ref:
        description: Git ref used by the critical coverage ratchet.
        required: false
        type: string
      pages_changed:
        description: Whether the changed diff touches Pages deploy surfaces.
        required: false
        default: true
        type: boolean
      worker_changed:
        description: Whether the changed diff touches worker deploy surfaces.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25.x
          tooling-cache: "true"
      - run: npm run validate:prebuild
      - if: ${{ inputs.pages_changed }}
        run: npm run build
      - if: ${{ inputs.pages_changed }}
        run: npm run seo:check
      - run: npm test
      - run: npm run coverage:critical
        env:
          CRITICAL_COVERAGE_THRESHOLD: "40"
          CRITICAL_COVERAGE_COMPARE_REF: ${{ inputs.coverage-compare-ref }}
      - if: ${{ inputs.worker_changed }}
        run: cd worker && npx tsc --noEmit
      - if: ${{ inputs.worker_changed }}
        run: cd worker && npx tsc --noEmit -p tsconfig.scripts.json

  validate-lts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24.x
          tooling-cache: "true"
      - run: npm run validate:lts -- --pages-changed=${{ inputs.pages_changed }} --worker-changed=${{ inputs.worker_changed }} --coverage-compare-ref=${{ inputs.coverage-compare-ref }}
