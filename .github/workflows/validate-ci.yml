name: CI Validate

on:
  workflow_call:
    inputs:
      coverage-compare-ref:
        description: Git ref used by the critical coverage ratchet.
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:deps
      - run: npm run lint
      - run: npm run check:worker-boundary
      - run: npm run check:migrations
      - run: npm test
      - run: npm run coverage:critical
        env:
          CRITICAL_COVERAGE_THRESHOLD: "40"
          CRITICAL_COVERAGE_COMPARE_REF: ${{ inputs.coverage-compare-ref }}
      - run: cd worker && npx tsc --noEmit
