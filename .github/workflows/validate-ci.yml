name: CI Validate

on:
  workflow_call:
    inputs:
      coverage-compare-ref:
        description: Git ref used by the critical coverage ratchet.
        required: false
        type: string
      pages_changed:
        description: Whether the changed diff touches Pages deploy surfaces.
        required: false
        default: true
        type: boolean
      worker_changed:
        description: Whether the changed diff touches worker deploy surfaces.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25.x
          tooling-cache: "true"
      - run: npm run audit:deps
      - run: npm run audit:pricing-providers
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:worker-boundary
      - run: npm run check:shared-cycles
      - run: npm run check:migrations
      - run: npm run check:cron-sync
      - run: npm run check:cron-connections
      - run: npm run check:doc-counts
      - run: npm run check:verified-doc-links
      - run: npm run check:doc-source-paths
      - run: npm run check:doc-sync
      - run: npm run check:env-contract
      - run: npm run check:duplicate-exports
      - run: npm run check:redemption-backstops
      - run: npm run check:unused-code
      - run: npm run check:hotspot-ratchet
      - run: npm run check:sql-safety
      - run: npm run check:stablecoin-data
      - if: ${{ inputs.pages_changed }}
        run: npm run build
      - if: ${{ inputs.pages_changed }}
        run: npm run seo:check
      - run: npm test
      - run: npm run coverage:critical
        env:
          CRITICAL_COVERAGE_THRESHOLD: "40"
          CRITICAL_COVERAGE_COMPARE_REF: ${{ inputs.coverage-compare-ref }}
      - if: ${{ inputs.worker_changed }}
        run: cd worker && npx tsc --noEmit
      - if: ${{ inputs.worker_changed }}
        run: cd worker && npx tsc --noEmit -p tsconfig.scripts.json
