name: CI Validate

on:
  workflow_call:
    inputs:
      coverage-compare-ref:
        description: Git ref used by the critical coverage ratchet.
        required: false
        type: string
      pages_changed:
        description: Whether the changed diff touches Pages deploy surfaces.
        required: false
        default: true
        type: boolean
      run_pages_build_and_seo:
        description: Whether validation should run Pages build and SEO checks when Pages changed.
        required: false
        default: true
        type: boolean
      worker_changed:
        description: Whether the changed diff touches worker deploy surfaces.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

jobs:
  validate-prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24.x
          tooling-cache: "true"
      - run: npm run validate:prebuild

  pages-build:
    if: ${{ inputs.pages_changed && inputs.run_pages_build_and_seo }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Match pages-prepare.yml so the validate build inlines the same flags.
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER: ${{ vars.NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY: ${{ vars.NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY }}
      NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24.x
          tooling-cache: "true"
          install-playwright-chromium: "true"
      - run: npm run build
      - run: npm run check:feature-flag-inlining
      - run: npm run seo:check
      - run: npm run check:phishing-signatures
      - run: npm run check:classifier-sensitive-copy
      - run: npm run check:build-size
      - run: npm run check:build-attribution
      - run: npm run check:methodology-pdfs

  test-noncritical:
    name: Noncritical Vitest (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24.x
          tooling-cache: "true"
      - run: npm run test:noncritical -- --shard=${{ matrix.shard }}/3

  coverage-critical:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CRITICAL_COVERAGE_COMPARE_REF: ${{ inputs.coverage-compare-ref }}
      CRITICAL_COVERAGE_THRESHOLD: "40"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24.x
          tooling-cache: "true"
      - run: npm run coverage:critical

  typecheck-worker:
    name: typecheck-worker (${{ matrix.script }})
    if: ${{ inputs.worker_changed }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck:worker, typecheck:worker-scripts]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24.x
          tooling-cache: "true"
      - run: npm run ${{ matrix.script }}

  validate:
    needs:
      - validate-prebuild
      - pages-build
      - test-noncritical
      - coverage-critical
      - typecheck-worker
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify validate results
        env:
          COVERAGE_CRITICAL_RESULT: ${{ needs.coverage-critical.result }}
          PAGES_BUILD_EXPECTED: ${{ inputs.pages_changed && inputs.run_pages_build_and_seo }}
          PAGES_BUILD_RESULT: ${{ needs.pages-build.result }}
          TEST_NONCRITICAL_RESULT: ${{ needs.test-noncritical.result }}
          VALIDATE_PREBUILD_RESULT: ${{ needs.validate-prebuild.result }}
          WORKER_CHANGED: ${{ inputs.worker_changed }}
          TYPECHECK_WORKER_RESULT: ${{ needs.typecheck-worker.result }}
          TYPECHECK_WORKER_SCRIPTS_RESULT: ${{ needs.typecheck-worker.result }}
        run: node .github/scripts/verify-validate-results.mjs
