name: CI Validate

on:
  workflow_call:
    inputs:
      coverage-compare-ref:
        description: Git ref used by the critical coverage ratchet.
        required: false
        type: string
      coverage-ratchet-all:
        description: Whether the critical coverage ratchet should compare every critical file instead of only touched files.
        required: false
        default: false
        type: boolean
      pages_changed:
        description: Whether the changed diff touches Pages validation surfaces.
        required: false
        default: true
        type: boolean
      run_pages_build_and_seo:
        description: Whether validation should run Pages build and SEO checks when Pages changed.
        required: false
        default: true
        type: boolean
      worker_changed:
        description: Whether the changed diff touches worker deploy surfaces.
        required: false
        default: true
        type: boolean
    secrets:
      ACTIONS_CHECKOUT_TOKEN:
        required: false

permissions:
  contents: read

env:
  NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

jobs:
  validate-prebuild:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      VALIDATE_PREBUILD_SURFACE: ${{ inputs.pages_changed && inputs.worker_changed && 'full' || inputs.pages_changed && 'pages' || inputs.worker_changed && 'worker' || 'full' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
          tooling-cache-save: "true"
          install-playwright-firefox: "true"
      - run: npm run validate:prebuild

  pages-build:
    if: ${{ inputs.pages_changed && inputs.run_pages_build_and_seo }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Match pages-release.yml so the validate build inlines the same flags.
      # OG freshness is checked independently by validate-prebuild, so this
      # build can consume the committed editorial cards without Firefox.
      GENERATED_ARTIFACTS_SKIP: og-editorial
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER: ${{ vars.NEXT_PUBLIC_PHAROS_BLACKLIST_BANNER }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY: ${{ vars.NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY }}
      NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_CHART_ANNOTATIONS }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
          tooling-cache-save: "true"
          install-playwright-chromium: "true"
      - run: npm run validate:pages

  test-noncritical:
    name: Noncritical Vitest (${{ matrix.shard }}/2)
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-workspace
      - run: npm run test:noncritical -- --shard=${{ matrix.shard }}/2

  coverage-critical:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CRITICAL_COVERAGE_COMPARE_REF: ${{ inputs.coverage-compare-ref }}
      CRITICAL_COVERAGE_RATCHET_ALL: ${{ inputs.coverage-ratchet-all && '1' || '0' }}
      CRITICAL_COVERAGE_THRESHOLD: "40"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-workspace
      - run: npm run coverage:critical

  typecheck-worker:
    if: ${{ inputs.worker_changed }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ACTIONS_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
      - run: npm run validate:worker

  validate:
    needs:
      - validate-prebuild
      - pages-build
      - test-noncritical
      - coverage-critical
      - typecheck-worker
    if: ${{ always() }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify validate results
        env:
          COVERAGE_CRITICAL_RESULT: ${{ needs.coverage-critical.result }}
          PAGES_BUILD_EXPECTED: ${{ inputs.pages_changed && inputs.run_pages_build_and_seo }}
          PAGES_BUILD_RESULT: ${{ needs.pages-build.result }}
          TEST_NONCRITICAL_RESULT: ${{ needs.test-noncritical.result }}
          VALIDATE_PREBUILD_RESULT: ${{ needs.validate-prebuild.result }}
          WORKER_CHANGED: ${{ inputs.worker_changed }}
          TYPECHECK_WORKER_RESULT: ${{ needs.typecheck-worker.result }}
        run: |
          node <<'NODE'
          const expectedPagesBuild = process.env.PAGES_BUILD_EXPECTED === "true";
          const checks = [
            ["validate-prebuild", process.env.VALIDATE_PREBUILD_RESULT],
            ["test-noncritical", process.env.TEST_NONCRITICAL_RESULT],
            ["coverage-critical", process.env.COVERAGE_CRITICAL_RESULT],
            ...(
              process.env.WORKER_CHANGED === "true"
                ? [["typecheck-worker", process.env.TYPECHECK_WORKER_RESULT]]
                : []
            ),
            ...(expectedPagesBuild ? [["pages-build", process.env.PAGES_BUILD_RESULT]] : []),
          ];

          const failures = checks.filter(([, result]) => result !== "success");
          if (failures.length > 0) {
            const message = failures.map(([job, result]) => `${job}=${result ?? "missing"}`).join(", ");
            console.error(`validate gate failed: ${message}`);
            process.exit(1);
          }
          NODE
