name: Critical Coverage Ratchet

on:
  schedule:
    - cron: "35 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-critical-ratchet:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      CRITICAL_COVERAGE_RATCHET_ALL: "1"
      CRITICAL_COVERAGE_THRESHOLD: "40"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
      - run: npm run coverage:critical
