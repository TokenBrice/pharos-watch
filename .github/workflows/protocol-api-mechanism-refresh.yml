name: Protocol API Mechanism Refresh

# Producer-only evidence for synthetic/yield mechanism reviews. These files do
# not alter the active score identity; a reviewed identity rotation owns any
# later scoring adoption.

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  refresh:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        asset: [usde-ethena, usdf-falcon]
    concurrency:
      group: protocol-api-mechanism-refresh-${{ matrix.asset }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-workspace

      - name: Validate target branch ownership
        env:
          ASSET_ID: ${{ matrix.asset }}
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/ci/verify-mechanism-refresh-diff.ts --asset "$ASSET_ID" --stage validate-branch


      - name: Capture protocol API mechanism evidence
        env:
          ASSET_ID: ${{ matrix.asset }}
        run: npx tsx scripts/maintenance/measure-protocol-api-mechanism-metrics.ts --asset "$ASSET_ID"

      - name: Validate producer and deterministic derivation
        run: npm exec vitest -- scripts/__tests__/measure-protocol-api-mechanism-metrics.test.ts --run

      - name: Replay all protocol API evidence
        run: npx tsx scripts/maintenance/measure-protocol-api-mechanism-metrics.ts --replay-all

      - name: Detect additions-only evidence diff
        id: diff
        env:
          ASSET_ID: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          ROOT="shared/data/safety-score-v9/mechanism-measurements/${ASSET_ID}"
          node --import tsx scripts/ci/verify-mechanism-refresh-diff.ts --asset "$ASSET_ID" --stage verify-diff

          CHANGED_PATHS="$({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              "$ROOT"/*) ;;
              *)
                echo "::error title=Unexpected mechanism refresh diff::${path} is outside ${ROOT}."
                exit 1
                ;;
            esac
          done <<< "$CHANGED_PATHS"

          if ! git diff --quiet -- "$ROOT" || ! git diff --cached --quiet -- "$ROOT"; then
            echo "::error title=Non-append-only mechanism refresh::Tracked evidence under ${ROOT} changed."
            git status --short -- "$ROOT"
            exit 1
          fi

          NEW_FILES="$(git ls-files --others --exclude-standard -- "$ROOT")"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              "$ROOT"/*-protocol-api.json) ;;
              *)
                echo "::error title=Unexpected mechanism artifact::${path} is not a target protocol API artifact."
                exit 1
                ;;
            esac
          done <<< "$NEW_FILES"

          if [ -z "$NEW_FILES" ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No new ${ASSET_ID} protocol API snapshot."
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            git status --short -- "$ROOT"
          fi

      - name: Require automation token for checked PRs
        if: steps.diff.outputs.has_diff == 'true'
        env:
          REFRESH_TOKEN: ${{ secrets.MECHANISM_REFRESH_GITHUB_TOKEN || secrets.SHOCK_COVERAGE_GITHUB_TOKEN || secrets.OG_REFRESH_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REFRESH_TOKEN:-}" ]; then
            echo "::error title=Missing mechanism refresh token::Configure MECHANISM_REFRESH_GITHUB_TOKEN or a supported fallback token so the refresh PR triggers normal checks."
            exit 1
          fi

      - name: Open or update refresh PR
        if: steps.diff.outputs.has_diff == 'true'
        env:
          ASSET_ID: ${{ matrix.asset }}
          GH_TOKEN: ${{ secrets.MECHANISM_REFRESH_GITHUB_TOKEN || secrets.SHOCK_COVERAGE_GITHUB_TOKEN || secrets.OG_REFRESH_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="shared/data/safety-score-v9/mechanism-measurements/${ASSET_ID}"
          BRANCH="automated/protocol-api-mechanism-refresh/${ASSET_ID}"
          ARTIFACT_TMP="$(mktemp -d)"
          trap 'rm -rf "$ARTIFACT_TMP"' EXIT
          EMPTY_HOOKS="$ARTIFACT_TMP/empty-git-hooks"
          mkdir -p "$EMPTY_HOOKS"
          git config core.hooksPath "$EMPTY_HOOKS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_FILES="$(git ls-files --others --exclude-standard -- "$ROOT")"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$ARTIFACT_TMP/$(dirname "$path")"
            cp "$path" "$ARTIFACT_TMP/$path"
          done <<< "$NEW_FILES"

          node --import tsx scripts/ci/verify-mechanism-refresh-diff.ts --asset "$ASSET_ID" --stage prepare-branch
          node --import tsx scripts/ci/verify-mechanism-refresh-diff.ts --asset "$ASSET_ID" --stage verify-diff

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            cp "$ARTIFACT_TMP/$path" "$path"
          done <<< "$NEW_FILES"

          git add -- "$ROOT"
          git commit \
            -m "chore(v9): refresh ${ASSET_ID} protocol API evidence" \
            -m "Capture append-only producer evidence without changing mechanism overlays or score identity."

          node --import tsx scripts/ci/verify-mechanism-refresh-diff.ts --asset "$ASSET_ID" --stage verify-diff

          ARTIFACT_PATH="$(git diff-tree --no-commit-id --name-only -r HEAD -- "$ROOT" | head -n 1)"
          export ARTIFACT_PATH ASSET_ID
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const artifact = JSON.parse(readFileSync(process.env.ARTIFACT_PATH, "utf8"));
          const metrics = Array.isArray(artifact.metrics)
            ? artifact.metrics
            : Object.entries(artifact.metrics ?? {}).map(([metricId, metric]) => ({ metricId, ...metric }));
          const metricId = (metric) => metric.metricId ?? metric.id ?? "unknown";
          const measured = metrics
            .filter((metric) => metric.state === "measured")
            .map((metric) => `${metricId(metric)}=${metric.value}${metric.unit ? ` ${metric.unit}` : ""}`);
          const unavailable = metrics.filter((metric) => metric.state === "unavailable").map(metricId);
          const blockers = artifact.adoptionEligibility?.blockers ?? [];
          const expectedEffect = artifact.scoreImpactAssessment?.expectedEffect ?? "indeterminate";
          const lines = [
            `Automated producer-only mechanism measurement for \`${process.env.ASSET_ID}\`.`,
            "",
            `- Artifact: \`${process.env.ARTIFACT_PATH}\``,
            `- Snapshot: \`${artifact.snapshotId ?? "unknown"}\``,
            `- Measured: ${measured.length ? measured.map((value) => `\`${value}\``).join(", ") : "none"}`,
            `- Unavailable: ${unavailable.length ? unavailable.map((value) => `\`${value}\``).join(", ") : "none"}`,
            `- Adoption blockers: ${blockers.length ? blockers.join("; ") : "none recorded"}`,
            `- Expected effect: \`${expectedEffect}\``,
            "",
            "All committed protocol API artifacts replayed successfully. This PR does not edit the mechanism overlay or any score identity, and auto-merge is deliberately disabled.",
          ];
          writeFileSync("/tmp/protocol-api-mechanism-pr-body.md", `${lines.join("\n")}\n`);
          NODE

          gh auth setup-git
          git push --force-with-lease -u origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --body-file /tmp/protocol-api-mechanism-pr-body.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(v9): refresh ${ASSET_ID} protocol API evidence" \
              --body-file /tmp/protocol-api-mechanism-pr-body.md
          fi
