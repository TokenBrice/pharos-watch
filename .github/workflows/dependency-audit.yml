name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Advisory full-lockfile scope (dev + build chain), broader than the
      # production deploy gate `npm run audit:deps` (--omit=dev). This lane is
      # expected to stay green; any future high/critical full-lockfile advisory
      # should be fixed, pinned away, or explicitly documented in
      # docs/deployment-process.md before being treated as accepted. Do not run
      # `npm audit fix --force` outside a dedicated dependency tranche.
      - run: npm audit --audit-level=high
      - run: npm audit signatures
