name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Full-lockfile scope includes dev/build dependencies. The verifier is
      # fail-closed and accepts only an unexpired, exact registry entry.
      - run: node scripts/ci/verify-dependency-audit.mjs
      - name: Verify package signatures
        if: always()
        run: npm audit signatures
