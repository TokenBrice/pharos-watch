name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Advisory full-lockfile scope (dev + build chain), broader than the
      # production deploy gate `npm run audit:deps` (--omit=dev). Risk-accepted
      # transitive advisories (ws via viem, postcss via next) and the triage
      # path are documented in docs/deployment-process.md → "Current
      # risk-accepted transitive advisories". Do not run `npm audit fix --force`
      # for those; the only remedies are breaking downgrades.
      - run: npm audit --audit-level=high
      - run: npm audit signatures
