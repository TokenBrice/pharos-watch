name: Production Canaries

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canaries
  cancel-in-progress: false

jobs:
  api-contracts:
    name: API contracts and OG images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: $/.github/actions/setup-workspace
      - name: Check authenticated production API contracts and OG PNGs
        run: npm run test:smoke-api
        env:
          SMOKE_API_BASE: https://api.pharos.watch
          SMOKE_API_KEY: ${{ secrets.PHAROS_API_KEY }}
          SMOKE_API_REQUIRE_KEY: "true"
          SMOKE_API_SCOPE: full

  pages-assets:
    name: Live Pages assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: $/.github/actions/setup-workspace
        with:
          browser-cache: "true"
          install-playwright-chromium: "true"
      - name: Check live production Pages assets
        run: npm run test:smoke-pages-assets -- --mode live --url https://pharos.watch
        env:
          SMOKE_PAGES_ASSET_MODE: live
          SMOKE_PAGES_ASSET_URL: https://pharos.watch
          SMOKE_API_BASE_URL: https://api.pharos.watch
          SMOKE_API_KEY: ${{ secrets.PHAROS_API_KEY }}

  transport:
    name: API HTTPS redirects and live cache policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: $/.github/actions/setup-workspace
      - name: Check production HTTP-to-HTTPS transport
        run: npm run test:smoke-transport
        env:
          SMOKE_TRANSPORT_API_URL: http://api.pharos.watch/api/health?smoke=transport
          SMOKE_TRANSPORT_SITE_API_URL: http://site-api.pharos.watch/api/stablecoins?limit=1&smoke=transport
      - name: Check live direct and same-origin API Cache-Control
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-live-api-cache-policy.mjs

  page-performance:
    name: Live page performance and polling
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
        with:
          browser-cache: "true"
          install-playwright-chromium: "true"
      - name: Capture home and detail viewport matrix
        run: |
          args=()
          if [[ "$(date -u +%u)" == "1" ]]; then
            args+=(--dwell-seconds 1800)
          fi
          node scripts/maintenance/probe-page-performance.mjs "${args[@]}"
      - name: Retain production measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-performance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/page-performance.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
