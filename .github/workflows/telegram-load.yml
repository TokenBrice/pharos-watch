name: Telegram Load Guard

on:
  pull_request:
    paths:
      - ".github/workflows/telegram-load.yml"
      - "scripts/ci/check-telegram-load.ts"
      - "worker/migrations/**"
      - "worker/src/cron/dispatch-telegram-*.ts"
      - "worker/src/cron/telegram-pending/**"
      - "worker/src/api/admin-telegram-broadcast.ts"
      - "worker/src/lib/telegram-constants.ts"
  schedule:
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-load:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
      - run: npm run check:telegram-load
