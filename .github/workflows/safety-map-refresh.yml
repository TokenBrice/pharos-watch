# Safety Score Map — daily refresh
#
# The workflow owns scheduling, credentials, runner setup, and artifact upload.
# scripts/maintenance/publish-safety-score-map.ts owns the publication state
# machine. Its load-bearing KV order is:
#   safety-map:snapshot:YYYY-MM-DD
#   safety-map:snapshot:latest
#   safety-map:alt:latest
#   safety-map:YYYY-MM-DD.png (then immediate byte readback verification)
#   safety-map:latest.png
#   safety-map:latest.json (manifest commit marker, always last)
#
# Provisioned inputs:
# - vars.SAFETY_MAP_KV_NAMESPACE_ID is the SELECTOR_SNAPSHOTS namespace id.
# - secrets.SAFETY_MAP_KV_TOKEN has Workers KV Storage: Edit on that namespace.
# - secrets.CLOUDFLARE_ACCOUNT_ID and secrets.PHAROS_API_KEY are shared inputs.
# The purpose-scoped KV token is deliberately not CLOUDFLARE_API_TOKEN.
# Account-state drift coverage lives in weekly-validation.yml.

name: Safety Map Refresh

on:
  # Two attempts absorb GitHub schedule delays before the 08:05 UTC digest.
  # The second scheduled run exits during plan when today's fresh map is live.
  schedule:
    - cron: "20 4 * * *"
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      accept_snapshot_transition:
        description: Accept the current live snapshot as an audited methodology/census transition
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Writers serialize and never cancel so two runs cannot interleave KV writes.
concurrency:
  group: safety-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAP_OUT_DIR: agents/safety-score-map/ci
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-workspace
        with:
          browser-cache: "true"
          install-playwright-firefox: "true"

      - name: Verify render credentials
        env:
          PHAROS_API_KEY: ${{ secrets.PHAROS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PHAROS_API_KEY:-}" ]; then
            echo "::error title=Safety map refresh is not provisioned::Missing secrets.PHAROS_API_KEY."
            exit 1
          fi

      # KV listing doubles as the namespace/token probe. It also fetches the
      # previous snapshot best-effort so the renderer can arm its delta guard.
      - name: Plan publication from live KV state
        id: plan
        env:
          ACCEPT_SNAPSHOT_TRANSITION: ${{ inputs.accept_snapshot_transition || false }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          args=(
            plan
            "--event-name=${{ github.event_name }}"
            "--out-dir=${MAP_OUT_DIR}"
          )
          if [ "${ACCEPT_SNAPSHOT_TRANSITION}" = "true" ]; then
            args+=(--accept-snapshot-transition)
          fi
          npx tsx scripts/maintenance/publish-safety-score-map.ts "${args[@]}"

      - name: Render and validate publication files
        id: render
        if: steps.plan.outputs.already_published != 'true'
        env:
          PHAROS_API_KEY: ${{ secrets.PHAROS_API_KEY }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts render
          --out-dir="${MAP_OUT_DIR}"

      # Keep a rejected render inspectable even when the publish phase fails.
      - name: Upload the rendered map
        if: steps.plan.outputs.already_published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-map-${{ steps.render.outputs.date }}
          path: |
            ${{ env.MAP_OUT_DIR }}/latest.png
            ${{ env.MAP_OUT_DIR }}/latest.alt.json
            ${{ env.MAP_OUT_DIR }}/latest.snapshot.json
            ${{ env.MAP_OUT_DIR }}/kv-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish in commit-marker order and verify readback
        if: steps.plan.outputs.already_published != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts publish
          --out-dir="${MAP_OUT_DIR}"

      - name: Summarize
        if: always()
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts summary
          --job-status=${{ job.status }}
          --out-dir="${MAP_OUT_DIR}"
