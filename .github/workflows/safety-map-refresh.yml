# Safety Score Map — daily refresh
#
# The workflow owns scheduling, credentials, runner setup, and artifact upload.
# scripts/maintenance/publish-safety-score-map.ts owns the publication state
# machine. Its load-bearing KV order is:
#   safety-map:alt:latest
#   safety-map:YYYY-MM-DD.png (then immediate byte readback verification)
#   safety-map:latest.png
#   safety-map:latest.json (manifest commit marker, always last)
#
# Provisioned inputs:
# - vars.SAFETY_MAP_KV_NAMESPACE_ID is the SELECTOR_SNAPSHOTS namespace id.
# - secrets.SAFETY_MAP_KV_TOKEN has Workers KV Storage: Edit on that namespace.
# - secrets.CLOUDFLARE_ACCOUNT_ID and secrets.PHAROS_API_KEY are shared inputs.
# The purpose-scoped KV token is deliberately not CLOUDFLARE_API_TOKEN.
# Account-state drift coverage lives in weekly-validation.yml.

name: Safety Map Refresh

on:
  # GitHub starts scheduled runs five to eight hours late (observed September
  # 2026), so these slots alone routinely miss the 08:05 UTC digest. The
  # Worker's pre-digest producer kick (digest trigger poll, 06:20-08:00 UTC)
  # dispatches this workflow in `ensure` mode whenever today's manifest is
  # missing; the slots remain a no-cost fallback because `ensure` and
  # `schedule` runs exit early once today's map is live.
  schedule:
    - cron: "20 1 * * *"
    - cron: "20 3 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "force re-renders and supersedes today's map; ensure renders only when today's map is not live yet"
        type: choice
        options:
          - force
          - ensure
        default: force

permissions:
  contents: read

# Writers serialize and never cancel so two runs cannot interleave KV writes.
concurrency:
  group: safety-map-refresh
  cancel-in-progress: false

jobs:
  plan:
    name: Plan publication
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_render: ${{ steps.plan.outputs.should_render }}
      plan_token: ${{ steps.plan.outputs.plan_token }}
    env:
      MAP_OUT_DIR: agents/safety-score-map/ci
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: $/.github/actions/setup-workspace
        with:
          browser-cache: "false"
          bootstrap-generated: "false"
          install-playwright-firefox: "false"

      # KV listing doubles as the namespace/token probe and lets scheduled
      # and ensure-mode runs skip once today's map is already published.
      - name: Plan publication from live KV state
        id: plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
          PLAN_MODE: ${{ github.event_name == 'schedule' && 'ensure' || inputs.mode }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts plan
          --event-name="${{ github.event_name }}"
          --mode="${PLAN_MODE}"
          --out-dir="${MAP_OUT_DIR}"

      - name: Preserve immutable plan state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-map-plan-${{ steps.plan.outputs.plan_token }}
          path: ${{ env.MAP_OUT_DIR }}/publish-state.json
          if-no-files-found: error
          retention-days: 1

      - name: Summarize skipped publication
        if: ${{ always() && steps.plan.outputs.should_render == 'false' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts summary
          --job-status="${JOB_STATUS}"
          --out-dir="${MAP_OUT_DIR}"

  render:
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.should_render == 'true' }}
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAP_OUT_DIR: agents/safety-score-map/ci
      PLAN_TOKEN: ${{ needs.plan.outputs.plan_token }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: $/.github/actions/setup-workspace
        with:
          browser-cache: "true"
          install-playwright-firefox: "true"

      - name: Download immutable plan state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safety-map-plan-${{ needs.plan.outputs.plan_token }}
          path: ${{ env.MAP_OUT_DIR }}

      - name: Verify render credentials
        env:
          PHAROS_API_KEY: ${{ secrets.PHAROS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PHAROS_API_KEY:-}" ]; then
            echo "::error title=Safety map refresh is not provisioned::Missing secrets.PHAROS_API_KEY."
            exit 1
          fi

      - name: Render and validate publication files
        id: render
        env:
          PHAROS_API_KEY: ${{ secrets.PHAROS_API_KEY }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts render
          --plan-token="${PLAN_TOKEN}"
          --out-dir="${MAP_OUT_DIR}"

      # Keep a rejected render inspectable even when the publish phase fails.
      - name: Upload the rendered map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-map-${{ steps.render.outputs.date }}
          path: |
            ${{ env.MAP_OUT_DIR }}/latest.png
            ${{ env.MAP_OUT_DIR }}/latest.alt.json
            ${{ env.MAP_OUT_DIR }}/latest.manifest.json
            ${{ env.MAP_OUT_DIR }}/kv-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish in commit-marker order and verify readback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAFETY_MAP_KV_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.SAFETY_MAP_KV_NAMESPACE_ID }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts publish
          --plan-token="${PLAN_TOKEN}"
          --out-dir="${MAP_OUT_DIR}"

      - name: Summarize
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          npx tsx scripts/maintenance/publish-safety-score-map.ts summary
          --job-status="${JOB_STATUS}"
          --out-dir="${MAP_OUT_DIR}"

  report-failures:
    name: Report main workflow incidents
    needs: [plan, render]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: workflow-incidents-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/report-workflow-failure
        with:
          workflow-file: safety-map-refresh.yml
          needs-json: ${{ toJSON(needs) }}
          job-names-json: '{"plan":"Plan publication","render":"Render and publish"}'
          allowed-skips: ${{ needs.plan.result == 'success' && needs.plan.outputs.should_render == 'false' && 'render' || '' }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-operator-chat-id: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
