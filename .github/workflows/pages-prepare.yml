name: Pages Preparation

on:
  workflow_call:
    outputs:
      workspace_artifact_name:
        description: Prepared workspace artifact from this producer attempt.
        value: ${{ jobs.pages-prepare.outputs.workspace_artifact_name }}

permissions:
  contents: read

jobs:
  pages-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workspace_artifact_name: ${{ steps.workspace-artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pure/history projections need complete ancestry, but no live data.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-generated: "false"
          # This packed workspace feeds the credential-holding pages-release
          # job, so dependencies are installed fresh, never restored writable.
          node-modules-cache: "false"
      - name: Materialize compile-input artifacts
        # The refresh consumes the generated catalog. This lifecycle must never
        # acquire live snapshots: those belong to the Worker-gated release job.
        # npm run puts node_modules/.bin on PATH for the generators' `tsx` children.
        run: npm run generated:compile-input
      - name: Resolve prepared workspace artifact name
        id: workspace-artifact-name
        env:
          WORKSPACE_ARTIFACT_NAME: pages-workspace-production-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          if [[ ! "${WORKSPACE_ARTIFACT_NAME}" =~ ^pages-workspace-production-"${GITHUB_RUN_ID}"-[1-9][0-9]*-"${GITHUB_SHA}"$ ]]; then
            echo "::error::Invalid prepared workspace artifact name."
            exit 1
          fi
          echo "name=${WORKSPACE_ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Package prepared production workspace
        env:
          WORKSPACE_PATHS: |
            node_modules
            public/maps/world-countries.svg
            public/openapi.json
            public/postman/pharos-api.postman_collection.json
            public/postman/pharos-api.postman_environment.json
            shared/data/safety-score-v9/incident-review-key-migration-v1.generated.json
            shared/data/safety-score-v9/incident-runtime-v1.generated.json
            shared/data/safety-score-v9/lane-emitter-descriptors-v1.generated.json
            shared/data/stablecoins/coins.client.detail
            shared/data/stablecoins/coins.client.list.generated.json
            shared/data/stablecoins/coins.compliance.generated.json
            shared/data/stablecoins/coins.generated.json
            shared/data/stablecoins/coins.telegram-mini-app.generated.json
            shared/data/stablecoins/coins.worker-full.generated.json
            shared/data/stablecoins/coins.worker-runtime.generated.json
            shared/data/stablecoins/legacy-llama-redirects.generated.json
            shared/data/stablecoins/report-card-registry-fingerprint.generated.ts
            shared/lib/editorial-style.generated.ts
            src/data/changelogs/index.ts
            src/generated/command-palette-search-data.ts
            src/generated/docs-metadata.json
            src/generated/docs-metadata.json.d.ts
            src/generated/sitemap-dates.json
            src/generated/sitemap-dates.json.d.ts
            src/generated/stablecoin-static-data.ts
            src/lib/case-study-client-index.ts
            worker/src/lib/mint-burn-conservation-runtime.generated.json
        run: |
          mkdir -p "${RUNNER_TEMP}/pharos-pages-workspace"
          mapfile -t paths <<< "${WORKSPACE_PATHS%$'\n'}"
          if [ -d worker/node_modules ]; then paths+=(worker/node_modules); fi
          if [ -d shared/contracts/node_modules ]; then paths+=(shared/contracts/node_modules); fi
          # Transfer only installed dependencies and the compile-input output
          # closure, preserving modes and symlinks. Tracked repo files come from
          # actions/checkout in pages-release; no compiler cache is promoted.
          tar -I 'zstd -T0 -3' -cf "${RUNNER_TEMP}/pharos-pages-workspace/workspace.tar.zst" "${paths[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.workspace-artifact-name.outputs.name }}
          path: ${{ runner.temp }}/pharos-pages-workspace/workspace.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
