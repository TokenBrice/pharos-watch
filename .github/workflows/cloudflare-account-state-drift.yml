name: Cloudflare Account-State Drift

on:
  schedule:
    - cron: "35 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-account-state-drift
  cancel-in-progress: true

jobs:
  compare-account-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-workspace
      - name: Compare Cloudflare account state
        env:
          CLOUDFLARE_ACCOUNT_STATE_DRIFT_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_STATE_DRIFT_API_TOKEN }}
        run: npm run check:cloudflare-account-state
