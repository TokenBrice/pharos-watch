name: Rebuild Pages

on:
  schedule:
    # Refresh after the 08:05 UTC digest run.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages-prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/pages-prepare.yml

  pages-release:
    needs: pages-prepare
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/pages-release.yml
    with:
      workspace_artifact_name: ${{ needs.pages-prepare.outputs.workspace_artifact_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
      SITE_SESSION_SIGNING_KEY: ${{ secrets.SITE_SESSION_SIGNING_KEY }}
      R2_SOCIAL_PREVIEWS_ACCESS_KEY_ID: ${{ secrets.R2_SOCIAL_PREVIEWS_ACCESS_KEY_ID }}
      R2_SOCIAL_PREVIEWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SOCIAL_PREVIEWS_SECRET_ACCESS_KEY }}
