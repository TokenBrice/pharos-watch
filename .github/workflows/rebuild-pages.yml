name: Rebuild Pages

on:
  schedule:
    # Refresh after the 08:05 UTC digest run.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages-prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/pages-prepare.yml

  pages-release:
    needs: pages-prepare
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/pages-release.yml
    with:
      workspace_artifact_name: ${{ needs.pages-prepare.outputs.workspace_artifact_name }}
      refresh_data: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}

  report-failures:
    name: Report main workflow incidents
    needs: [pages-prepare, pages-release]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: workflow-incidents-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/report-workflow-failure
        with:
          workflow-file: rebuild-pages.yml
          needs-json: ${{ toJSON(needs) }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-operator-chat-id: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
