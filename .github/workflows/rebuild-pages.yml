name: Rebuild Pages

on:
  schedule:
    # Refresh after the 08:05 UTC digest run.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages-prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/pages-prepare.yml

  pages-release:
    needs: pages-prepare
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/pages-release.yml
    with:
      workspace_artifact_name: ${{ needs.pages-prepare.outputs.workspace_artifact_name }}
      refresh_data: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
