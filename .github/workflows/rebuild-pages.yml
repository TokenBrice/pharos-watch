name: Rebuild Pages
on:
  schedule:
    # Rebuild daily at 8:15 UTC (after 8 AM digest generation)
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages-release:
    uses: ./.github/workflows/pages-release.yml
    secrets: inherit
