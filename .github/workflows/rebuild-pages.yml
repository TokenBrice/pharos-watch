name: Rebuild Pages
on:
  schedule:
    # Rebuild daily at 8:15 UTC (after 8 AM digest generation)
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  guard-production-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require production rebuilds from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production Pages rebuilds must run from refs/heads/main; got ${GITHUB_REF}."
            exit 1
          fi

  pages-release:
    needs: guard-production-ref
    uses: ./.github/workflows/pages-release.yml
    secrets:
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      DEPEG_EVENTS_API_KEY: ${{ secrets.DEPEG_EVENTS_API_KEY }}
      PUBLIC_DATASETS_API_KEY: ${{ secrets.PUBLIC_DATASETS_API_KEY }}
      SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_SMOKE_CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_ID }}
      OPS_SMOKE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_SECRET }}
