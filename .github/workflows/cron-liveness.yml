name: Cron Liveness Monitor

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cron-liveness-monitor
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live scheduler evidence
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' 'https://api.pharos.watch/api/health' -o "$RUNNER_TEMP/cron-health.json"
          node - "$RUNNER_TEMP/cron-health.json" <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const s = health.schedulerLiveness;
          const h = s?.heavy;
          if (!['healthy', 'degraded', 'stale'].includes(health.status) || !Number.isFinite(health.timestamp)
              || !Array.isArray(health.warnings) || !health.warnings.every(w => typeof w === 'string')
              || !s || !['healthy', 'degraded', 'stale', 'unavailable'].includes(s.status)
              || !Number.isFinite(s.observedAt) || !Number.isFinite(s.warningAfterSec) || !Number.isFinite(s.staleAfterSec)
              || !Array.isArray(s.lanes) || s.lanes.length !== 3
              || !s.lanes.every(l => typeof l.scheduleKey === 'string' && (l.lastStartedAt === null || Number.isFinite(l.lastStartedAt)))
              || !h || typeof h.scheduleKey !== 'string' || !['healthy', 'degraded', 'stale', 'unavailable'].includes(h.status)
              || !Number.isFinite(h.warningAfterSec) || !Number.isFinite(h.staleAfterSec)) {
            throw new Error('Scheduler health schema invalid');
          }
          const keys = new Set(s.lanes.map(l => l.scheduleKey));
          if (!['fiveMinuteReserveRecovery', 'fiveMinuteTelegramAlerts', 'digestTriggerPoll'].every(k => keys.has(k))) throw new Error('Scheduler lanes missing');
          const lanes = s.expectedLanes;
          if (!Array.isArray(lanes) || lanes.length === 0
              || !lanes.every(l => typeof l.scheduleKey === 'string'
                && ['healthy', 'degraded', 'stale', 'unavailable'].includes(l.status)
                && Number.isFinite(l.warningAfterSec) && Number.isFinite(l.staleAfterSec)
                && (l.ageSeconds === null || Number.isFinite(l.ageSeconds)))) {
            throw new Error('Expected lane schema invalid');
          }
          if (!lanes.some(l => l.scheduleKey === 'statusSelfCheckOffset')) throw new Error('Status self-check lane missing');
          if (s.status !== 'healthy' || h.status !== 'healthy' || health.warnings.some(w =>
              ['scheduled_delivery_stalled', 'scheduler_liveness_unavailable', 'heavy_scheduled_delivery_stalled', 'heavy_scheduler_liveness_unavailable'].includes(w))) throw new Error('Scheduler delivery stalled or unavailable');
          const laneEvidence = l =>
            `${l.scheduleKey}:${l.status}:${l.ageSeconds ?? l.unavailableReason ?? 'unknown'} (warn >${l.warningAfterSec}s, stale >${l.staleAfterSec}s)`;
          // Two missed deliveries stay operational (producer grace rule): a lane
          // inside its 3x stale budget is a warning, and only the lane's own
          // stale band (getScheduledLaneLivenessThresholds) opens an incident.
          const degradedLanes = lanes.filter(l => l.status === 'degraded');
          if (degradedLanes.length > 0) {
            console.log(`::warning::Scheduled lane delivery degraded: ${degradedLanes.map(laneEvidence).join(', ')}`);
          }
          const failedLanes = lanes.filter(l => l.status === 'stale' || l.status === 'unavailable');
          if (failedLanes.length > 0) {
            throw new Error(`Scheduled lane delivery stale or unavailable: ${failedLanes.map(laneEvidence).join(', ')}`);
          }
          const oa = health.operatorAlerts;
          if (oa === undefined) {
            // An up-to-30-minute public-health snapshot written before this
            // receipt shipped can omit the field. That is unknown evidence,
            // not an unconfigured channel: warn instead of paging.
            console.log('::warning::Operator alert receipt absent from the served health snapshot; treating the channel as unknown.');
          } else if (!oa || !['healthy', 'stale', 'unavailable'].includes(oa.status)
              || (oa.operatorConfigured !== null && typeof oa.operatorConfigured !== 'boolean')
              || !Number.isFinite(oa.maxPendingSec)
              || (oa.pendingSince !== null && !Number.isFinite(oa.pendingSince))
              || !Array.isArray(oa.pendingProducers)) {
            throw new Error('Operator alert receipt schema invalid');
          } else if (oa.status !== 'healthy') {
            throw new Error(`Operator alert channel ${oa.status}: ${oa.reason ?? oa.unavailableReason ?? 'unknown'} (pending ${oa.pendingProducers.join(',') || 'none'} ${oa.pendingAgeSec ?? 'n/a'}s > ${oa.maxPendingSec}s)`);
          }
          if (![s.lastAnyStartedAt, s.lastFiveMinuteStartedAt, s.ageSeconds].every(Number.isFinite)
              || s.ageSeconds < 0 || s.ageSeconds > s.warningAfterSec || s.lastFiveMinuteStartedAt > s.observedAt
              || Math.abs(Date.now() / 1000 - s.observedAt) > 120) throw new Error('Scheduler evidence invalid or not live');
          if (![h.lastStartedAt, h.ageSeconds].every(Number.isFinite)
              || h.ageSeconds < 0 || h.ageSeconds > h.warningAfterSec || h.lastStartedAt > s.observedAt)
            throw new Error('Heavy scheduler evidence invalid or not live');
          console.log('Scheduled delivery healthy', s);
          NODE
      - name: Upsert delivery incident before failing
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/cron-liveness-incident.md"
          printf '%s\n' \
            'The external scheduled-delivery monitor failed: transport, schema, missing evidence, or a delivery stall.' \
            "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Runbook: https://github.com/TokenBrice/pharos-watch/blob/main/docs/runbooks/cron-delivery-stall.md' \
            'Do not automatically PUT/reset schedules, leases, or checkpoints.' > "$body"
          issue_number=$(gh issue list --state open --search 'in:title "Scheduled delivery incident"' --json number,title --jq '[.[] | select(.title == "Scheduled delivery incident")][0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "$body"
          else
            gh issue create --title 'Scheduled delivery incident' --body-file "$body"
          fi
      - name: Close recovered delivery incident
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(gh issue list --state open --search 'in:title "Scheduled delivery incident"' --json number,title --jq '[.[] | select(.title == "Scheduled delivery incident")][0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --reason completed \
              --comment "Recovered: the external scheduled-delivery monitor passed again (https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
      - name: Fail on unavailable or stalled delivery
        if: steps.health.outcome == 'failure'
        run: exit 1
