name: Weekly Validation

on:
  schedule:
    # GitHub documents that top-of-hour schedules can be delayed or dropped
    # under load. Keep this weekly ratchet off that contention boundary.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      # Full-lockfile scope includes dev/build dependencies. The verifier is
      # fail-closed and accepts only an unexpired, exact registry entry.
      - run: node --import tsx scripts/ci/verify-dependency-audit.ts
      - name: Verify package signatures
        if: always()
        run: npm audit signatures

  html-fixture-age:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      # Reserve adapter fixtures are captures of live issuer dashboards, so
      # they expire on the calendar rather than on any diff. The PR gate can
      # never own this: a branch that touches nothing would start failing on
      # the day a fixture crossed 90 days. The weekly ratchet is the owner.
      - name: Check reserve HTML fixture capture ages
        run: npm run check:html-fixture-age

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"

      # The gitleaks version + tarball SHA-256 pin lives only in
      # scripts/ci/run-gitleaks.ts, which downloads and checksum-verifies the
      # pinned binary before scanning. The runner imports only Node builtins,
      # so the scan needs no npm installation, matching the PR preflight
      # invocation.
      - name: Scan git history for secrets
        env:
          GITLEAKS_FULL_HISTORY: "1"
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/run-gitleaks.ts --range

  all-critical-ratchet:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CRITICAL_COVERAGE_RATCHET_ALL: "1"
      CRITICAL_COVERAGE_THRESHOLD: "40"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - run: npm run coverage:critical

  telegram-load:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: telegram-load
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - run: npm run check:telegram-load

  compare-account-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: cloudflare-account-state-drift
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: $/.github/actions/setup-workspace
      - name: Compare Cloudflare account state
        env:
          CLOUDFLARE_ACCOUNT_STATE_DRIFT_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_STATE_DRIFT_API_TOKEN }}
        run: npm run check:cloudflare-account-state

  dependency-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - name: Capture production dependency coverage
        env:
          DEPENDENCY_COVERAGE_API_KEY: ${{ secrets.PHAROS_API_KEY }}
        run: npm run audit:coverage -- --domain=dependency-coverage --prod --format=json --report=.tmp/dependency-coverage/audit.json
      - name: Evaluate published dependency structure
        run: |
          node --import tsx --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { evaluateDependencyCoverageStructure, renderDependencyCoverageAuditMarkdown } from "./scripts/maintenance/generate-dependency-coverage-audit.ts";
          const audit = JSON.parse(readFileSync(".tmp/dependency-coverage/audit.json", "utf8"));
          writeFileSync(".tmp/dependency-coverage/audit.md", renderDependencyCoverageAuditMarkdown(audit));
          if (audit.summary.publicationComparisonStatus === "checkout-production-skew") {
            console.warn(`::warning title=checkout-production-skew::Publication methodology ${audit.summary.publicationMethodologyVersion} differs from checkout ${audit.summary.checkoutMethodologyVersion}; only skew-independent invariants are gated.`);
          }
          const failures = evaluateDependencyCoverageStructure(audit, { requireAdapterMappingCoverage: true, publishedOnly: true });
          if (failures.length) {
            console.error(failures.join("\n"));
            process.exitCode = 1;
          }
          JS
      - name: Reconcile static and published graphs (advisory)
        if: always()
        continue-on-error: true
        run: npm run audit:dependency-reconcile -- --audit=.tmp/dependency-coverage/audit.json --report=.tmp/dependency-coverage/reconciliation.md
      - name: Retain dependency review evidence
        id: snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/dependency-coverage/
          retention-days: 90
          if-no-files-found: warn
      - name: Alert on weekly production failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_URL: ${{ steps.snapshots.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          printf '%s\n' \
            '<!-- dependency-coverage-weekly -->' \
            '# Dependency coverage weekly failure' \
            'Review the dependency-coverage drain queue. Findings never authorize edges automatically.' \
            "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "Full audit and advisory reconciliation: ${SNAPSHOT_URL:-artifact unavailable; inspect run logs}." \
            'This weekly gate does not block releases.' > "$body"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Dependency coverage weekly failure"' --json number,title --jq '[.[] | select(.title == "Dependency coverage weekly failure")][0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Dependency coverage weekly failure" --body-file "$body"
          fi
