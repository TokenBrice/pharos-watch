name: OG Refresh

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          browser-cache: "true"
          install-playwright-chromium: "true"
      - name: Capture OG screenshots from production
        env:
          OG_BASE_URL: https://stablecoin-dashboard.pages.dev
        run: npm run og:capture
      - name: Detect diff
        id: diff
        run: |
          if git diff --quiet -- public/og-*.png; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            git status --short -- public/og-*.png
          fi
      - name: Open or update refresh PR
        if: steps.diff.outputs.has_diff == 'true'
        env:
          AUTOMATION_GITHUB_TOKEN: ${{ secrets.OG_REFRESH_GITHUB_TOKEN }}
          PR_BODY: Automated weekly refresh of static OG screenshots via `npm run og:capture` against the production Pages deployment at `https://stablecoin-dashboard.pages.dev`. See [docs/og-images.md](../blob/main/docs/og-images.md).
        run: |
          node --import tsx scripts/ci/open-automated-refresh-pr.ts \
            --branch automated/og-refresh \
            --path 'public/og-*.png' \
            --title "chore(og): refresh static OG screenshots" \
            --body "$PR_BODY"
