name: Secret Scan

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap-generated: "false"

      # The gitleaks version + tarball SHA-256 pin lives only in
      # scripts/ci/run-gitleaks.ts, which downloads and checksum-verifies the
      # pinned binary before scanning.
      - name: Scan git history for secrets
        env:
          GITLEAKS_FULL_HISTORY: "1"
        run: node --import tsx scripts/ci/run-gitleaks.ts --range
