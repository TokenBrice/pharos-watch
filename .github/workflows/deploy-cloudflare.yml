name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      surface:
        description: Production surface to deploy.
        required: true
        default: both
        type: choice
        options:
          - both
          - pages
          - worker

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_required: ${{ steps.classify.outputs.pages_deploy_required }}
      worker_required: ${{ steps.classify.outputs.worker_deploy_required }}
    steps:
      - name: Require production deploys from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploys must run from refs/heads/main; got ${GITHUB_REF}."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: "24.16.0"
          cache-npm: "false"
          install-deps: "false"
          bootstrap-generated: "false"
      - id: classify
        name: Select production surfaces
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.sha }}
          MANUAL_SURFACE: ${{ inputs.surface }}
        run: |
          if [ "${DEPLOY_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_SURFACE}" in
              both)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=true" >> "$GITHUB_OUTPUT"
                ;;
              pages)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=false" >> "$GITHUB_OUTPUT"
                ;;
              worker)
                echo "pages_deploy_required=false" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported manual surface: ${MANUAL_SURFACE}"
                exit 1
                ;;
            esac
          else
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/classify-deploy-changes.ts >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.pharos.watch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Check Worker migrations
        run: npm run check:migrations
      - name: Package Worker before D1 mutation
        run: npm run check:worker-package
      - name: Apply production D1 migrations
        run: cd worker && npx --no-install wrangler d1 migrations apply stablecoin-db --remote
      - name: Deploy Worker
        run: >-
          cd worker
          && npx --no-install wrangler deploy --strict
          --message "GitHub Actions deploy ${GITHUB_SHA}"
      - id: verify-worker-deployment
        name: Verify active Worker deployment
        run: |
          status_file="${RUNNER_TEMP}/worker-deployment-status.json"
          deployments_file="${RUNNER_TEMP}/worker-deployments.json"
          deployment_history_available=true
          (cd worker && npx --no-install wrangler deployments status --json) > "${status_file}"
          if ! (cd worker && npx --no-install wrangler deployments list --json) > "${deployments_file}"; then
            deployment_history_available=false
            echo "::warning::Cloudflare deployment history was unavailable; the activation marker will be skipped."
          fi

          DEPLOYMENT_HISTORY_AVAILABLE="${deployment_history_available}" DEPLOYMENT_STATUS_FILE="${status_file}" DEPLOYMENTS_FILE="${deployments_file}" node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const deployment = JSON.parse(readFileSync(process.env.DEPLOYMENT_STATUS_FILE, "utf8"));
          const versions = Array.isArray(deployment.versions) ? deployment.versions : [];
          const message = deployment.annotations?.["workers/message"] ?? "";
          const version = versions[0];

          if (
            versions.length !== 1
            || version?.percentage !== 100
            || typeof version?.version_id !== "string"
            || message !== `GitHub Actions deploy ${process.env.GITHUB_SHA}`
          ) {
            throw new Error(
              `Active Worker deployment did not match this release: ${JSON.stringify({
                deploymentId: deployment.id ?? null,
                message,
                versions,
              })}`,
            );
          }

          let deployments = [];
          if (process.env.DEPLOYMENT_HISTORY_AVAILABLE === "true") {
            try {
              const parsed = JSON.parse(readFileSync(process.env.DEPLOYMENTS_FILE, "utf8"));
              deployments = Array.isArray(parsed) ? parsed : [];
            } catch {
              console.log("::warning::Cloudflare deployment history JSON was unavailable; the activation marker will be skipped.");
            }
          }
          const listedDeployment = deployments.find((candidate) => candidate?.id === deployment.id);
          const listedVersions = Array.isArray(listedDeployment?.versions) ? listedDeployment.versions : [];
          const listedVersionMatches = listedVersions.some(
            (candidate) => candidate?.version_id === version.version_id,
          );
          const activationAtMs = typeof listedDeployment?.created_on === "string"
            ? Date.parse(listedDeployment.created_on)
            : Number.NaN;
          const activationAtSec = Number.isFinite(activationAtMs) && listedVersionMatches
            ? Math.floor(activationAtMs / 1000)
            : null;

          console.log(
            `[worker-deployment] OK deployment=${deployment.id} version=${version.version_id} traffic=100%`,
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `worker_version=${version.version_id}\n`);
          if (Number.isSafeInteger(activationAtSec) && activationAtSec > 0) {
            appendFileSync(process.env.GITHUB_OUTPUT, `worker_activation_at=${activationAtSec}\n`);
            console.log(
              `[worker-deployment] Cloudflare activation created_on=${listedDeployment.created_on} epoch=${activationAtSec}`,
            );
          } else {
            console.log(
              `::warning::Cloudflare deployment ${deployment.id} had no valid matching created_on; the activation marker will be skipped.`,
            );
          }
          NODE
      - name: Record Worker activation marker
        env:
          WORKER_ACTIVATED_AT: ${{ steps.verify-worker-deployment.outputs.worker_activation_at }}
          WORKER_VERSION: ${{ steps.verify-worker-deployment.outputs.worker_version }}
        run: |
          if [[ ! "${WORKER_VERSION}" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "::warning::Skipping Worker activation marker: invalid verified version identity."
            exit 0
          fi
          if [[ ! "${WORKER_ACTIVATED_AT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::Skipping Worker activation marker: Cloudflare created_on timestamp is unavailable."
            exit 0
          fi

          marker_sql="INSERT INTO cache (key, value, updated_at) VALUES ('worker-version-activated:${WORKER_VERSION}', json_object('workerVersion', '${WORKER_VERSION}', 'activatedAt', ${WORKER_ACTIVATED_AT}, 'source', 'cloudflare-deployment.created_on'), ${WORKER_ACTIVATED_AT}) ON CONFLICT(key) DO NOTHING"
          if ! (cd worker && npx --no-install wrangler d1 execute stablecoin-db --remote --command "${marker_sql}"); then
            echo "::warning::Worker activation marker write failed for ${WORKER_VERSION}; deploy remains successful and classification will fail closed."
          fi
      - name: Summarize Worker release
        if: always()
        run: |
          {
            echo "## Worker release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Rollback: use Cloudflare deployment history or \`wrangler rollback [VERSION-ID] --yes\`."
            echo "- Warning: Worker rollback does not reverse D1 migrations or other bound-resource changes."
          } >> "$GITHUB_STEP_SUMMARY"

  pages-release:
    needs:
      - plan
      - deploy-worker
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && needs.plan.outputs.pages_required == 'true'
        && (
          needs.plan.outputs.worker_required != 'true'
          || needs.deploy-worker.result == 'success'
        )
      }}
    uses: ./.github/workflows/pages-release.yml
    with:
      # Code deploys refresh digest/depeg/public-dataset snapshots so digest
      # detail pages, sitemap, and RSS do not regress to the committed
      # snapshot's age on every merge. The refresh step is fail-open: on
      # fetch failure or a shrinking archive it falls back to the committed
      # snapshot instead of failing the deploy.
      refresh_data: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  post-deploy-acceptance:
    needs:
      - plan
      - deploy-worker
      - pages-release
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && (
          needs.deploy-worker.result == 'success'
          || needs.pages-release.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.acceptance.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: "24.16.0"
          cache-npm: "false"
          install-deps: "false"
          bootstrap-generated: "false"
      - id: acceptance
        name: Record read-only operational acceptance
        env:
          PAGES_DEPLOYED: ${{ needs.pages-release.result == 'success' }}
          WORKER_DEPLOYED: ${{ needs.deploy-worker.result == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          import { fetchJsonProbe, collectWorkerHttpProbes } from "./scripts/lib/worker-http-probes.mts";
          import {
            selectPostDeployProbes,
            summarizePostDeployAcceptance,
          } from "./scripts/lib/post-deploy-acceptance.mts";

          const probes = selectPostDeployProbes({
            pagesDeployed: process.env.PAGES_DEPLOYED === "true",
            workerDeployed: process.env.WORKER_DEPLOYED === "true",
          });
          const results = [];

          for (const probe of probes) {
            if (probe.id === "pages-shell") {
              const response = await fetchJsonProbe(
                { apiUrl: "https://stablecoin-dashboard.pages.dev" },
                "/",
              );
              const shell = typeof response.payload === "string" ? response.payload : "";
              results.push({
                ...probe,
                outcome: response.ok && /<html[\s>]/i.test(shell) ? "passed" : "failed",
                detail: "GET " + response.url + " returned " + response.status + ".",
              });
              continue;
            }

            if (probe.id === "worker-health") {
              const { health } = await collectWorkerHttpProbes(
                { apiUrl: "https://api.pharos.watch" },
                { includeHealth: true },
              );
              const healthState = health?.payload?.status;
              results.push({
                ...probe,
                outcome: health?.ok && healthState === "healthy" ? "passed" : "failed",
                detail:
                  "GET " + (health?.url ?? "https://api.pharos.watch/api/health")
                  + " returned " + (health?.status ?? 0) + (healthState ? " (" + healthState + ")." : "."),
              });
              continue;
            }
          }

          const acceptance = summarizePostDeployAcceptance(results);
          console.log(JSON.stringify({ probes: results, acceptance }, null, 2));
          const lines = [
            "## Post-deploy operational acceptance",
            "",
            "- Outcome: " + acceptance.outcome,
            "- " + acceptance.reason,
            "- Scope: read-only GET probes only; no production mutation or automatic rollback.",
            "",
            "| Probe | Surface | Outcome | Evidence |",
            "| --- | --- | --- | --- |",
            ...results.map((result) => "| " + result.id + " | " + result.surface + " | " + result.outcome + " | " + result.detail + " |"),
            "",
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          appendFileSync(process.env.GITHUB_OUTPUT, "outcome=" + acceptance.outcome + "\n");

          if (acceptance.outcome === "failed") process.exitCode = 1;
          NODE
