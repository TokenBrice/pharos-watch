name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      surface:
        description: Production surface to deploy.
        required: true
        default: both
        type: choice
        options:
          - both
          - pages
          - worker

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_required: ${{ steps.classify.outputs.pages_deploy_required }}
      worker_required: ${{ steps.classify.outputs.worker_deploy_required }}
    steps:
      - name: Require production deploys from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploys must run from refs/heads/main; got ${GITHUB_REF}."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
        with:
          node-version: "24.16.0"
          cache-npm: "false"
          install-deps: "false"
          bootstrap-generated: "false"
      - id: classify
        name: Select production surfaces
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.sha }}
          MANUAL_SURFACE: ${{ inputs.surface }}
        run: |
          if [ "${DEPLOY_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_SURFACE}" in
              both)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=true" >> "$GITHUB_OUTPUT"
                ;;
              pages)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=false" >> "$GITHUB_OUTPUT"
                ;;
              worker)
                echo "pages_deploy_required=false" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported manual surface: ${MANUAL_SURFACE}"
                exit 1
                ;;
            esac
          else
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/classify-deploy-changes.ts >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      worker_version: ${{ steps.verify-worker-deployment.outputs.worker_version }}
      heavy_worker_version: ${{ steps.verify-heavy-deployment.outputs.worker_version }}
    environment:
      name: production
      url: https://api.pharos.watch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - name: Check Worker migrations
        run: npm run check:migrations
      - name: Package both Workers before D1 mutation
        run: npm run check:worker-package
      - name: Apply production D1 migrations
        run: cd worker && npx --no-install wrangler d1 migrations apply stablecoin-db --remote
      - name: Deploy heavy Worker
        run: >-
          cd worker
          && npx --no-install wrangler deploy --strict --config wrangler.heavy.toml
          --message "GitHub Actions deploy ${GITHUB_SHA}"
      - id: verify-heavy-deployment
        name: Verify active heavy Worker deployment
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/verify-worker-deployment.ts --script-name stablecoin-heavy
      - name: Deploy public Worker
        run: >-
          cd worker
          && npx --no-install wrangler deploy --strict --config wrangler.toml
          --message "GitHub Actions deploy ${GITHUB_SHA}"
      - id: verify-worker-deployment
        name: Verify active public Worker deployment
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/verify-worker-deployment.ts --script-name stablecoin-api
      - name: Record verified Worker activation markers
        env:
          PUBLIC_ACTIVATED_AT: ${{ steps.verify-worker-deployment.outputs.worker_activation_at }}
          PUBLIC_VERSION: ${{ steps.verify-worker-deployment.outputs.worker_version }}
          HEAVY_ACTIVATED_AT: ${{ steps.verify-heavy-deployment.outputs.worker_activation_at }}
          HEAVY_VERSION: ${{ steps.verify-heavy-deployment.outputs.worker_version }}
        run: |
          for role in heavy public; do
            if [ "${role}" = heavy ]; then
              script_name=stablecoin-heavy
              version="${HEAVY_VERSION}"
              activated_at="${HEAVY_ACTIVATED_AT}"
            else
              script_name=stablecoin-api
              version="${PUBLIC_VERSION}"
              activated_at="${PUBLIC_ACTIVATED_AT}"
            fi
            if [[ ! "${version}" =~ ^[A-Za-z0-9._:-]+$ ]] || [[ ! "${activated_at}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Cannot record ${role} activation: verified identity or Cloudflare created_on is unavailable."
              exit 1
            fi
            marker_sql="INSERT INTO cache (key, value, updated_at) VALUES ('worker-version-activated:${version}', json_object('workerVersion', '${version}', 'activatedAt', ${activated_at}, 'source', 'cloudflare-deployment.created_on'), ${activated_at}) ON CONFLICT(key) DO NOTHING; INSERT INTO cache (key, value, updated_at) VALUES ('worker-active-version:${role}', json_object('worker', '${role}', 'scriptName', '${script_name}', 'workerVersion', '${version}', 'activatedAt', ${activated_at}), ${activated_at}) ON CONFLICT(key) DO UPDATE SET value = excluded.value, updated_at = excluded.updated_at WHERE excluded.updated_at >= cache.updated_at;"
            (cd worker && npx --no-install wrangler d1 execute stablecoin-db --remote --command "${marker_sql}")
          done
      - name: Summarize Worker release
        if: always()
        run: |
          {
            echo "## Worker release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Rollback topology: restore moved plans/triggers/Workflow to public first, then drain and disable heavy with explicit empty crons."
            echo "- Warning: version rollback alone restores neither trigger ownership nor D1 migrations."
          } >> "$GITHUB_STEP_SUMMARY"

  pages-prepare:
    needs: plan
    if: ${{ needs.plan.outputs.pages_required == 'true' }}
    uses: $/.github/workflows/pages-prepare.yml

  pages-release:
    needs:
      - plan
      - deploy-worker
      - pages-prepare
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && needs.plan.outputs.pages_required == 'true'
        && needs.pages-prepare.result == 'success'
        && (
          needs.plan.outputs.worker_required != 'true'
          || needs.deploy-worker.result == 'success'
        )
      }}
    uses: $/.github/workflows/pages-release.yml
    with:
      workspace_artifact_name: ${{ needs.pages-prepare.outputs.workspace_artifact_name }}
      # Code deploys refresh digest/depeg/public-dataset snapshots so digest
      # detail pages, sitemap, and RSS do not regress to the committed
      # snapshot's age on every merge. The refresh step is fail-open: on
      # fetch failure or a shrinking archive it falls back to the committed
      # snapshot instead of failing the deploy.
      refresh_data: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}

  post-deploy-acceptance:
    needs:
      - plan
      - deploy-worker
      - pages-release
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && (
          needs.deploy-worker.result == 'success'
          || needs.pages-release.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.acceptance.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
        with:
          node-version: "24.16.0"
          cache-npm: "false"
          install-deps: "false"
          bootstrap-generated: "false"
      - id: verify-worker-identity
        name: Re-verify active public Worker release identity
        if: ${{ needs.deploy-worker.result == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/verify-worker-deployment.ts --script-name stablecoin-api
      - id: verify-heavy-identity
        name: Re-verify active heavy Worker release identity
        if: ${{ always() && needs.deploy-worker.result == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/verify-worker-deployment.ts --script-name stablecoin-heavy
      - name: Require unchanged heavy activation identity
        if: ${{ always() && needs.deploy-worker.result == 'success' }}
        env:
          EXPECTED_HEAVY_VERSION: ${{ needs.deploy-worker.outputs.heavy_worker_version }}
          OBSERVED_HEAVY_VERSION: ${{ steps.verify-heavy-identity.outputs.worker_version }}
        run: test -n "${EXPECTED_HEAVY_VERSION}" && test "${EXPECTED_HEAVY_VERSION}" = "${OBSERVED_HEAVY_VERSION}"
      - id: acceptance
        name: Record deployment identity and operational acceptance
        if: ${{ always() }}
        env:
          PAGES_DEPLOYED: ${{ needs.pages-release.result == 'success' }}
          WORKER_DEPLOYED: ${{ needs.deploy-worker.result == 'success' }}
          EXPECTED_PAGES_COMMIT: ${{ github.sha }}
          EXPECTED_WORKER_VERSION: ${{ needs.deploy-worker.outputs.worker_version }}
          OBSERVED_WORKER_VERSION: ${{ steps.verify-worker-identity.outputs.worker_version }}
          EXPECTED_HEAVY_WORKER_VERSION: ${{ needs.deploy-worker.outputs.heavy_worker_version }}
          OBSERVED_HEAVY_WORKER_VERSION: ${{ steps.verify-heavy-identity.outputs.worker_version }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/run-post-deploy-acceptance.ts

  report-failures:
    name: Report main workflow incidents
    needs: [plan, deploy-worker, pages-prepare, pages-release, post-deploy-acceptance]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: workflow-incidents-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/report-workflow-failure
        with:
          workflow-file: deploy-cloudflare.yml
          needs-json: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ format('{0},{1},{2}',
                needs.plan.result == 'success' && needs.plan.outputs.worker_required == 'false' && 'deploy-worker' || '',
                needs.plan.result == 'success' && needs.plan.outputs.pages_required == 'false' && 'pages-prepare,pages-release' || '',
                needs.plan.result == 'success' && needs.plan.outputs.worker_required == 'false' && needs.plan.outputs.pages_required == 'false' && 'post-deploy-acceptance' || '') }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-operator-chat-id: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
