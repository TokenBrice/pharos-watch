name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  schedule:
    # Rebuild daily at 8:15 UTC (after 8 AM digest generation)
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:worker-boundary
      - run: npm run check:migrations
      - run: npm test
      - run: npm run coverage:critical
        env:
          CRITICAL_COVERAGE_THRESHOLD: "40"
          CRITICAL_COVERAGE_COMPARE_REF: ${{ github.event.before }}
      - run: cd worker && npm ci
      - run: cd worker && npx tsc --noEmit

  deploy-worker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd worker && npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply stablecoin-db --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  smoke-api:
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:smoke-api
        env:
          SMOKE_API_BASE: ${{ vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}

  deploy-pages:
    needs: smoke-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sync-digests.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
      - run: npm run seo:check
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=stablecoin-dashboard --commit-dirty=true --commit-message="${{ github.sha }}"

  smoke-ui:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:smoke-ui
        env:
          SMOKE_UI_URL: ${{ vars.SMOKE_UI_URL || 'https://pharos.watch' }}
