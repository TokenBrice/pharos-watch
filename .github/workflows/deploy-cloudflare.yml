name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      surface:
        description: Production surface to deploy.
        required: true
        default: both
        type: choice
        options:
          - both
          - pages
          - worker

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_required: ${{ steps.classify.outputs.pages_deploy_required }}
      worker_required: ${{ steps.classify.outputs.worker_promotion_required }}
    steps:
      - name: Require production deploys from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploys must run from refs/heads/main; got ${GITHUB_REF}."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Select production surfaces
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.sha }}
          MANUAL_SURFACE: ${{ inputs.surface }}
        run: |
          if [ "${DEPLOY_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_SURFACE}" in
              both)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_promotion_required=true" >> "$GITHUB_OUTPUT"
                ;;
              pages)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_promotion_required=false" >> "$GITHUB_OUTPUT"
                ;;
              worker)
                echo "pages_deploy_required=false" >> "$GITHUB_OUTPUT"
                echo "worker_promotion_required=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported manual surface: ${MANUAL_SURFACE}"
                exit 1
                ;;
            esac
          else
            node scripts/ci/classify-deploy-changes.mjs >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.pharos.watch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Check Worker migrations
        run: npm run check:migrations
      - name: Apply production D1 migrations
        run: cd worker && npx --no-install wrangler d1 migrations apply stablecoin-db --remote
      - name: Deploy Worker
        run: >-
          cd worker
          && npx --no-install wrangler deploy --strict
          --message "GitHub Actions deploy ${GITHUB_SHA}"
      - name: Verify authenticated Worker health
        env:
          SITE_API_SHARED_SECRET: ${{ secrets.SITE_API_SHARED_SECRET }}
        run: |
          node <<'NODE'
          const url = new URL("https://site-api.pharos.watch/api/health");
          url.searchParams.set("deploy", process.env.GITHUB_SHA);
          const accepted = new Set(["healthy", "degraded", "stale"]);
          let lastError = "not attempted";

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const response = await fetch(url, {
                cache: "no-store",
                headers: {
                  Accept: "application/json",
                  "X-Pharos-Site-Proxy-Secret": process.env.SITE_API_SHARED_SECRET,
                },
                signal: AbortSignal.timeout(10_000),
              });
              const body = await response.json().catch(() => null);
              if (response.ok && accepted.has(body?.status)) {
                console.log(`[worker-health] OK status=${body.status}`);
                process.exit(0);
              }
              lastError = `HTTP ${response.status}, status=${body?.status ?? "missing"}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            console.log(`[worker-health] attempt ${attempt}/6 failed: ${lastError}`);
            if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          throw new Error(`Authenticated Worker health check failed: ${lastError}`);
          NODE
      - name: Summarize Worker release
        if: always()
        run: |
          {
            echo "## Worker release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Rollback: use Cloudflare deployment history or \`wrangler rollback [VERSION-ID] --yes\`."
            echo "- Warning: Worker rollback does not reverse D1 migrations or other bound-resource changes."
          } >> "$GITHUB_STEP_SUMMARY"

  pages-release:
    needs:
      - plan
      - deploy-worker
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && needs.plan.outputs.pages_required == 'true'
        && (
          needs.plan.outputs.worker_required != 'true'
          || needs.deploy-worker.result == 'success'
        )
      }}
    uses: ./.github/workflows/pages-release.yml
    with:
      refresh_data: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
