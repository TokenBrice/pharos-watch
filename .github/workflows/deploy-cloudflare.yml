name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      surface:
        description: Production surface to deploy.
        required: true
        default: both
        type: choice
        options:
          - both
          - pages
          - worker

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_required: ${{ steps.classify.outputs.pages_deploy_required }}
      worker_required: ${{ steps.classify.outputs.worker_deploy_required }}
    steps:
      - name: Require production deploys from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploys must run from refs/heads/main; got ${GITHUB_REF}."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Select production surfaces
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.sha }}
          MANUAL_SURFACE: ${{ inputs.surface }}
        run: |
          if [ "${DEPLOY_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_SURFACE}" in
              both)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=true" >> "$GITHUB_OUTPUT"
                ;;
              pages)
                echo "pages_deploy_required=true" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=false" >> "$GITHUB_OUTPUT"
                ;;
              worker)
                echo "pages_deploy_required=false" >> "$GITHUB_OUTPUT"
                echo "worker_deploy_required=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported manual surface: ${MANUAL_SURFACE}"
                exit 1
                ;;
            esac
          else
            node --import tsx scripts/ci/classify-deploy-changes.ts >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.pharos.watch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Check Worker migrations
        run: npm run check:migrations
      - name: Package Worker before D1 mutation
        run: npm run check:worker-package
      - name: Apply production D1 migrations
        run: cd worker && npx --no-install wrangler d1 migrations apply stablecoin-db --remote
      - name: Deploy Worker
        run: >-
          cd worker
          && npx --no-install wrangler deploy --strict
          --message "GitHub Actions deploy ${GITHUB_SHA}"
      - name: Verify active Worker deployment
        run: |
          status_file="${RUNNER_TEMP}/worker-deployment-status.json"
          (cd worker && npx --no-install wrangler deployments status --json) > "${status_file}"

          DEPLOYMENT_STATUS_FILE="${status_file}" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const deployment = JSON.parse(readFileSync(process.env.DEPLOYMENT_STATUS_FILE, "utf8"));
          const versions = Array.isArray(deployment.versions) ? deployment.versions : [];
          const message = deployment.annotations?.["workers/message"] ?? "";
          const version = versions[0];

          if (
            versions.length !== 1
            || version?.percentage !== 100
            || typeof version?.version_id !== "string"
            || message !== `GitHub Actions deploy ${process.env.GITHUB_SHA}`
          ) {
            throw new Error(
              `Active Worker deployment did not match this release: ${JSON.stringify({
                deploymentId: deployment.id ?? null,
                message,
                versions,
              })}`,
            );
          }

          console.log(
            `[worker-deployment] OK deployment=${deployment.id} version=${version.version_id} traffic=100%`,
          );
          NODE
      - name: Summarize Worker release
        if: always()
        run: |
          {
            echo "## Worker release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Rollback: use Cloudflare deployment history or \`wrangler rollback [VERSION-ID] --yes\`."
            echo "- Warning: Worker rollback does not reverse D1 migrations or other bound-resource changes."
          } >> "$GITHUB_STEP_SUMMARY"

  pages-release:
    needs:
      - plan
      - deploy-worker
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && needs.plan.outputs.pages_required == 'true'
        && (
          needs.plan.outputs.worker_required != 'true'
          || needs.deploy-worker.result == 'success'
        )
      }}
    uses: ./.github/workflows/pages-release.yml
    with:
      # Code deploys refresh digest/depeg/public-dataset snapshots so digest
      # detail pages, sitemap, and RSS do not regress to the committed
      # snapshot's age on every merge. The refresh step is fail-open: on
      # fetch failure or a shrinking archive it falls back to the committed
      # snapshot instead of failing the deploy.
      refresh_data: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  post-deploy-acceptance:
    needs:
      - plan
      - deploy-worker
      - pages-release
    if: >-
      ${{
        always()
        && needs.plan.result == 'success'
        && (
          needs.deploy-worker.result == 'success'
          || needs.pages-release.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.acceptance.outputs.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.16.0"
      - id: acceptance
        name: Record read-only operational acceptance
        env:
          PAGES_DEPLOYED: ${{ needs.pages-release.result == 'success' }}
          WORKER_DEPLOYED: ${{ needs.deploy-worker.result == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          import { fetchJsonProbe, collectWorkerHttpProbes } from "./scripts/lib/worker-http-probes.mjs";
          import {
            selectPostDeployProbes,
            summarizePostDeployAcceptance,
          } from "./scripts/lib/post-deploy-acceptance.mjs";

          const probes = selectPostDeployProbes({
            pagesDeployed: process.env.PAGES_DEPLOYED === "true",
            workerDeployed: process.env.WORKER_DEPLOYED === "true",
          });
          const results = [];

          for (const probe of probes) {
            if (probe.id === "pages-shell") {
              const response = await fetchJsonProbe(
                { apiUrl: "https://stablecoin-dashboard.pages.dev" },
                "/",
              );
              const shell = typeof response.payload === "string" ? response.payload : "";
              results.push({
                ...probe,
                outcome: response.ok && /<html[\s>]/i.test(shell) ? "passed" : "failed",
                detail: "GET " + response.url + " returned " + response.status + ".",
              });
              continue;
            }

            if (probe.id === "worker-health") {
              const { health } = await collectWorkerHttpProbes(
                { apiUrl: "https://api.pharos.watch" },
                { includeHealth: true },
              );
              const healthState = health?.payload?.status;
              results.push({
                ...probe,
                outcome: health?.ok && healthState === "healthy" ? "passed" : "failed",
                detail:
                  "GET " + (health?.url ?? "https://api.pharos.watch/api/health")
                  + " returned " + (health?.status ?? 0) + (healthState ? " (" + healthState + ")." : "."),
              });
              continue;
            }
          }

          const acceptance = summarizePostDeployAcceptance(results);
          console.log(JSON.stringify({ probes: results, acceptance }, null, 2));
          const lines = [
            "## Post-deploy operational acceptance",
            "",
            "- Outcome: " + acceptance.outcome,
            "- " + acceptance.reason,
            "- Scope: read-only GET probes only; no production mutation or automatic rollback.",
            "",
            "| Probe | Surface | Outcome | Evidence |",
            "| --- | --- | --- | --- |",
            ...results.map((result) => "| " + result.id + " | " + result.surface + " | " + result.outcome + " | " + result.detail + " |"),
            "",
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          appendFileSync(process.env.GITHUB_OUTPUT, "outcome=" + acceptance.outcome + "\n");

          if (acceptance.outcome === "failed") process.exitCode = 1;
          NODE
