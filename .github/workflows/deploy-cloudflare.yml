name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.classify.outputs.deploy_required }}
      pages_changed: ${{ steps.classify.outputs.pages_changed }}
      worker_changed: ${{ steps.classify.outputs.worker_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: classify
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.sha }}
        run: node scripts/classify-deploy-changes.mjs >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.deploy_required == 'true' }}
    uses: ./.github/workflows/validate-ci.yml
    with:
      coverage-compare-ref: ${{ github.event.before }}
      pages_changed: ${{ needs.detect-changes.outputs.pages_changed == 'true' }}
      worker_changed: ${{ needs.detect-changes.outputs.worker_changed == 'true' }}

  no-deploy-required:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.deploy_required != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Pages or worker deploy surfaces changed in this push; skipping the production workflow."

  upload-worker-version:
    needs:
      - detect-changes
      - validate
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      previous_version_id: ${{ steps.current-deployment.outputs.previous_version_id }}
      version_id: ${{ steps.upload-version.outputs.version_id }}
      preview_url: ${{ steps.upload-version.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
      - name: Capture current production version
        id: current-deployment
        run: |
          cd worker
          npx --no-install wrangler deployments status --json > /tmp/wrangler-deployment-status.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync("/tmp/wrangler-deployment-status.json", "utf8"));
          const previousVersionId =
            status?.versions?.find((entry) => entry?.percentage === 100)?.version_id ?? "";
          process.stdout.write(`previous_version_id=${previousVersionId}\n`);
          NODE
      - name: Apply D1 migrations
        run: cd worker && npx --no-install wrangler d1 migrations apply stablecoin-db --remote
      - name: Upload candidate worker version
        id: upload-version
        env:
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.jsonl
        run: |
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          cd worker
          npx --no-install wrangler versions upload --message "GitHub Actions candidate ${GITHUB_SHA}"
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const entries = fs
            .readFileSync("/tmp/wrangler-output.jsonl", "utf8")
            .split("\n")
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const uploadEvent = [...entries].reverse().find((entry) => entry.type === "version-upload");
          if (!uploadEvent?.version_id) {
            throw new Error("Missing version-upload event in Wrangler output");
          }
          if (!uploadEvent?.preview_url) {
            throw new Error("Missing preview URL in Wrangler version-upload output");
          }
          process.stdout.write(`version_id=${uploadEvent.version_id}\n`);
          process.stdout.write(`preview_url=${uploadEvent.preview_url}\n`);
          NODE
      - name: Smoke uploaded preview worker
        run: npm run test:smoke-api
        env:
          SMOKE_API_BASE: ${{ steps.upload-version.outputs.preview_url }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_API_REQUIRE_KEY: "true"

  deploy-worker:
    needs:
      - upload-worker-version
      - detect-changes
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' && needs.upload-worker-version.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
      - name: Promote uploaded worker version to production
        env:
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.jsonl
        run: |
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          cd worker
          npx --no-install wrangler versions deploy "${{ needs.upload-worker-version.outputs.version_id }}@100" --message "GitHub Actions deploy ${GITHUB_SHA}" --yes
      - name: Sync worker triggers
        run: cd worker && npx --no-install wrangler triggers deploy

  smoke-api:
    needs:
      - deploy-worker
      - detect-changes
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' && needs.deploy-worker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-api
        env:
          SMOKE_API_BASE: ${{ vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_API_REQUIRE_KEY: "true"

  rollback-worker:
    needs:
      - detect-changes
      - upload-worker-version
      - deploy-worker
      - smoke-api
    if: >-
      ${{
        always()
        && needs.detect-changes.outputs.worker_changed == 'true'
        && needs.deploy-worker.result == 'success'
        && needs.smoke-api.result == 'failure'
        && needs.upload-worker-version.outputs.previous_version_id != ''
      }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
      - name: Roll back production worker to previous stable version
        run: >-
          cd worker
          && npx --no-install wrangler rollback "${{ needs.upload-worker-version.outputs.previous_version_id }}"
          --message "Auto rollback after smoke-api failure for ${GITHUB_SHA}"
          --yes

  pages-prepare:
    needs:
      - detect-changes
      - validate
      - upload-worker-version
    if: >-
      ${{
        always()
        && needs.detect-changes.result == 'success'
        && needs.validate.result == 'success'
        && needs.detect-changes.outputs.pages_changed == 'true'
        && (
          needs.detect-changes.outputs.worker_changed != 'true'
          || needs.upload-worker-version.result == 'success'
        )
      }}
    uses: ./.github/workflows/pages-prepare.yml
    with:
      api_base_url: ${{ needs.detect-changes.outputs.worker_changed == 'true' && needs.upload-worker-version.outputs.preview_url || vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
    secrets: inherit

  pages-publish:
    needs:
      - detect-changes
      - pages-prepare
      - smoke-api
    if: >-
      ${{
        always()
        && needs.detect-changes.result == 'success'
        && needs.detect-changes.outputs.pages_changed == 'true'
        && needs.pages-prepare.result == 'success'
        && (
          needs.detect-changes.outputs.worker_changed != 'true'
          || needs.smoke-api.result == 'success'
        )
      }}
    uses: ./.github/workflows/pages-publish.yml
    secrets: inherit

  smoke-ui-live:
    needs:
      - detect-changes
      - smoke-api
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' && needs.detect-changes.outputs.pages_changed != 'true' && needs.smoke-api.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SMOKE_UI_EXPECT_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-ui -- --url https://pharos.watch --mode live

  smoke-ops:
    needs:
      - detect-changes
      - smoke-api
    if: >-
      ${{
        always()
        && needs.detect-changes.result == 'success'
        && needs.detect-changes.outputs.pages_changed != 'true'
        && needs.detect-changes.outputs.worker_changed == 'true'
        && needs.smoke-api.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-ops
        env:
          SMOKE_OPS_UI_URL: ${{ vars.SMOKE_OPS_UI_URL || 'https://ops.pharos.watch/admin/' }}
          SMOKE_OPS_API_BASE: ${{ vars.SMOKE_OPS_API_BASE || 'https://ops-api.pharos.watch' }}
          OPS_SMOKE_CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_ID }}
          OPS_SMOKE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_SECRET }}

  smoke-transport:
    needs:
      - detect-changes
      - smoke-api
    if: >-
      ${{
        always()
        && needs.detect-changes.result == 'success'
        && needs.detect-changes.outputs.pages_changed != 'true'
        && needs.detect-changes.outputs.worker_changed == 'true'
        && needs.smoke-api.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-transport
