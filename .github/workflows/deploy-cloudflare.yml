name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pages_changed: ${{ steps.classify.outputs.pages_changed }}
      worker_changed: ${{ steps.classify.outputs.worker_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - id: classify
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.sha }}
        run: node scripts/classify-deploy-changes.mjs >> "$GITHUB_OUTPUT"

  validate:
    uses: ./.github/workflows/validate-ci.yml
    with:
      coverage-compare-ref: ${{ github.event.before }}

  deploy-worker:
    needs:
      - detect-changes
      - validate
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply D1 migrations
        run: cd worker && npx --no-install wrangler d1 migrations apply stablecoin-db --remote
      - name: Deploy worker
        run: cd worker && npx --no-install wrangler deploy
      - name: Sync worker triggers
        run: cd worker && npx --no-install wrangler triggers deploy

  smoke-api:
    needs:
      - deploy-worker
      - detect-changes
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' && needs.deploy-worker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:smoke-api
        env:
          SMOKE_API_BASE: ${{ vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}

  pages-release:
    needs:
      - detect-changes
      - validate
      - smoke-api
    if: >-
      ${{
        always()
        && needs.detect-changes.result == 'success'
        && needs.validate.result == 'success'
        && needs.detect-changes.outputs.pages_changed == 'true'
        && (
          needs.detect-changes.outputs.worker_changed != 'true'
          || needs.smoke-api.result == 'success'
        )
      }}
    uses: ./.github/workflows/pages-release.yml
    secrets: inherit

  smoke-ui-live:
    needs:
      - detect-changes
      - smoke-api
    if: ${{ needs.detect-changes.outputs.worker_changed == 'true' && needs.detect-changes.outputs.pages_changed != 'true' && needs.smoke-api.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SMOKE_UI_EXPECT_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - run: npm run test:smoke-ui -- --url https://pharos.watch

  smoke-ops:
    needs:
      - detect-changes
      - pages-release
      - smoke-api
      - smoke-ui-live
    if: >-
      ${{
        always()
        && needs.detect-changes.result == 'success'
        && (
          (
            needs.detect-changes.outputs.pages_changed == 'true'
            && needs.pages-release.result == 'success'
          )
          || (
            needs.detect-changes.outputs.pages_changed != 'true'
            && needs.detect-changes.outputs.worker_changed == 'true'
            && needs.smoke-api.result == 'success'
            && needs.smoke-ui-live.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - run: npm run test:smoke-ops
        env:
          SMOKE_OPS_UI_URL: ${{ vars.SMOKE_OPS_UI_URL || 'https://ops.pharos.watch/admin/' }}
          SMOKE_OPS_API_BASE: ${{ vars.SMOKE_OPS_API_BASE || 'https://ops-api.pharos.watch' }}
          OPS_SMOKE_CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_ID }}
          OPS_SMOKE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_SECRET }}
