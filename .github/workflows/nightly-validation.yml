name: Nightly Validation

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-validation
  cancel-in-progress: true

jobs:
  full-static:
    name: Full lint and typecheck
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-workspace
        id: workspace
        with:
          bootstrap-history: "true"
          static-cache: "true"
      - run: npm run lint
        id: lint
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run typecheck:worker
        id: typecheck-worker
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !cancelled() && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.typecheck-worker.outcome == 'success' }}
        with:
          path: |
            .cache/eslint
            *.tsbuildinfo
            worker/*.tsbuildinfo
          key: ${{ steps.workspace.outputs.static-cache-key }}
      - run: npm run lint:typed
        id: lint-typed
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run typecheck:tests
        id: typecheck-tests
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run check:structural
        id: structural
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run check:unused-code
        id: unused-code
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run check:sensitive-page-copy
        id: sensitive-page-copy
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - name: Report mandatory static outcomes
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          WORKER_OUTCOME: ${{ steps.typecheck-worker.outcome }}
          TYPED_LINT_OUTCOME: ${{ steps.lint-typed.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.typecheck-tests.outcome }}
          STRUCTURAL_OUTCOME: ${{ steps.structural.outcome }}
          UNUSED_CODE_OUTCOME: ${{ steps.unused-code.outcome }}
          SENSITIVE_COPY_OUTCOME: ${{ steps.sensitive-page-copy.outcome }}
        run: |
          failed=()
          for leaf in \
            "lint:$LINT_OUTCOME" \
            "typecheck:$TYPECHECK_OUTCOME" \
            "typecheck:worker:$WORKER_OUTCOME" \
            "lint:typed:$TYPED_LINT_OUTCOME" \
            "typecheck:tests:$TEST_TYPES_OUTCOME" \
            "check:structural:$STRUCTURAL_OUTCOME" \
            "check:unused-code:$UNUSED_CODE_OUTCOME" \
            "check:sensitive-page-copy:$SENSITIVE_COPY_OUTCOME"; do
            outcome="${leaf##*:}"
            command="${leaf%:*}"
            printf '%s: %s\n' "$command" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed+=("$command ($outcome)")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            printf '::error::Mandatory static checks failed: %s\n' "${failed[*]}"
            exit 1
          fi

  full-tests:
    name: Full test suite (${{ matrix.shard }}/2)
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
      - run: npm test -- --shard=${{ matrix.shard }}/2

  v9-resource:
    name: V9 resource budget
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - run: npm run test:v9-resource
      - name: Retain V9 resource results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-score-v9-resource-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/safety-score-v9-resource/
            .tmp/v9-resource-lane/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30


  lighthouse:
    name: Static-export Lighthouse baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
      - name: Build offline artifact and record both Lighthouse routes
        run: node --import tsx --input-type=module -e "import { runPagesArtifactLane } from './scripts/ci/run-pages-artifact-lane.ts'; await runPagesArtifactLane({ acquireReleaseData:false });"
        env:
          # Advisory for two weeks; ratchet from measured p50 before enabling.
          PHAROS_LIGHTHOUSE_THRESHOLD: "70"
          PHAROS_LIGHTHOUSE_ENFORCE: "0"
      - name: Retain Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/lighthouse/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  web-vitals:
    name: Weekly GA4 Web Vitals
    if: ${{ vars.GA4_PROPERTY_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - name: Select weekly window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$(date -u +%u)" == "1" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze last seven complete days
        if: ${{ steps.window.outputs.selected == 'true' }}
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ secrets.GA4_ACCESS_TOKEN }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          if [[ -n "$GA4_SERVICE_ACCOUNT_JSON" ]]; then
            printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/ga4-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga4-service-account.json"
          fi
          npm run analyze:web-vitals -- --days 7 --out .tmp/web-vitals.json
      - name: Remove temporary GA credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/ga4-service-account.json"
      - name: Retain aggregate RUM report
        if: ${{ always() && steps.window.outputs.selected == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-vitals-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/web-vitals.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
