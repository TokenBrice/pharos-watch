name: Nightly Validation

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-validation
  cancel-in-progress: true

jobs:
  full-static:
    name: Full lint and typecheck
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        id: workspace
        with:
          bootstrap-history: "true"
          static-cache: "true"
      - run: npm run lint
      - run: npm run lint:typed
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run typecheck:worker
      - run: npm run check:structural
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/eslint
            *.tsbuildinfo
            worker/*.tsbuildinfo
          key: ${{ steps.workspace.outputs.static-cache-key }}

  full-tests:
    name: Full test suite (${{ matrix.shard }}/2)
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
      - run: npm run test:all -- --shard=${{ matrix.shard }}/2

  node26-proof:
    name: Node 26 advisory typecheck compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
          node-version: "26"
          static-cache: "true"
      - run: npm run typecheck
      - run: npm run typecheck:worker
