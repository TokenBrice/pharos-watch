name: Nightly Validation

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-validation
  cancel-in-progress: true

jobs:
  full-static:
    name: Full lint and typecheck
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-workspace
        id: workspace
        with:
          bootstrap-history: "true"
          static-cache: "true"
      - run: npm run lint
        id: lint
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run typecheck:worker
        id: typecheck-worker
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !cancelled() && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.typecheck-worker.outcome == 'success' }}
        with:
          path: |
            .cache/eslint
            *.tsbuildinfo
            worker/*.tsbuildinfo
          key: ${{ steps.workspace.outputs.static-cache-key }}
      - run: npm run lint:typed
        id: lint-typed
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run typecheck:tests
        id: typecheck-tests
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - run: npm run check:structural
        id: structural
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
      - name: Report mandatory static outcomes
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          WORKER_OUTCOME: ${{ steps.typecheck-worker.outcome }}
          TYPED_LINT_OUTCOME: ${{ steps.lint-typed.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.typecheck-tests.outcome }}
          STRUCTURAL_OUTCOME: ${{ steps.structural.outcome }}
        run: |
          failed=()
          for leaf in \
            "lint:$LINT_OUTCOME" \
            "typecheck:$TYPECHECK_OUTCOME" \
            "typecheck:worker:$WORKER_OUTCOME" \
            "lint:typed:$TYPED_LINT_OUTCOME" \
            "typecheck:tests:$TEST_TYPES_OUTCOME" \
            "check:structural:$STRUCTURAL_OUTCOME"; do
            outcome="${leaf##*:}"
            command="${leaf%:*}"
            printf '%s: %s\n' "$command" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed+=("$command ($outcome)")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            printf '::error::Mandatory static checks failed: %s\n' "${failed[*]}"
            exit 1
          fi

  full-tests:
    name: Full test suite (${{ matrix.shard }}/2)
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
      - run: npm run test:all -- --shard=${{ matrix.shard }}/2

  node26-proof:
    name: Node 26 advisory typecheck compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
          node-version: "26"
          static-cache: "true"
      - run: npm run typecheck
      - run: npm run typecheck:worker

  report-failures:
    name: Report main workflow incidents
    needs: [full-static, full-tests]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: workflow-incidents-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/report-workflow-failure
        with:
          workflow-file: nightly-validation.yml
          needs-json: ${{ toJSON(needs) }}
          job-names-json: '{"full-static":"Full lint and typecheck","full-tests":"Full test suite"}'
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-operator-chat-id: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
