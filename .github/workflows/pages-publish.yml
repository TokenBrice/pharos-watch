name: Pages Publish

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the static export to publish.
        required: false
        default: pages-static-export
        type: string

permissions:
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    outputs:
      previous_deployment_id: ${{ steps.capture.outputs.deployment_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
      - id: capture
        name: Capture current production Pages deployment id (best effort)
        continue-on-error: true
        run: |
          cd worker
          npx --no-install wrangler pages deployment list --project-name=stablecoin-dashboard --environment=production --json > /tmp/wrangler-pages-deployments.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const entries = JSON.parse(fs.readFileSync("/tmp/wrangler-pages-deployments.json", "utf8"));
          const current = Array.isArray(entries) && entries.length > 0 ? entries[0] : null;
          const rawId = current?.Id ?? current?.id ?? current?.deployment_id ?? "";
          const id = typeof rawId === "string" ? rawId : "";
          if (!id && current) {
            console.warn("[capture] wrangler entry lacked a recognized deployment id field; keys:", Object.keys(current).join(","));
          }
          process.stdout.write(`deployment_id=${id}\n`);
          NODE
      - if: ${{ steps.capture.outcome == 'failure' || steps.capture.outputs.deployment_id == '' }}
        name: Warn that automated rollback is disabled for this deploy
        run: |
          {
            echo "## ⚠️ Automated Pages rollback DISABLED for this deploy"
            echo ""
            echo "The \`capture\` step could not record the previous production Pages deployment id."
            echo "If post-deploy smoke fails, roll back manually via the Cloudflare Pages dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: out
      - name: Deploy Pages with retry
        run: |
          for attempt in 1 2 3; do
            echo "[deploy-pages] Attempt ${attempt}/3"
            if npx --no-install wrangler pages deploy out --project-name=stablecoin-dashboard --commit-dirty=true --commit-message="${{ github.sha }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "[deploy-pages] Exhausted retries"
              exit 1
            fi
            sleep $((attempt * 15))
          done

  smoke-ui-live:
    needs: deploy-pages
    runs-on: ubuntu-latest
    env:
      SMOKE_UI_EXPECT_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-ui -- --url https://pharos.watch --mode live

  smoke-ops:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-ops
        env:
          SMOKE_OPS_UI_URL: ${{ vars.SMOKE_OPS_UI_URL || 'https://ops.pharos.watch/admin/' }}
          SMOKE_OPS_API_BASE: ${{ vars.SMOKE_OPS_API_BASE || 'https://ops-api.pharos.watch' }}
          OPS_SMOKE_CF_ACCESS_CLIENT_ID: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_ID }}
          OPS_SMOKE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPS_SMOKE_CF_ACCESS_CLIENT_SECRET }}

  smoke-transport:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - run: npm run test:smoke-transport

  rollback-pages:
    needs:
      - deploy-pages
      - smoke-ui-live
    if: >-
      ${{
        always()
        && needs.deploy-pages.result == 'success'
        && needs.smoke-ui-live.result == 'failure'
        && needs.deploy-pages.outputs.previous_deployment_id != ''
      }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: stablecoin-dashboard
      CF_PAGES_DEPLOYMENT_ID: ${{ needs.deploy-pages.outputs.previous_deployment_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 25
          cache-npm: "false"
          install-deps: "false"
      - name: Roll back Pages production to previous successful deployment
        run: node scripts/rollback-pages-deployment.mjs
