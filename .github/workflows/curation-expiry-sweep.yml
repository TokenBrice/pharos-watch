name: Curation Expiry Sweep

# Weekly Safety Score V9 curation sweep: freeze the current production compiler
# input, replay it at HEAD, and publish the curation worklist, curated reserve
# expiry queue, and typed missing-data registry. Read-only against production
# (one D1 cache-row read); no product data is changed.
# Runbook: docs/process/safety-score-curation-expiry-sweep.md

on:
  schedule:
    - cron: "45 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Export and normalize the production compiler input
        id: capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agents/sweep
          (cd worker && npx --no-install wrangler d1 execute stablecoin-db --remote --json \
            --command "SELECT value FROM cache WHERE key = 'report-cards:fixed-input:exact'") \
            > agents/sweep/capture.raw.json
          npm run report-cards:capture-fixed-input -- \
            --exact-cache-export agents/sweep/capture.raw.json \
            --output agents/sweep/capture.json --normalized-only
          echo "clock_sec=$(jq -r .clockSec agents/sweep/capture.json)" >> "$GITHUB_OUTPUT"
      - name: Replay and generate the curation queues and missing-data registry
        id: generate
        env:
          CLOCK_SEC: ${{ steps.capture.outputs.clock_sec }}
        shell: bash
        run: |
          set +e
          # --allow-registry-mismatch: HEAD curation legitimately postdates the
          # captured registry fingerprint; the sweep reads worklist items, not
          # score equivalence.
          npm run safety-score-v9:replay -- \
            --input agents/sweep/capture.json \
            --output agents/sweep/replay.json \
            --published-at "$CLOCK_SEC" \
            --allow-registry-mismatch 2>&1 | tee agents/sweep/replay-command.log
          replay_status=${PIPESTATUS[0]}
          node scripts/maintenance/generate-safety-score-v9-curation-worklist.mjs \
            --replay agents/sweep/replay.json \
            --output agents/sweep/worklist.md 2>&1 | tee agents/sweep/worklist-command.log
          worklist_status=${PIPESTATUS[0]}
          npm run safety-score-v9:expiry-queue -- \
            --replay agents/sweep/replay.json \
            --output agents/sweep/expiry-queue.md 2>&1 | tee agents/sweep/queue-command.log
          queue_status=${PIPESTATUS[0]}
          npm run safety-score-v9:live-withheld -- \
            --replay agents/sweep/replay.json \
            --output agents/sweep/live-withheld.md 2>&1 | tee agents/sweep/live-withheld-command.log
          live_withheld_status=${PIPESTATUS[0]}
          npm run safety-score-v9:missing-data-registry -- \
            --replay agents/sweep/replay.json \
            --policy shared/data/safety-score-v9/methodology-policy-candidate-v1.json \
            --output agents/sweep/missing-data-registry.json 2>&1 | tee agents/sweep/missing-data-registry-command.log
          registry_status=${PIPESTATUS[0]}
          if [ "$registry_status" = 0 ]; then
            jq '{
              schemaVersion: 1,
              generatedFrom: {
                asOfSec: .snapshot.asOfSec,
                asOfIso: .snapshot.asOfIso,
                factSetDigest: .snapshot.factSetDigest,
                queueDigest: .snapshot.queueDigest,
                policyId: .snapshot.policyId,
                policyDigest: .snapshot.policyDigest
              },
              summary: {
                stablecoinCount: .summary.stablecoinCount,
                affectedStablecoinCount: .summary.affectedStablecoinCount,
                openItemCount: .summary.openItemCount,
                compiledFactItemCount: .summary.compiledFactItemCount,
                supplementalScoreItemCount: .summary.supplementalScoreItemCount,
                claimGroupCount: .summary.claimGroupCount,
                responsibilityCounts: .summary.responsibilityCounts,
                workTypeCounts: .summary.workTypeCounts,
                resolutionModeCounts: .summary.resolutionModeCounts,
                taskSourceCounts: .summary.taskSourceCounts
              }
            }' agents/sweep/missing-data-registry.json \
              > .github/workflows/artifacts/safety-score-missing-data-registry-summary.json
          fi
          echo "replay_status=$replay_status" >> "$GITHUB_OUTPUT"
          echo "worklist_status=$worklist_status" >> "$GITHUB_OUTPUT"
          echo "queue_status=$queue_status" >> "$GITHUB_OUTPUT"
          echo "live_withheld_status=$live_withheld_status" >> "$GITHUB_OUTPUT"
          echo "registry_status=$registry_status" >> "$GITHUB_OUTPUT"
      - name: Upload the full missing-data registry
        if: steps.generate.outputs.registry_status == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-score-v9-missing-data-registry-${{ github.run_id }}
          path: agents/sweep/missing-data-registry.json
          if-no-files-found: error
          retention-days: 30
      - name: Open or update the sweep issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_STATUS: ${{ steps.generate.outputs.replay_status }}
          WORKLIST_STATUS: ${{ steps.generate.outputs.worklist_status }}
          QUEUE_STATUS: ${{ steps.generate.outputs.queue_status }}
          LIVE_WITHHELD_STATUS: ${{ steps.generate.outputs.live_withheld_status }}
          REGISTRY_STATUS: ${{ steps.generate.outputs.registry_status }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          {
            echo "<!-- curation-expiry-sweep -->"
            echo "# Safety Score curation expiry sweep"
            echo
            echo "Generated from commit \`${GITHUB_SHA}\` on $(date -u +%F). Read-only review queues; no product data was changed. Drain per docs/process/safety-score-curation-expiry-sweep.md."
            echo
            echo "Command status: replay=${REPLAY_STATUS}, worklist=${WORKLIST_STATUS}, expiry queue=${QUEUE_STATUS}, live-withheld=${LIVE_WITHHELD_STATUS}, missing-data registry=${REGISTRY_STATUS}."
            echo
            echo "## Missing-data registry"
            if [ -f agents/sweep/missing-data-registry.json ]; then
              jq -r '"- Open task rows: **\(.summary.openItemCount)**\n- Claim groups: **\(.summary.claimGroupCount)**\n- Compiled-fact tasks: **\(.summary.compiledFactItemCount)**\n- Score-projection supplements: **\(.summary.supplementalScoreItemCount)**\n- Affected stablecoins: **\(.summary.affectedStablecoinCount)**"' agents/sweep/missing-data-registry.json
              echo
              echo "These are routing counts, not mechanically closable facts. Download the full workflow artifact and drain by typed workType/claimGroupId."
            else
              echo "Registry unavailable."
            fi
            echo
            echo "## Live-withheld counterfactual grade-drop report"
            echo '```text'
            if [ -f agents/sweep/live-withheld.md ]; then
              awk 'NR <= 160 {print} NR == 161 {print "... output truncated after 160 lines ..."}' agents/sweep/live-withheld.md
            else
              echo "Live-withheld report unavailable."
            fi
            echo '```'
            echo
            echo "## Curated reserve expiry queue"
            echo '```text'
            if [ -f agents/sweep/expiry-queue.md ]; then
              awk 'NR <= 160 {print} NR == 161 {print "... output truncated after 160 lines ..."}' agents/sweep/expiry-queue.md
            else
              echo "Queue unavailable."
            fi
            echo '```'
            echo
            echo "## Dependency and backing worklist streams"
            echo '```text'
            if [ -f agents/sweep/worklist.md ]; then
              awk '
                /^## / {keep = ($0 ~ /Dependencies|Backing/)}
                keep {
                  if (shown < 200) { print; shown++ }
                  else if (!truncated) { print "... output truncated after 200 lines ..."; truncated = 1 }
                }
              ' agents/sweep/worklist.md
            else
              echo "Worklist unavailable."
            fi
            echo '```'
            echo
            if [ "$REPLAY_STATUS" != 0 ] || [ "$WORKLIST_STATUS" != 0 ] || [ "$QUEUE_STATUS" != 0 ] || [ "$LIVE_WITHHELD_STATUS" != 0 ] || [ "$REGISTRY_STATUS" != 0 ]; then
              echo "## Generation failures"
              for spec in \
                "replay:$REPLAY_STATUS:agents/sweep/replay-command.log" \
                "worklist:$WORKLIST_STATUS:agents/sweep/worklist-command.log" \
                "expiry queue:$QUEUE_STATUS:agents/sweep/queue-command.log" \
                "live-withheld:$LIVE_WITHHELD_STATUS:agents/sweep/live-withheld-command.log" \
                "missing-data registry:$REGISTRY_STATUS:agents/sweep/missing-data-registry-command.log"; do
                IFS=: read -r label status log_file <<< "$spec"
                if [ "$status" != 0 ]; then
                  echo "### $label (status $status)"
                  echo '```text'
                  tail -30 "$log_file"
                  echo "... log truncated to the last 30 lines ..."
                  echo '```'
                fi
              done
              echo
            fi
          } > "$body"

          issue_number=$(gh issue list --state open --search 'in:title "Safety Score curation expiry sweep"' --json number,title --jq '.[] | select(.title == "Safety Score curation expiry sweep") | .number' | head -1)
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "$body"
          else
            gh issue create --title "Safety Score curation expiry sweep" --body-file "$body"
          fi

          # Fail the run, not just the issue body, when any generator broke —
          # same rationale as agent-maintenance-candidates: a green run must
          # mean the queues are trustworthy.
          if [ "$REPLAY_STATUS" != 0 ] || [ "$WORKLIST_STATUS" != 0 ] || [ "$QUEUE_STATUS" != 0 ] || [ "$LIVE_WITHHELD_STATUS" != 0 ] || [ "$REGISTRY_STATUS" != 0 ]; then
            echo "::error title=Curation sweep incomplete::See the sweep issue for command status and available output."
            exit 1
          fi
      - name: Detect missing-data registry summary drift
        id: registry_diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/artifacts/safety-score-missing-data-registry-summary.json; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- .github/workflows/artifacts/safety-score-missing-data-registry-summary.json
          fi
      - name: Open or update missing-data registry snapshot PR
        if: steps.registry_diff.outputs.has_diff == 'true'
        env:
          AUTOMATION_GITHUB_TOKEN: ${{ secrets.SHOCK_COVERAGE_GITHUB_TOKEN || secrets.OG_REFRESH_GITHUB_TOKEN }}
          PR_BODY: |
            Weekly pinned-input snapshot of the existing Safety Score V9 missing-data registry.

            The full registry is attached to the source curation-sweep workflow run. This compact committed artifact makes task, claim-group, work-type, responsibility, and resolution-mode drift reviewable without committing the multi-megabyte registry.

            These are routing counts, not mechanically closable facts. This refresh closes zero facts by itself. Drain procedure: `docs/process/safety-score-curation-expiry-sweep.md`.
        run: |
          node --import tsx scripts/ci/open-automated-refresh-pr.ts \
            --branch automated/safety-score-missing-data-registry \
            --path .github/workflows/artifacts/safety-score-missing-data-registry-summary.json \
            --title "chore(v9): refresh missing-data registry snapshot" \
            --body "$PR_BODY"
