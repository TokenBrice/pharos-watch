name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      critical_coverage_changed: ${{ steps.classify.outputs.critical_coverage_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      playwright_firefox_required: ${{ steps.classify.outputs.playwright_firefox_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
      - name: Run manifest preflight
        id: classify
        env:
          DEPLOY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPLOY_EVENT_NAME: push
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --preflight
      - name: Generate validation matrix from the lane manifest
        id: matrix
        env:
          CRITICAL_COVERAGE_CHANGED: ${{ steps.classify.outputs.critical_coverage_changed }}
          DOCS_CHANGED: ${{ steps.classify.outputs.docs_changed }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "matrix=$(node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --matrix)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: preflight
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
          workspace-cache: "true"

  validation:
    name: ${{ matrix.lane }}${{ matrix.shard && format(' ({0}/{1})', matrix.shard, matrix.shardCount) || '' }}
    needs: [preflight, prepare]
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-workspace
        with:
          browser-cache: ${{ matrix.lane == 'static' && needs.preflight.outputs.playwright_firefox_required || 'false' }}
          install-deps: "false"
          install-playwright-firefox: ${{ matrix.lane == 'static' && needs.preflight.outputs.playwright_firefox_required || 'false' }}
          static-cache: ${{ matrix.lane == 'static' && 'true' || 'false' }}
          workspace-cache: "true"
      - name: Run manifest lane
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LANE_ID: ${{ matrix.lane }}
          PR_SKIP_DOC_SYNC: ${{ matrix.skipDocSync }}
          PR_LANE_SHARD: ${{ matrix.shard }}
          PR_LANE_SHARD_COUNT: ${{ matrix.shardCount }}
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run
      - name: Upload critical coverage blob
        if: ${{ always() && matrix.lane == 'critical-coverage-shards' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-coverage-${{ matrix.shard }}
          path: .vitest-reports/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  critical-coverage:
    name: Touched critical coverage
    needs: [preflight, prepare, validation]
    if: ${{ needs.preflight.outputs.critical_coverage_changed == 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap-generated: "false"
          install-deps: "false"
          workspace-cache: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: critical-coverage-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge and enforce touched critical-file coverage ratchet
        env:
          CRITICAL_COVERAGE_COMPARE_REF: ${{ github.event.pull_request.base.sha }}
          PR_LANE_ID: critical-coverage
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run

  pr-gate:
    name: PR gate
    if: ${{ always() }}
    needs: [preflight, prepare, validation, critical-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      VALIDATION_RESULT: ${{ needs.validation.result }}
      CRITICAL_COVERAGE_CHANGED: ${{ needs.preflight.outputs.critical_coverage_changed }}
      CRITICAL_COVERAGE_RESULT: ${{ needs.critical-coverage.result }}
    steps:
      - name: Require the manifest-selected validation path
        run: |
          if [ "${PREFLIGHT_RESULT}" != "success" ] || [ "${PREPARE_RESULT}" != "success" ] || [ "${VALIDATION_RESULT}" != "success" ]; then
            echo "Required PR validation failed: preflight=${PREFLIGHT_RESULT}, prepare=${PREPARE_RESULT}, validation=${VALIDATION_RESULT}."
            exit 1
          fi

          if [ "${CRITICAL_COVERAGE_CHANGED}" = "true" ] && [ "${CRITICAL_COVERAGE_RESULT}" != "success" ]; then
            echo "Touched critical coverage failed: ${CRITICAL_COVERAGE_RESULT}."
            exit 1
          fi
