name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      critical_coverage_changed: ${{ steps.classify.outputs.critical_coverage_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - id: classify
        env:
          DEPLOY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPLOY_EVENT_NAME: push
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/ci/classify-deploy-changes.ts >> "$GITHUB_OUTPUT"

  static:
    name: Adaptive static checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
          tooling-cache-save: "true"
          install-playwright-firefox: "true"
      - name: Run surface-aware static checks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:pr:static

  tests:
    name: Critical and changed tests (${{ matrix.shard }}/2)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Run critical contracts and tests affected by the PR
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:pr -- --shard=${{ matrix.shard }}/2

  critical-coverage:
    name: Touched critical coverage
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.critical_coverage_changed == 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-cache: "true"
      - name: Enforce touched critical-file coverage ratchet
        env:
          CRITICAL_COVERAGE_COMPARE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:critical

  docs:
    name: Documentation checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only == 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: npm run check:verified-doc-links
      - run: npm run check:doc-source-paths
      - run: npm run check:doc-sync
      - run: npm run check:generated-artifacts -- --only=agents-doc

  gitleaks:
    name: Gitleaks PR scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # The gitleaks version + tarball SHA-256 pin lives only in
      # scripts/ci/run-gitleaks.ts, which downloads and checksum-verifies the
      # pinned binary before scanning. Blocking gate (see the pr-gate job).
      - name: Scan PR commit range for secrets
        env:
          GITLEAKS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/ci/run-gitleaks.ts --range

  pr-gate:
    name: PR gate
    if: ${{ always() }}
    needs: [detect-changes, static, tests, critical-coverage, docs, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DETECT_RESULT: ${{ needs.detect-changes.result }}
      CRITICAL_COVERAGE_CHANGED: ${{ needs.detect-changes.outputs.critical_coverage_changed }}
      CRITICAL_COVERAGE_RESULT: ${{ needs.critical-coverage.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
      STATIC_RESULT: ${{ needs.static.result }}
      TEST_RESULT: ${{ needs.tests.result }}
    steps:
      - name: Require the selected validation path and secret scan
        run: |
          if [ "${DETECT_RESULT}" != "success" ] || [ "${GITLEAKS_RESULT}" != "success" ]; then
            echo "Required PR setup failed: detect=${DETECT_RESULT}, gitleaks=${GITLEAKS_RESULT}."
            exit 1
          fi

          if [ "${CRITICAL_COVERAGE_CHANGED}" = "true" ] && [ "${CRITICAL_COVERAGE_RESULT}" != "success" ]; then
            echo "Touched critical coverage failed: ${CRITICAL_COVERAGE_RESULT}."
            exit 1
          fi

          if { [ "${STATIC_RESULT}" = "success" ] && [ "${TEST_RESULT}" = "success" ] && [ "${DOCS_RESULT}" = "skipped" ]; } \
            || { [ "${STATIC_RESULT}" = "skipped" ] && [ "${TEST_RESULT}" = "skipped" ] && [ "${DOCS_RESULT}" = "success" ]; }; then
            exit 0
          fi

          echo "Selected PR validation failed: static=${STATIC_RESULT}, tests=${TEST_RESULT}, docs=${DOCS_RESULT}."
          exit 1
