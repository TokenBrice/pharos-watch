name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
      - name: Snapshot the trusted base scanner and policy
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/run-gitleaks.ts --snapshot-trusted="$RUNNER_TEMP/trusted-gitleaks"
      - name: Scan PR commits with the trusted base scanner and policy
        env:
          GITLEAKS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "${GITLEAKS_HEAD_REF}"
          node "$RUNNER_TEMP/trusted-gitleaks/scripts/ci/run-gitleaks.ts" --range --policy-root="$RUNNER_TEMP/trusted-gitleaks"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan the PR merge-resolution lines with the trusted scanner and policy
        env:
          GITLEAKS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node "$RUNNER_TEMP/trusted-gitleaks/scripts/ci/run-gitleaks.ts" --tree --policy-root="$RUNNER_TEMP/trusted-gitleaks"
      - name: Check changed candidate scanner and policy
        env:
          GITLEAKS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci/run-gitleaks.ts --range --candidate-policy --trusted-root="$RUNNER_TEMP/trusted-gitleaks"

  prepare:
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      critical_coverage_changed: ${{ steps.classify.outputs.critical_coverage_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_inline_succeeded: ${{ steps.docs.outcome == 'success' }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      coverage_matrix: ${{ steps.matrix.outputs.coverage_matrix }}
      playwright_firefox_required: ${{ steps.classify.outputs.playwright_firefox_required }}
      pages_artifact_required: ${{ steps.classify.outputs.pages_artifact_required }}
      workspace_artifact_name: ${{ steps.publish-workspace.outputs.workspace-artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-history: "true"
          install-ripgrep: "true"
          workspace-artifact: none
      - name: Classify PR changes
        id: classify
        env:
          DEPLOY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPLOY_EVENT_NAME: push
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --classify
      - name: Plan PR tests once
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:pr -- --base=$PR_BASE_SHA --plan-out=.tmp/pr-test-plan.json
      - name: Generate validation and coverage matrices
        id: matrix
        env:
          CRITICAL_COVERAGE_CHANGED: ${{ steps.classify.outputs.critical_coverage_changed }}
          DOCS_CHANGED: ${{ steps.classify.outputs.docs_changed }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          PAGES_ARTIFACT_REQUIRED: ${{ steps.classify.outputs.pages_artifact_required }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --matrix
      - name: Run docs-only validation inline
        id: docs
        if: ${{ steps.classify.outputs.docs_only == 'true' }}
        env:
          PR_LANE_ID: docs
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run
      - uses: $/.github/actions/setup-workspace
        id: publish-workspace
        with:
          install-deps: "false"
          cache-npm: "false"
          workspace-artifact: publish

  validation:
    name: ${{ matrix.lane }}${{ matrix.shard && format(' ({0}/{1})', matrix.shard, matrix.shardCount) || '' }}
    needs: prepare
    if: ${{ needs.prepare.outputs.docs_only != 'true' && fromJSON(needs.prepare.outputs.matrix).include[0] != null }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup-workspace
        with:
          browser-cache: ${{ matrix.lane == 'static-guards' && needs.prepare.outputs.playwright_firefox_required || 'false' }}
          cache-npm: "false"
          install-deps: "false"
          install-playwright-firefox: ${{ matrix.lane == 'static-guards' && needs.prepare.outputs.playwright_firefox_required || 'false' }}
          install-ripgrep: ${{ (matrix.lane == 'static-guards' || matrix.lane == 'docs') && 'true' || 'false' }}
          static-cache: ${{ matrix.lane == 'static-compile' && 'true' || 'false' }}
          workspace-artifact: restore
          workspace-artifact-name: ${{ needs.prepare.outputs.workspace_artifact_name }}
      - name: Run manifest lane
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LANE_ID: ${{ matrix.lane }}
          PR_SKIP_DOC_SYNC: ${{ matrix.skipDocSync }}
          PR_LANE_SHARD: ${{ matrix.shard }}
          PR_LANE_SHARD_COUNT: ${{ matrix.shardCount }}
          PR_TEST_PLAN_FILE: ${{ matrix.lane == 'tests' && '.tmp/pr-test-plan.json' || '' }}
          # Observability only: the tests lane writes its Vitest wall time and
          # per-file durations for shard-balance review. Never gates the lane.
          PR_SHARD_TIMINGS_FILE: ${{ matrix.lane == 'tests' && format('.tmp/pr-test-timings-{0}.json', matrix.shard) || '' }}
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run
      - name: Upload PR test shard timings
        if: ${{ always() && matrix.lane == 'tests' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-test-timings-${{ matrix.shard }}
          overwrite: true
          path: .tmp/pr-test-timings-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  # Peak fan-out: validation 10 + coverage 8 + Pages 1 + secrets 1 = 20.
  pages-artifact:
    name: Pages artifact
    needs: prepare
    if: ${{ needs.prepare.outputs.pages_artifact_required == 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORCE_SITE_DATA_PROXY: "true"
      NEXT_PUBLIC_PHAROS_HERO_VERDICT: ${{ vars.NEXT_PUBLIC_PHAROS_HERO_VERDICT }}
      NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS: ${{ vars.NEXT_PUBLIC_PHAROS_QUIET_DEVIATIONS }}
      NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY: ${{ vars.NEXT_PUBLIC_PHAROS_MOBILE_STICKY_SUMMARY }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER }}
      NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER: ${{ vars.NEXT_PUBLIC_PHAROS_DEPEG_RESOLVER_REVIEWER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup-workspace
        with:
          cache-npm: "false"
          install-deps: "false"
          workspace-artifact: restore
          workspace-artifact-name: ${{ needs.prepare.outputs.workspace_artifact_name }}
      - name: Replay release data and enforce Pages artifact gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LANE_ID: pages-artifact
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run

  critical-coverage-shards:
    name: Critical coverage (${{ matrix.shard }}/${{ matrix.shardCount }})
    needs: prepare
    if: ${{ needs.prepare.outputs.critical_coverage_changed == 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.coverage_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup-workspace
        with:
          cache-npm: "false"
          install-deps: "false"
          workspace-artifact: restore
          workspace-artifact-name: ${{ needs.prepare.outputs.workspace_artifact_name }}
      - name: Run manifest coverage shard
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LANE_ID: critical-coverage-shards
          PR_LANE_SHARD: ${{ matrix.shard }}
          PR_LANE_SHARD_COUNT: ${{ matrix.shardCount }}
          PR_SHARD_TIMINGS_FILE: .tmp/pr-coverage-timings-${{ matrix.shard }}.json
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run
      - name: Upload critical coverage blob
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-coverage-${{ matrix.shard }}
          overwrite: true
          path: .vitest-reports/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload critical coverage shard timings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-coverage-timings-${{ matrix.shard }}
          overwrite: true
          path: .tmp/pr-coverage-timings-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  critical-coverage:
    name: Touched critical coverage
    needs: [prepare, critical-coverage-shards]
    if: ${{ needs.prepare.outputs.critical_coverage_changed == 'true' }}
    runs-on: ${{ vars.CI_VALIDATE_RUNNER != '' && vars.CI_VALIDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup-workspace
        with:
          bootstrap-generated: "false"
          cache-npm: "false"
          install-deps: "false"
          workspace-artifact: restore
          workspace-artifact-name: ${{ needs.prepare.outputs.workspace_artifact_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: critical-coverage-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge and enforce touched critical-file coverage ratchet
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CRITICAL_COVERAGE_COMPARE_REF: ${{ github.event.pull_request.base.sha }}
          PR_LANE_ID: critical-coverage
        run: node --experimental-strip-types scripts/maintenance/generate-pr-workflow-matrix.ts --run

  pr-gate:
    name: PR gate
    if: ${{ always() }}
    needs: [secrets, prepare, validation, critical-coverage-shards, critical-coverage, pages-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRETS_RESULT: ${{ needs.secrets.result }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      DOCS_ONLY: ${{ needs.prepare.outputs.docs_only }}
      DOCS_INLINE_SUCCEEDED: ${{ needs.prepare.outputs.docs_inline_succeeded }}
      VALIDATION_RESULT: ${{ needs.validation.result }}
      CRITICAL_COVERAGE_CHANGED: ${{ needs.prepare.outputs.critical_coverage_changed }}
      CRITICAL_COVERAGE_SHARDS_RESULT: ${{ needs.critical-coverage-shards.result }}
      CRITICAL_COVERAGE_RESULT: ${{ needs.critical-coverage.result }}
      PAGES_ARTIFACT_REQUIRED: ${{ needs.prepare.outputs.pages_artifact_required }}
      PAGES_ARTIFACT_RESULT: ${{ needs.pages-artifact.result }}
    steps:
      - name: Require the manifest-selected validation path
        run: |
          if [ "${SECRETS_RESULT}" != "success" ] || [ "${PREPARE_RESULT}" != "success" ]; then
            echo "Required PR jobs failed: secrets=${SECRETS_RESULT}, prepare=${PREPARE_RESULT}."
            exit 1
          fi

          if [ "${DOCS_ONLY}" = "true" ]; then
            if [ "${VALIDATION_RESULT}" != "skipped" ] || [ "${DOCS_INLINE_SUCCEEDED}" != "true" ]; then
              echo "Docs-only validation failed: validation=${VALIDATION_RESULT}, inline=${DOCS_INLINE_SUCCEEDED}."
              exit 1
            fi
          elif [ "${VALIDATION_RESULT}" != "success" ]; then
            echo "Required PR validation failed: ${VALIDATION_RESULT}."
            exit 1
          fi

          if [ "${CRITICAL_COVERAGE_CHANGED}" = "true" ]; then
            if [ "${CRITICAL_COVERAGE_SHARDS_RESULT}" != "success" ] || [ "${CRITICAL_COVERAGE_RESULT}" != "success" ]; then
              echo "Touched critical coverage failed: shards=${CRITICAL_COVERAGE_SHARDS_RESULT}, merge=${CRITICAL_COVERAGE_RESULT}."
              exit 1
            fi
          elif [ "${CRITICAL_COVERAGE_CHANGED}" != "false" ] || [ "${CRITICAL_COVERAGE_SHARDS_RESULT}" != "skipped" ] || [ "${CRITICAL_COVERAGE_RESULT}" != "skipped" ]; then
            echo "Unexpected unselected coverage state: selected=${CRITICAL_COVERAGE_CHANGED}, shards=${CRITICAL_COVERAGE_SHARDS_RESULT}, merge=${CRITICAL_COVERAGE_RESULT}."
            exit 1
          fi

          if [ "${PAGES_ARTIFACT_REQUIRED}" = "true" ]; then
            if [ "${PAGES_ARTIFACT_RESULT}" != "success" ]; then
              echo "Pages artifact validation failed: ${PAGES_ARTIFACT_RESULT}."
              exit 1
            fi
          elif [ "${PAGES_ARTIFACT_REQUIRED}" != "false" ] || [ "${PAGES_ARTIFACT_RESULT}" != "skipped" ]; then
            echo "Unexpected unselected Pages artifact state: selected=${PAGES_ARTIFACT_REQUIRED}, result=${PAGES_ARTIFACT_RESULT}."
            exit 1
          fi
