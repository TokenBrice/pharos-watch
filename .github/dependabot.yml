version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/worker"
    # Worker types float freely now that the root carries no copy.
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      # Dependabot treats each `uses:` path as its own dependency, so a
      # multi-step action such as github/codeql-action/{init,analyze}
      # would otherwise bump one path per PR. Against the limit of 1 that
      # leaves the halves on different versions, which CodeQL rejects at
      # run time. One grouped PR keeps every pinned action in step.
      actions:
        patterns:
          - "*"
