version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Satori >=0.33 breaks the workerd loader; 0.60 also removes yoga.wasm.
      # Reopen upgrades after the production OG runtime test passes.
      - dependency-name: "satori"
        versions:
          - ">= 0.33.0, <= 0.60.0"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/worker"
    # Worker types float freely now that the root carries no copy.
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # See the root entry: newer Satori needs a reviewed Worker migration.
      - dependency-name: "satori"
        versions:
          - ">= 0.33.0, <= 0.60.0"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      # actions/cache is also pinned inside .github/actions/setup-workspace
      # (restore + cache), which Dependabot does not scan, so a workflow-only
      # major bump of cache/save would split the restore/save pair across
      # majors. Bump all three together by hand.
      - dependency-name: "actions/cache"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "actions/cache/save"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "actions/cache/restore"
        update-types:
          - "version-update:semver-major"
    groups:
      # Dependabot treats each `uses:` path as its own dependency, so a
      # multi-step action such as github/codeql-action/{init,analyze}
      # would otherwise bump one path per PR. Against the limit of 1 that
      # leaves the halves on different versions, which CodeQL rejects at
      # run time. One grouped PR keeps every pinned action in step.
      actions:
        patterns:
          - "*"
