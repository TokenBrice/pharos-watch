version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # satori 0.33.x hard-imports harfbuzzjs, whose emscripten loader reads
      # self.location / __filename to fetch hb.wasm; both are undefined in
      # workerd, so the first OG render throws (vercel/satori#796). Drop this
      # once a release ships a workerd-compatible loader.
      - dependency-name: "satori"
        versions:
          - ">= 0.33.0, < 0.34.0"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/worker"
    # Worker types float freely now that the root carries no copy.
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # See the root entry: satori 0.33.x cannot load harfbuzzjs in workerd.
      - dependency-name: "satori"
        versions:
          - ">= 0.33.0, < 0.34.0"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      # Dependabot treats each `uses:` path as its own dependency, so a
      # multi-step action such as github/codeql-action/{init,analyze}
      # would otherwise bump one path per PR. Against the limit of 1 that
      # leaves the halves on different versions, which CodeQL rejects at
      # run time. One grouped PR keeps every pinned action in step.
      actions:
        patterns:
          - "*"
