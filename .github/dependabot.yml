version: 2
updates:
  - package-ecosystem: "npm"
    # The root lockfile owns every npm workspace, including worker/.
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - "version-update:semver-major"
      # Satori >=0.34 needs a reviewed Worker renderer upgrade (HarfBuzz
      # alias, yoga.wasm export). Reopen after the production OG runtime test passes.
      - dependency-name: "satori"
        versions:
          - ">= 0.34.0"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      # actions/cache is also pinned inside .github/actions/setup-workspace
      # (restore + cache), which Dependabot does not scan, so a workflow-only
      # major bump of cache/save would split the restore/save pair across
      # majors. Bump all three together by hand.
      - dependency-name: "actions/cache"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "actions/cache/save"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "actions/cache/restore"
        update-types:
          - "version-update:semver-major"
    groups:
      # Dependabot treats each `uses:` path as its own dependency, so a
      # multi-step action such as github/codeql-action/{init,analyze}
      # would otherwise bump one path per PR. Against the limit of 1 that
      # leaves the halves on different versions, which CodeQL rejects at
      # run time. One grouped PR keeps every pinned action in step.
      actions:
        patterns:
          - "*"
