name: Documentation Issue
description: Report stale, missing, or unclear documentation.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: path
    attributes:
      label: Doc path or page
      placeholder: docs/api-reference.md or https://pharos.watch/about/api/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is stale, missing, or confusing?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected wording or source of truth
      description: Link code, docs, or live behavior if you can.
