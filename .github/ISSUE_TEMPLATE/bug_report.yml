name: Bug Report
description: Report a reproducible bug in the public dashboard or API.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, verification tokens, private requester details, or secrets.
  - type: input
    id: affected-url
    attributes:
      label: Affected URL or endpoint
      placeholder: https://pharos.watch/... or /api/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Browser, device, or response context
      description: Include screenshots or redacted response snippets when useful.
