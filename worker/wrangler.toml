name = "stablecoin-api"
main = "src/index.ts"
compatibility_date = "2026-04-18"
# `status-self-check` probes the Worker through its public custom domains.
# Without global fetch semantics those same-Worker self-fetches can return
# Cloudflare 522s from inside the Worker even when external clients are healthy.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
preview_urls = true

routes = [
  { pattern = "api.pharos.watch", custom_domain = true },
  { pattern = "site-api.pharos.watch", custom_domain = true },
  { pattern = "ops-api.pharos.watch", custom_domain = true }
]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[limits]
# cpu_ms = total CPU milliseconds per invocation (not wall-clock time).
# logCronRun() timeouts are wall-clock and independent from this CPU budget.
cpu_ms = 30000

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
crons = [
  "*/15 * * * *",
  "9,24,39,54 * * * *",
  "3 */6 * * *",
  "4,34 * * * *",
  "6 */2 * * *",
  "13,43 * * * *",
  "0,30 * * * *",
  "10,40 * * * *",
  "16,46 * * * *",
  "26,56 * * * *",
  "11 */4 * * *",
  "20 * * * *",
  "25 */4 * * *",
  "2,7,12,17,22,27,32,37,42,47,52,57 * * * *",
  "1,6,11,16,21,26,31,36,41,46,51,56 * * * *",
  "*/5 * * * *",
  "0 8 * * *",
  "5 8 * * *",
  "10 8 * * *",
  "0 6 1 * *",
  "0 3 * * *",
]

[[d1_databases]]
binding = "DB"
database_name = "stablecoin-db"
database_id = "8f3f54ca-e035-4cdf-9ec5-a4fbbe48b27a"

[[ratelimits]]
name = "TELEGRAM_WEBHOOK_PREAUTH_RATE_LIMIT"
namespace_id = "2026071001"

  [ratelimits.simple]
  limit = 2400
  period = 60

[[ratelimits]]
name = "TELEGRAM_MINI_APP_SESSION_PREAUTH_RATE_LIMIT"
namespace_id = "2026071002"

  [ratelimits.simple]
  limit = 1600
  period = 60

[[ratelimits]]
name = "TELEGRAM_MINI_APP_MUTATION_PREAUTH_RATE_LIMIT"
namespace_id = "2026071003"

  [ratelimits.simple]
  limit = 9600
  period = 60

[vars]
CORS_ORIGIN = "https://pharos.watch,https://ops.pharos.watch"
SELF_URL = "https://api.pharos.watch"
ADDRESS_PRICE_PROVIDERS_ENABLED = "dexpaprika-address,coingecko-onchain-address,alchemy-address,moralis-address"
CF_ACCESS_TEAM_DOMAIN = "pharos-watch"
CF_ACCESS_OPS_API_AUD = "72e74ead7cedf76e5c79f2bd0dd999aecd7d5b4e05fa1f9d696aed6a2cd31869"
WORKER_JOB_LEDGER_MODE = "shadow"
WORKER_JOB_LEDGER_ALLOWLIST = "sync-dex-discovery,sync-live-reserves,reserve-recovery,sync-cl-exit-depth,sync-dex-liquidity,sync-stablecoins,sync-yield-data"
WORKER_CANARY_MODE = "shadow"
WORKER_RESERVE_RECOVERY_MODE = "shadow"
# Personalized recap is public. Set this to `off` for the kill switch or `canary`
# with chat IDs from `wrangler secret put TELEGRAM_RECAP_ROLLOUT_CHAT_IDS`.
TELEGRAM_RECAP_ROLLOUT_MODE = "public"
VAULTS_FYI_ENABLED = "true"
VAULTS_FYI_MAX_PAGES_PER_RUN = "1"
VAULTS_FYI_MAX_CREDITS_PER_RUN = "13"
VAULTS_FYI_MAX_CREDITS_PER_MONTH = "2500"
