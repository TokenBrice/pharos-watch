name = "stablecoin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "api.pharos.watch", custom_domain = true }
]

logpush = true

[limits]
cpu_ms = 5000

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
crons = [
  "*/15 * * * *",
  "3,23,43 * * * *",
  "10,40 * * * *",
  "0 8 * * *",
]

[[d1_databases]]
binding = "DB"
database_name = "stablecoin-db"
database_id = "8f3f54ca-e035-4cdf-9ec5-a4fbbe48b27a"

[vars]
CORS_ORIGIN = "https://pharos.watch"
