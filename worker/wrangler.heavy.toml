name = "stablecoin-heavy"
main = "src/index.heavy.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false
minify = true
keep_names = true
# Cloudflare stores the uploaded map privately and uses it to de-minify stack
# traces in Workers Logs; it is never served as a Pages asset.
upload_source_maps = true

[alias]
"#pharos-full-catalog" = "./src/lib/full-stablecoin-catalog.ts"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Placement hint near the known EEUR D1-primary region, not a pin or D1 host.
# Only default fetch handlers benefit; heavy scheduled handlers are unaffected.
[placement]
region = "aws:eu-central-1"

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Keep the packed payload out of JavaScript and its private source map.
[[rules]]
type = "Text"
globs = ["**/coins.worker-full.generated.json"]
fallthrough = true

[limits]
cpu_ms = 300000

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
crons = [
  "8 * * * *",
  "23 * * * *",
  "38 * * * *",
  "53 * * * *",
  "16 * * * *",
  "46 * * * *",
  "22 * * * *",
  "52 * * * *",
]

[vars]
# Safety Score V9 persist split, phase 2. `on` commits acceptance before staging
# public fragments; flip only after every public reader tolerates unselected
# staged rows (shipped with the reader in the same release as this flag).
SAFETY_V9_DEFERRED_MATERIALIZATION = "on"

[[d1_databases]]
binding = "DB"
database_name = "stablecoin-db"
database_id = "8f3f54ca-e035-4cdf-9ec5-a4fbbe48b27a"

[[r2_buckets]]
binding = "SAFETY_CAPTURE_ARCHIVE"
bucket_name = "pharos-measurements"
