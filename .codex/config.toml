[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/scripts/ci/pharos-change-contract.mjs" --hook=session-start'
timeout = 10
statusMessage = "Loading Pharos change contract"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/scripts/ci/pharos-change-contract.mjs" --hook=pre-tool-use'
timeout = 5
statusMessage = "Checking Pharos hard blocks"

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/scripts/ci/pharos-change-contract.mjs" --hook=permission-request'
timeout = 5
statusMessage = "Checking Pharos production policy"
