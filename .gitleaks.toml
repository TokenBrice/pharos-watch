# Gitleaks configuration for pharos-watch.
#
# Extends the default ruleset. The only repo-specific carve-out is for
# EVM contract/account addresses (0x + exactly 40 hex chars): they are
# public on-chain identifiers, not credentials, and keys named "token"
# or "collateralToken" in measurement targets/fixtures otherwise trip
# the generic-api-key rule.

[extend]
useDefault = true

# The trailing-punctuation class matters: reviewed `evidence` prose ends sentences
# with an address ("... FXD token impl = 0xe4cd2c8f....") and the matched secret span
# then carries the period, so a strictly anchored address regex misses it and the
# finding resurfaces as a false positive.
[[allowlists]]
description = "EVM addresses (0x + 40 hex) are public on-chain identifiers, not secrets"
regexTarget = "secret"
regexes = ['''^0x[a-fA-F0-9]{40}[.,;:)\]]?$''']

# Solana mint/vault ids are base58 (no 0, O, I or l) and 32-44 chars. They are public
# on-chain identifiers exactly like the EVM addresses above; curated risk-review rows
# cite them behind a source-family prefix (e.g. "kamino-ktoken:<mint>"). Line-pinned
# `.gitleaksignore` entries were the previous remedy for this class and they rot on
# every renumbering, which is why this lives here instead.
#
# Matched on the whole source LINE, and only with the `<source-family>:` prefix that
# makes it a curated registry reference. A bare base58 allowlist would be far too
# strong: roughly one generic alphanumeric API key in fourteen happens to contain no
# 0, O, I or l, and would be exempted along with it.
#
# The prefix repeats: failure-domain keys qualify the family further, as in
# `"solana:system-key:<pubkey>"`, so a single-segment prefix missed them and the
# finding resurfaced during the mint/bridge boundary migration.
[[allowlists]]
description = "Registry-prefixed Solana mint identifiers are public on-chain identifiers, not secrets"
regexTarget = "line"
regexes = ['''"(?:[a-z0-9]+(?:-[a-z0-9]+)*:)+[1-9A-HJ-NP-Za-km-z]{32,44}"''']

# Repo-relative source paths are not credentials. CI gates that enumerate route roots
# (`src/app/api`, `src/app/funding`, ...) otherwise trip the generic-api-key rule on
# their own configuration constants.
[[allowlists]]
description = "Repo-relative source paths in CI gate configuration are not secrets"
regexTarget = "secret"
regexes = ['''^(?:src|scripts|shared|worker|functions)/[A-Za-z0-9._/-]+$''']

[[allowlists]]
description = "Cron scheduleKey enum literals are public scheduler identifiers, not credentials"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''\b(?:\w+\.)?scheduleKey\b\s*(?::|={2,3})\s*["'][A-Za-z][A-Za-z0-9]+["']''']
paths = [
  '''(?:^|/)shared/lib/cron-jobs\.ts$''',
  '''(?:^|/)shared/lib/__tests__/cron-jobs\.test\.ts$''',
  '''(?:^|/)scripts/ci/check-cron-connection-budget\.test\.ts$''',
]

[[allowlists]]
description = "Cosmos IBC denoms (ibc/ + 64 hex) are public on-chain identifiers, not secrets"
regexTarget = "secret"
regexes = ['''^ibc/[A-F0-9]{64}$''']

# Issuers publish attestation and audit PDFs through GitBook, whose public
# download links carry an `?alt=media&token=<uuid>` CDN parameter. Curated
# `sources` arrays cite those links verbatim, so the token rides along in coin
# JSON and mechanism overlays. It grants read access to an already-public
# document and is not a credential.
#
# Matched on the whole source LINE rather than on the bare UUID: a naked UUID
# allowlist would exempt any secret that happens to be UUID-shaped. Scoped to
# the GitBook media host so only these download links qualify.
#
# Line-pinned `.gitleaksignore` entries were the previous remedy and they rot —
# inserting a field above the URL renumbers the line and the finding returns,
# which is exactly how it resurfaced during the v9.14 migration.
[[allowlists]]
description = "GitBook public file-download tokens in cited source URLs are not credentials"
regexTarget = "line"
regexes = ['''gitbook(-x-prod)?\.(io|appspot\.com)/[^"'\s]*[?&]alt=media&token=''']

# Falcon publishes asset labels such as `ARIA_B71VABWJ_T8GB`. Artifact V2
# records those labels as allocation `key` values, and the default
# generic-api-key rule mistakes the high-entropy suffixes for credentials.
# Match the finding itself, not the whole canonical one-line artifact, so a
# real credential elsewhere in the same file remains visible to the scanner.
[[allowlists]]
description = "Falcon public allocation labels in protocol API evidence are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^key":"[A-Z][A-Z0-9]{2,10}(?:_[A-Z0-9]{4,8}){1,2}"$''']
paths = ['''(?:^|/)shared/data/safety-score-v9/mechanism-measurements/usdf-falcon/[^/]+-protocol-api\.json$''']

# Movement xReserve attester keys are 64-byte Ed25519 public keys, so they render as
# `0x` plus 128 hex characters. The reviewed USDCx bridge control records them as its
# `controllerAddress` and inside `movement:xreserve-attester:<key>` failure domains,
# and their entropy trips the generic-api-key rule.
#
# Pinned to the two exact published keys rather than to the 128-hex shape. 64 bytes is
# also the size of an Ed25519 expanded secret key, so a shape-based exemption would
# blind the scanner to a real key of that form anywhere it applied. These two values
# are public attester identities read from Movement mainnet; a third attester, or any
# other high-entropy value in this file, still fails the scan.
[[allowlists]]
description = "The two published Movement xReserve attester public keys are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''0x2d4b0769063a340abaae3647366096e8b2a8b249f8bb2686d8418860592b2bb8dd6f3114c56b682f15135b60a84abf59c315ec54c49a0bb93d7d092a21bcf466''',
  '''0x6a4854078428eea517e8013827cba9f90583f8a9fdf8610c8791d1b04feb6a3eee428bf506c98ead1e870918f26a1d41f5bfb792b1e4f331679d1ad3e527326f''',
]
paths = ['''(?:^|/)shared/data/stablecoins/domains/risk-review/usdcx-movement\.json$''']

# Stellar Soroban contract identifiers are StrKey-encoded: `C` plus exactly 55
# base32 characters, optionally prefixed by their asset code as `CODE-C...`.
# They are public on-chain identifiers exactly like the EVM and Solana
# carve-outs above; DEX census fixtures and curated rows cite them verbatim,
# and their base32 entropy trips the generic-api-key rule when the surrounding
# variable or key mentions "token". The uppercase RFC 4648 base32 alphabet
# (A-Z, 2-7) plus the fixed C prefix and exact length keep this narrow: a real
# generic credential is effectively never shaped like a StrKey contract id.
[[allowlists]]
description = "Stellar Soroban StrKey contract identifiers are public on-chain identifiers, not secrets"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(?:[A-Z0-9]{1,12}-)?C[A-Z2-7]{55}$''']
