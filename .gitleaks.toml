# Gitleaks configuration for pharos-watch.
#
# Extends the default ruleset. The only repo-specific carve-out is for
# EVM contract/account addresses (0x + exactly 40 hex chars): they are
# public on-chain identifiers, not credentials, and keys named "token"
# or "collateralToken" in measurement targets/fixtures otherwise trip
# the generic-api-key rule.

[extend]
useDefault = true

# The trailing-punctuation class matters: reviewed `evidence` prose ends sentences
# with an address ("... FXD token impl = 0xe4cd2c8f....") and the matched secret span
# then carries the period, so a strictly anchored address regex misses it and the
# finding resurfaces as a false positive.
[[allowlists]]
description = "EVM addresses (0x + 40 hex) are public on-chain identifiers, not secrets"
regexTarget = "secret"
regexes = ['''^0x[a-fA-F0-9]{40}[.,;:)\]]?$''']

# Solana mint/vault ids are base58 (no 0, O, I or l) and 32-44 chars. They are public
# on-chain identifiers exactly like the EVM addresses above; curated risk-review rows
# cite them behind a source-family prefix (e.g. "kamino-ktoken:<mint>"). Line-pinned
# `.gitleaksignore` entries were the previous remedy for this class and they rot on
# every renumbering, which is why this lives here instead.
#
# Match only the finding span, with a registry prefix and curated-data path.
# Unrelated credentials on the same source line must remain detectable.
#
# The prefix repeats: failure-domain keys qualify the family further, as in
# `"solana:system-key:<pubkey>"`, so a single-segment prefix missed them and the
# finding resurfaced during the mint/bridge boundary migration.
[[allowlists]]
description = "Registry-prefixed Solana mint identifiers are public on-chain identifiers, not secrets"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^(?:[a-z0-9]+(?:-[a-z0-9]+)*:)+[1-9A-HJ-NP-Za-km-z]{32,44}"$''']
paths = ['''(?:^|/)shared/data/stablecoins/domains/risk-review/[^/]+\.json$''']

# Repo-relative source paths are not credentials. CI gates that enumerate route roots
# (`src/app/api`, `src/app/funding`, ...) otherwise trip the generic-api-key rule on
# their own configuration constants.
[[allowlists]]
description = "Repo-relative source paths in CI gate configuration are not secrets"
regexTarget = "secret"
regexes = ['''^(?:src|scripts|shared|worker|functions)/[A-Za-z0-9._/-]+$''']

[[allowlists]]
description = "Cron scheduleKey enum literals are public scheduler identifiers, not credentials"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''\b(?:\w+\.)?scheduleKey\b\s*(?::|={2,3})\s*["'][A-Za-z][A-Za-z0-9]+["']''']
paths = [
  '''(?:^|/)shared/lib/cron-jobs\.ts$''',
  '''(?:^|/)shared/lib/__tests__/cron-jobs\.test\.ts$''',
  '''(?:^|/)scripts/ci/check-cron-connection-budget\.test\.ts$''',
]

[[allowlists]]
description = "Cosmos IBC denoms (ibc/ + 64 hex) are public on-chain identifiers, not secrets"
regexTarget = "secret"
regexes = ['''^ibc/[A-F0-9]{64}$''']

# Tezos contract (KT1) and implicit (tz1/tz2/tz3) addresses are base58check public
# on-chain identifiers, 36 characters long, exactly like the EVM addresses above.
# The youves adapter and its fixtures pin engine/token contracts by address.
[[allowlists]]
description = "Tezos KT1/tz addresses are public on-chain identifiers, not secrets"
regexTarget = "secret"
regexes = ['''^(?:KT1|tz[123])[1-9A-HJ-NP-Za-km-z]{33}[.,;:)\]]?$''']

# Anvil/Hardhat default test account #1 private key. It is published in the Foundry
# and Hardhat documentation and holds nothing anywhere; the kerne-signed-por test
# signs synthetic proofs with it so the recovered signer is deterministic. Pinned to
# the exact value: any other 32-byte hex in that file still fails the scan.
[[allowlists]]
description = "Anvil default test account #1 key used to sign synthetic PoR fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$''']
paths = ['''(?:^|/)worker/src/cron/reserve-adapters/__tests__/kerne-signed-por\.test\.ts$''']

# Issuers publish attestation and audit PDFs through GitBook, whose public
# download links carry an `?alt=media&token=<uuid>` CDN parameter. Curated
# `sources` arrays cite those links verbatim, so the token rides along in coin
# JSON, mechanism overlays, and the reviewed missing-data ledger. It grants
# read access to an already-public document and is not a credential.
#
# Match only the reviewed public CDN token values, never an arbitrary UUID
# or a whole URL-bearing source line. New public tokens require review.
[[allowlists]]
description = "GitBook public file-download tokens in cited source URLs are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(?:54e9714e-c65f-4b0c-8bcf-c7869956dd20|3cad87ae-7846-4bfe-ba2e-411fbf166f60|cad709b6-47f1-427d-ad14-443fa5cd76e1|df75631f-9b3c-4524-81e4-f69b6baaf1e5|55e4e094-d2e5-4847-a47d-4277fc8e70c3|b41923ad-1f3b-42af-9ef3-625a1a029e21|7dce3beb-cc89-406f-a2df-a83b3737a021|fbbfb1d4-ca86-4186-93d9-400fe5a36be7)$''',
]
paths = [
  '''(?:^|/)shared/data/(?:stablecoins|safety-score-v9)/.*\.json$''',
  '''(?:^|/)data/ai-summaries\.json$''',
  '''(?:^|/)\.github/workflows/artifacts/safety-score-missing-data-reviewed-ledger\.json$''',
]

# The recorded Orca Whirlpool and Raydium CLMM quote fixtures pin the pool and
# token-mint pubkeys read at slot 449058549. Solana base58 account keys are
# public on-chain identifiers, exactly like the EVM/Tezos addresses above, but
# their length and entropy trip the generic-api-key rule. Match only the recorded
# keys in those two fixtures; any other high-entropy value there still fails.
[[allowlists]]
description = "Recorded Orca Whirlpool and Raydium CLMM pool and mint pubkeys in the slot-449058549 quote fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^(?:2e3WeM4WwdEqwTtRnWN3gJSbhNg1P6Aj2y7kEdfrYbix|6FrrzDk5mQARGc1TDYoyVnSyRdds1t4PbtohCD6p3tgG|EUGzX8kKvbLB55idiETEdXm6NZzB3Dz7c1ui6wGhcviR|JuprjznTrTSp2UFa3ZBUFgwdAmtZCq4MQCwysN55USD)$''']
paths = ['''(?:^|/)worker/src/cron/dex-liquidity/__tests__/fixtures/(?:whirlpool|raydium)-slot-449058549\.json$''']

# Falcon publishes asset labels such as `ARIA_B71VABWJ_T8GB`. Artifact V2
# records those labels as allocation `key` values, and the default
# generic-api-key rule mistakes the high-entropy suffixes for credentials.
# Match the finding itself, not the whole canonical one-line artifact, so a
# real credential elsewhere in the same file remains visible to the scanner.
[[allowlists]]
description = "Falcon public allocation labels in protocol API evidence are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^key":"[A-Z][A-Z0-9]{2,10}(?:_[A-Z0-9]{4,8}){1,2}"$''']
paths = ['''(?:^|/)shared/data/safety-score-v9/mechanism-measurements/usdf-falcon/[^/]+-protocol-api\.json$''']

# Movement xReserve attester keys are 64-byte Ed25519 public keys, so they render as
# `0x` plus 128 hex characters. The reviewed USDCx bridge control records them as its
# `controllerAddress` and inside `movement:xreserve-attester:<key>` failure domains,
# and their entropy trips the generic-api-key rule.
#
# Pinned to the two exact published keys rather than to the 128-hex shape. 64 bytes is
# also the size of an Ed25519 expanded secret key, so a shape-based exemption would
# blind the scanner to a real key of that form anywhere it applied. These two values
# are public attester identities read from Movement mainnet; a third attester, or any
# other high-entropy value in this file, still fails the scan.
[[allowlists]]
description = "The two published Movement xReserve attester public keys are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''0x2d4b0769063a340abaae3647366096e8b2a8b249f8bb2686d8418860592b2bb8dd6f3114c56b682f15135b60a84abf59c315ec54c49a0bb93d7d092a21bcf466''',
  '''0x6a4854078428eea517e8013827cba9f90583f8a9fdf8610c8791d1b04feb6a3eee428bf506c98ead1e870918f26a1d41f5bfb792b1e4f331679d1ad3e527326f''',
]
paths = ['''(?:^|/)shared/data/stablecoins/domains/risk-review/usdcx-movement\.json$''']

# Exact Cardano policy-id + asset-name identifiers, pinned to the published
# Cardano Foundation token registry in each transfer review's sources.
[[allowlists]]
description = "Reviewed USDA and USDM Cardano asset identifiers are public, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^fe7c786ab321f41c654ef6c1af7b3250a613c24e4213e0425a7ae45655534441$''',
  '''^c48cbb3d5e57ed56e276bc45f99ab39abe94e6cd7ac39fb402da47ad0014df105553444d$''',
]
paths = ['''(?:^|/)shared/data/safety-score-v9/transfer-review-overlays-v1\.json$''']

# API-key tests use one deliberately synthetic token/secret pair across parser,
# authentication, and request-gate fixtures. Pin both representations to those
# test files; a different token or secret in the same files still fails.
[[allowlists]]
description = "Canonical synthetic Pharos API-key fixture values"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^abcdefghijklmnopqrstuvwxyzABCDEF$''',
  '''^ph_live_(?:0123456789abcdef|ffffffffffffffff)_abcdefghijklmnopqrstuvwxyzABCDEF$''',
]
paths = [
  '''(?:^|/)worker/src/api/__tests__/api-keys\.test\.ts$''',
  '''(?:^|/)worker/src/lib/__tests__/api-keys\.test\.ts$''',
  '''(?:^|/)worker/src/__tests__/index\.fetch\.test\.ts$''',
  '''(?:^|/)worker/src/test-helpers/__shared/fixtures\.ts$''',
]

# API-key prefixes are public routing identifiers, not bearer secrets. Match the
# complete key-prefix field shape only inside API-key fixture files, so a real
# token or any other credential beside the field remains independently visible.
[[allowlists]]
description = "Public 16-hex API-key prefixes in API-key fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^(?:key_prefix|keyPrefix)\s*:\s*"[0-9a-f]{16}"$''']
paths = [
  '''(?:^|/)worker/src/api/__tests__/api-keys\.test\.ts$''',
  '''(?:^|/)worker/src/lib/__tests__/api-keys\.test\.ts$''',
  '''(?:^|/)worker/src/__tests__/index\.fetch\.test\.ts$''',
  '''(?:^|/)worker/src/test-helpers/__shared/fixtures\.ts$''',
]

# These are the exact public Solana accounts used by the staged-pool identity
# fixtures. The exemption is value-pinned and test-file-pinned rather than a
# generic base58 carve-out, because a similarly shaped private value must fail.
[[allowlists]]
description = "Public Solana pool and mint ids in staged-liquidity fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(?:9j7M8s9d5M5x6o8N9vQm3P4r5T6u7V8w9X1y2Z3a4Bc|9j7m8s9d5M5x6o8N9vQm3P4r5T6u7V8w9X1y2Z3a4Bc|EPjFWdd5AufqSSqeM2qA5N8Y7W5a4d8nQv1F6P5a6X1|Es9vMFrzaCERmJfrF4H2FY6q2JvE4YJzS83p2wM8wus|EJ3FwL8D2PkAaHmj1vawbR7fiUhXomt7vJhAaTBW4dnH|6GGYCNjZ5jqNFRfjJqCRdYiiTZY47LfweYAA4RRsYb4A|EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v|EeBX9JLdvsp4HnBbMgC1HnAjBkBQxgxtWxspcCLtT6ci|susdabGDNbhrnCa6ncrYo81u4s9GM8ecK2UwMyZiq4X|2D9mokxthTheNAU6hCWGRXdNmhNQoypHs1JcRCbwkgLL)$''',
]
paths = ['''(?:^|/)worker/src/cron/dex-liquidity/__tests__/staging-merge\.test\.ts$''']

# Exact public chain identifiers in discovery fixtures. Pairing the reviewed
# constants with only their owning fixture files avoids exempting arbitrary
# base32/base58 or ICON-looking credentials elsewhere (or beside them).
[[allowlists]]
description = "Reviewed Soroban and ICON identifiers in discovery fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(?:CBOOCGZSVRSZFRE4U2NWR2B4RXYVJWRCBTGOUD2JPI2TDJPWMTJX7FZP|CBGV2QFQBBGEQRUKUMCPO3SZOHDDYO6SCP5CH6TW7EALKVHCXTMWDDOF|CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA|CCY2PXGMKNQHO7WNYXEWX76L2C5BH3JUW3RCATGUYKY7QQTRILBZIFWV|cxa0af3165c08318e988cb30993b3048335b94af6c|cx88fd7df7ddff82f7cc735c871dc519838cb235bb|cx2609b924e33ef00b648a409245c7ea394c467824)$''',
]
paths = [
  '''(?:^|/)worker/src/cron/dex-discovery/__tests__/crawl-soroban-pools\.test\.ts$''',
  '''(?:^|/)worker/src/cron/dex-discovery/__tests__/crawl-icon-balanced-pools\.test\.ts$''',
]

# The recorded Raydium fixture contains public pool/mint accounts plus opaque
# binary account data. Only the two reviewed mint values are exempted.
[[allowlists]]
description = "Public mint ids in the recorded Raydium measured-execution fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(?:mzeroXDoBpRVhnEXBra27qzAMdxgpWVY3DzQW7xMVJp|EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v)$''',
]
paths = ['''(?:^|/)worker/src/cron/measured-execution/__tests__/fixtures/raydium-wm-usdc-single-segment-2026-07-27\.json$''']
