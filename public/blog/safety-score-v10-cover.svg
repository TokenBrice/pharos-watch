    <radialGradient id="ground" gradientUnits="userSpaceOnUse" cx="872" cy="315" r="900">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#06080B"/>
    </radialGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="872" cy="315" r="360">
