<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@400;500;600&amp;display=swap');
    </style>
    <radialGradient id="bgGradient" cx="26%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <radialGradient id="markAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DCC4" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#E8DCC4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3D27A" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#E2B656" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E2B656" stop-opacity="0"/>
    </radialGradient>
    <!-- Beacon light gathered by the lens -->
    <linearGradient id="intake" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F5EFDD" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F5EFDD" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Three sharper beams out of the focal point: the same three pillars -->
    <linearGradient id="sharp" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#E8DCC4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8DCC4" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#F5EFDD" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8DD8C"/>
      <stop offset="100%" stop-color="#C9962F"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBE7A6"/>
      <stop offset="100%" stop-color="#E8C266"/>
    </linearGradient>
    <filter id="beamBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9"/>
    </filter>
    <filter id="crispBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <!-- Current Pharos mark, on-dark variant (public/pharos-mark-on-dark.svg) -->
    <clipPath id="pharos-mark-disc-inverse">
      <rect width="400" height="400" rx="200" fill="white"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Ambient glow behind the mark -->
  <circle cx="275" cy="300" r="270" fill="url(#markAmbient)"/>

  <!-- Beacon light leaving the mark and gathered into the lens -->
  <g filter="url(#beamBlur)">
    <polygon points="275,309 450,247 450,371" fill="url(#intake)"/>
  </g>
  <!-- Converging from the lens to the focal point -->
  <g filter="url(#crispBlur)">
    <polygon points="463,251 515,305 515,313 463,367" fill="url(#focus)"/>
  </g>

  <!-- Three sharper beams from the focal point, one toward each pillar word -->
  <g filter="url(#crispBlur)">
    <polygon points="515,309 1240,99 1240,151" fill="url(#sharp)"/>
    <polygon points="515,309 1240,357 1240,409" fill="url(#sharp)" opacity="0.8"/>
    <polygon points="515,309 1240,614 1240,666" fill="url(#sharp)" opacity="0.6"/>
  </g>

  <!-- Background stars -->
  <circle cx="75" cy="60" r="1.2" fill="#E8DCC4" opacity="0.25"/>
  <circle cx="190" cy="125" r="0.8" fill="#E8DCC4" opacity="0.15"/>
  <circle cx="460" cy="48" r="1" fill="#E8DCC4" opacity="0.2"/>
  <circle cx="680" cy="72" r="1.2" fill="#E8DCC4" opacity="0.18"/>
  <circle cx="870" cy="118" r="0.9" fill="#E8DCC4" opacity="0.22"/>
  <circle cx="1020" cy="58" r="1.1" fill="#E8DCC4" opacity="0.15"/>
  <circle cx="1130" cy="165" r="0.8" fill="#E8DCC4" opacity="0.2"/>
  <circle cx="130" cy="495" r="0.9" fill="#E8DCC4" opacity="0.12"/>
  <circle cx="890" cy="580" r="1" fill="#E8DCC4" opacity="0.14"/>
  <circle cx="1090" cy="465" r="0.8" fill="#E8DCC4" opacity="0.1"/>
  <circle cx="1155" cy="300" r="0.9" fill="#E8DCC4" opacity="0.16"/>
  <circle cx="52" cy="335" r="1" fill="#E8DCC4" opacity="0.12"/>
  <circle cx="1040" cy="245" r="0.7" fill="#E8DCC4" opacity="0.13"/>
  <circle cx="620" cy="120" r="0.8" fill="#E8DCC4" opacity="0.14"/>
  <circle cx="400" cy="560" r="0.7" fill="#E8DCC4" opacity="0.12"/>

  <!-- Pharos mark, on-dark variant: exact paths and colours, scaled 0.6 and centred at (275, 300) -->
  <g transform="translate(155, 180) scale(0.6)">
    <g clip-path="url(#pharos-mark-disc-inverse)">
      <rect x="0.074707" y="-0.0454102" width="400" height="400" rx="200" fill="#0A0A0A"/>
      <path d="M199.744 -0.0454102C310.305 -0.0454102 399.932 89.5817 399.932 200.142C399.932 282.445 350.263 353.143 279.267 383.908L199.804 225.049L120.332 383.956C49.2768 353.216 -0.443273 282.487 -0.443359 200.142C-0.443359 89.5817 89.1838 -0.0453935 199.744 -0.0454102ZM199.811 49.9878C196.924 72.8227 194.083 95.6587 191.197 118.494C191.038 121.28 189.037 151.411 171.312 157.546C161.789 160.833 151.698 155.837 139.812 148.496C121.881 137.451 96.1096 118.778 68.5654 87.7476C83.5191 108.325 96.5872 126.909 107.609 142.972C123.245 165.719 129.654 175.889 126.063 185.925C123.382 193.376 116.131 197.979 97.0645 205.277C79.8151 211.895 55.4739 219.718 24.5889 225.043H159.76C159.762 202.926 177.693 184.997 199.811 184.997C221.928 184.997 239.859 202.926 239.861 225.043H375.01C344.147 219.718 319.784 211.895 302.534 205.277C283.467 197.979 276.24 193.376 273.559 185.925C269.946 175.889 276.377 165.719 291.989 142.972C303.034 126.909 316.08 108.325 331.033 87.7476C303.489 118.779 277.717 137.451 259.786 148.496C247.9 155.837 237.809 160.833 228.287 157.546C210.562 151.41 208.561 121.28 208.401 118.494C205.538 95.6587 202.674 72.8227 199.811 49.9878Z" fill="#EEEEEE"/>
    </g>
  </g>

  <!-- Lens: a biconvex glass that focuses the beacon light -->
  <path d="M455,237 Q481,309 455,381 Q429,309 455,237 Z" fill="url(#lensFill)" stroke="#E8DCC4" stroke-width="2.4" opacity="0.88" stroke-linejoin="round"/>
  <path d="M448,260 Q439,290 442,314" stroke="#FFF8E8" stroke-width="2" opacity="0.35" stroke-linecap="round"/>

  <!-- Gold bar at the focal point -->
  <circle cx="515" cy="309" r="44" fill="url(#goldGlow)"/>
  <g transform="translate(515, 310) scale(1.15)">
    <path d="M-15,-8 L15,-8 L20,8 L-20,8 Z" fill="url(#goldFace)"/>
    <path d="M-15,-8 L15,-8 L12,-12 L-12,-12 Z" fill="url(#goldTop)"/>
    <line x1="-12" y1="-4.5" x2="12" y2="-4.5" stroke="#FFF3C8" stroke-width="1.2" opacity="0.55"/>
  </g>

  <!-- Eyebrow -->
  <text x="572" y="190"
        font-family="'Inter', Arial, sans-serif"
        font-size="24" font-weight="600"
        fill="#4bc4de"
        letter-spacing="0.26em">SAFETY SCORE V10</text>

  <!-- Headline: the same three pillars -->
  <text x="569" y="282"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="86" font-weight="600"
        fill="#F5F0E6"
        letter-spacing="0.01em"
        filter="url(#softGlow)" opacity="0.55">Backing.</text>
  <text x="572" y="282"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="86" font-weight="600"
        fill="#F5F0E6"
        letter-spacing="0.01em">Backing.</text>
  <text x="572" y="368"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="86" font-weight="600"
        fill="#EFE7D6"
        letter-spacing="0.01em">Control.</text>
  <text x="572" y="454"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="86" font-weight="600"
        fill="#E8DCC4"
        letter-spacing="0.01em">Exit.</text>

  <!-- Separator -->
  <line x1="575" y1="500" x2="1120" y2="500" stroke="#E8DCC4" stroke-width="1.2" opacity="0.16"/>

  <!-- Footer -->
  <text x="575" y="538"
        font-family="'Inter', Arial, sans-serif"
        font-size="19" font-weight="400"
        fill="#E8DCC4" opacity="0.55"
        letter-spacing="0.03em">Same Pillars · Sharper Measurements</text>
</svg>
