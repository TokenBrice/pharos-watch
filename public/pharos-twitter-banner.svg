<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>
    <radialGradient id="bgGradient" cx="42%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <radialGradient id="lanternAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DCC4" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#E8DCC4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DCC4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4C8B0"/>
      <stop offset="40%" stop-color="#E8DCC4"/>
      <stop offset="100%" stop-color="#C8BBAA"/>
    </linearGradient>
    <filter id="sg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beamBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGradient)"/>

  <!-- Large ambient glow behind lighthouse -->
  <circle cx="545" cy="200" r="250" fill="url(#lanternAmbient)"/>

  <!-- Extended light beams from lantern position (~545, 176) -->
  <g filter="url(#beamBlur)">
    <line x1="545" y1="176" x2="545" y2="0" stroke="#E8DCC4" stroke-width="3.5" opacity="0.14"/>
    <line x1="545" y1="176" x2="300" y2="0" stroke="#E8DCC4" stroke-width="3" opacity="0.10"/>
    <line x1="545" y1="176" x2="790" y2="0" stroke="#E8DCC4" stroke-width="3" opacity="0.10"/>
    <line x1="545" y1="176" x2="50" y2="50" stroke="#E8DCC4" stroke-width="2.5" opacity="0.06"/>
    <line x1="545" y1="176" x2="1050" y2="40" stroke="#E8DCC4" stroke-width="2.5" opacity="0.06"/>
    <line x1="545" y1="176" x2="0" y2="140" stroke="#E8DCC4" stroke-width="2" opacity="0.035"/>
    <line x1="545" y1="176" x2="1450" y2="90" stroke="#E8DCC4" stroke-width="2" opacity="0.035"/>
  </g>

  <!-- Background stars -->
  <circle cx="95" cy="72" r="1.2" fill="#E8DCC4" opacity="0.25"/>
  <circle cx="250" cy="155" r="0.8" fill="#E8DCC4" opacity="0.15"/>
  <circle cx="430" cy="55" r="1" fill="#E8DCC4" opacity="0.2"/>
  <circle cx="810" cy="85" r="1.2" fill="#E8DCC4" opacity="0.18"/>
  <circle cx="980" cy="130" r="0.9" fill="#E8DCC4" opacity="0.22"/>
  <circle cx="1120" cy="65" r="1.1" fill="#E8DCC4" opacity="0.15"/>
  <circle cx="1280" cy="110" r="0.8" fill="#E8DCC4" opacity="0.2"/>
  <circle cx="1400" cy="55" r="1" fill="#E8DCC4" opacity="0.17"/>
  <circle cx="170" cy="390" r="0.9" fill="#E8DCC4" opacity="0.12"/>
  <circle cx="1070" cy="410" r="1" fill="#E8DCC4" opacity="0.14"/>
  <circle cx="1330" cy="360" r="0.8" fill="#E8DCC4" opacity="0.1"/>
  <circle cx="320" cy="440" r="1.1" fill="#E8DCC4" opacity="0.1"/>
  <circle cx="1420" cy="210" r="0.9" fill="#E8DCC4" opacity="0.16"/>
  <circle cx="60" cy="260" r="1" fill="#E8DCC4" opacity="0.12"/>
  <circle cx="1200" cy="290" r="0.7" fill="#E8DCC4" opacity="0.13"/>
  <circle cx="500" cy="420" r="0.9" fill="#E8DCC4" opacity="0.08"/>

  <!-- Lighthouse icon — scaled 2.66x, centered at (545, 250) -->
  <g transform="translate(545, 250) scale(2.66) translate(-44, -44)">
    <!-- Glow behind lantern -->
    <circle cx="44" cy="16" r="16" fill="url(#iconGlow)"/>

    <!-- Beams -->
    <line x1="44" y1="16" x2="44" y2="-4" stroke="#E8DCC4" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="22" y2="-2" stroke="#E8DCC4" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="66" y2="-2" stroke="#E8DCC4" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="4" y2="4" stroke="#E8DCC4" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="84" y2="4" stroke="#E8DCC4" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="-4" y2="14" stroke="#E8DCC4" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="92" y2="14" stroke="#E8DCC4" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>

    <!-- Shield outline -->
    <path d="M14,8 L74,8 L74,36 Q74,74 44,84 Q14,74 14,36 Z" fill="none" stroke="#E8DCC4" stroke-width="2.5" opacity="0.45" stroke-linejoin="round"/>

    <!-- Lantern light -->
    <circle cx="44" cy="16" r="5" fill="white" opacity="0.85" filter="url(#sg)"/>

    <!-- Dome -->
    <path d="M39,22 C39,14 49,14 49,22 Z" fill="#E8DCC4" opacity="0.9"/>

    <!-- Lantern room -->
    <rect x="38.5" y="22" width="11" height="7" rx="1" fill="#F5F0E6" opacity="0.85"/>
    <line x1="42" y1="22" x2="42" y2="29" stroke="#0a1628" stroke-width="0.8" opacity="0.3"/>
    <line x1="46" y1="22" x2="46" y2="29" stroke="#0a1628" stroke-width="0.8" opacity="0.3"/>

    <!-- Gallery -->
    <rect x="34" y="29" width="20" height="4" rx="1.5" fill="#E8DCC4" opacity="0.85"/>

    <!-- Tower shaft -->
    <path d="M37,33 L51,33 L54,66 L34,66 Z" fill="url(#tBody)" opacity="0.8"/>
    <line x1="36.2" y1="44" x2="52.2" y2="44" stroke="#0d1f3c" stroke-width="2" opacity="0.35"/>
    <line x1="35.3" y1="55" x2="53.1" y2="55" stroke="#0d1f3c" stroke-width="2" opacity="0.35"/>

    <!-- Base -->
    <rect x="30" y="66" width="28" height="5" rx="2.5" fill="#E8DCC4" opacity="0.7"/>
    <rect x="26" y="71" width="36" height="5" rx="2.5" fill="#E8DCC4" opacity="0.45"/>
  </g>

  <!-- "Pharos" title -->
  <text x="675" y="248"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="108" font-weight="500"
        fill="#F5F0E6"
        letter-spacing="0.06em">Pharos</text>

  <!-- Decorative separator -->
  <line x1="678" y1="270" x2="878" y2="270" stroke="#E8DCC4" stroke-width="1.2" opacity="0.18"/>

  <!-- Tagline -->
  <text x="680" y="305"
        font-family="'Inter', Arial, sans-serif"
        font-size="30" font-weight="400"
        fill="#E8DCC4" opacity="0.50"
        letter-spacing="0.1em">Light on Every Peg</text>
</svg>
